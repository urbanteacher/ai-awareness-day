<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">A forger and a detective</title><desc id="d">A generative adversarial network has two parts. The generator makes fake pictures; the discriminator sees real and fake ones and guesses which is which. Each learns from the other: the generator from being caught, the discriminator from its mistakes. Training aims for fakes the discriminator can only guess at, right about half the time.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="50" width="120" height="70" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="80" y="72" font-size="10.5" font-weight="800" text-anchor="middle" fill="#6441B8">GENERATOR</text><text x="80" y="92" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">the forger:</text><text x="80" y="106" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">makes fakes</text><rect x="20" y="140" width="120" height="50" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="80" y="160" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">real photos</text><text x="80" y="178" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">from the training set</text><line x1="142" y1="85" x2="196" y2="112" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="142" y1="165" x2="196" y2="132" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="198" y="90" width="120" height="70" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="258" y="112" font-size="10.5" font-weight="800" text-anchor="middle" fill="#A7350B">DISCRIMINATOR</text><text x="258" y="132" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">the detective:</text><text x="258" y="146" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">real or fake?</text><path d="M258 88 Q195.0 92.4 142 58" fill="none" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="232" y="50" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">caught! the forger learns</text><rect x="330" y="50" width="90" height="140" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="375" y="68" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">FAKES CAUGHT</text><text x="342" y="92" font-size="9.5" font-weight="700" text-anchor="start" fill="#5f5a52">round 1</text><rect x="342" y="97" width="39" height="10" fill="#FF7038" stroke="#231F20" stroke-width=".8"/><text x="412" y="106" font-size="9.5" font-weight="800" text-anchor="end" fill="#231F20">98%</text><text x="342" y="128" font-size="9.5" font-weight="700" text-anchor="start" fill="#5f5a52">round 50</text><rect x="342" y="133" width="30" height="10" fill="#FF7038" stroke="#231F20" stroke-width=".8"/><text x="412" y="142" font-size="9.5" font-weight="800" text-anchor="end" fill="#231F20">75%</text><text x="342" y="164" font-size="9.5" font-weight="700" text-anchor="start" fill="#5f5a52">round 500</text><rect x="342" y="169" width="21" height="10" fill="#FF7038" stroke="#231F20" stroke-width=".8"/><text x="412" y="178" font-size="9.5" font-weight="800" text-anchor="end" fill="#231F20">52%</text><rect x="20" y="210" width="400" height="66" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">When the detective is right only about half the time,</text><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">it is guessing: the fakes look real.</text><text x="220" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Most image tools now use diffusion models instead.</text></g></svg>