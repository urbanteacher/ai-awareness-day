<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">See the screen, decide, click, look again</title><desc id="d">A computer-use agent works in a loop: take a screenshot, decide the next step, move the cursor and click or type, then take a new screenshot to see what happened. It can use any app a person can, but it is slower than a direct connection, can misclick, and can be misled by text on screen.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="30" y="40" width="160" height="40" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="110" y="65" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">screenshot</text><rect x="250" y="40" width="160" height="40" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="330" y="65" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">decide next step</text><rect x="250" y="120" width="160" height="40" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="330" y="145" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">click or type</text><rect x="30" y="120" width="160" height="40" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="110" y="145" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">look again</text><line x1="192" y1="60" x2="248" y2="60" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="330" y1="82" x2="330" y2="118" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="248" y1="140" x2="192" y2="140" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="110" y1="118" x2="110" y2="82" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="170" y="86" width="100" height="30" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="220" y="106" font-size="9" font-weight="700" text-anchor="middle" fill="#5f5a52">cursor at (412, 88)</text><rect x="20" y="176" width="196" height="102" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="118" y="196" font-size="10" font-weight="800" text-anchor="middle" fill="#176E3B">CAN</text><text x="118" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">use any app a person can</text><text x="118" y="231" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">even with no API</text><text x="118" y="246" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">fill in forms, move files</text><rect x="224" y="176" width="196" height="102" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="322" y="196" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">WATCH OUT</text><text x="322" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">slower; can misclick</text><text x="322" y="231" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">text on screen can mislead it</text><text x="322" y="246" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">confirm sends, pays, deletes</text></g></svg>