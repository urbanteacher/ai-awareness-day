<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Collect, clean, prepare, check</title><desc id="d">A data pipeline moves data automatically from where it is collected to where it is used. It collects records, cleans them (removing duplicates, fixing dates, handling blanks), prepares them (labels, splits into training and test sets), checks quality at each stage, and stores them for training.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20.0" y="36" width="92.5" height="60" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="66.2" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">COLLECT</text><text x="66.2" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">forms, sensors,</text><text x="66.2" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">records</text><line x1="113.5" y1="66.0" x2="121.5" y2="66.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="122.5" y="36" width="92.5" height="60" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="168.8" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">CLEAN</text><text x="168.8" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">fix and remove</text><line x1="216.0" y1="66.0" x2="224.0" y2="66.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="225.0" y="36" width="92.5" height="60" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="271.2" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PREPARE</text><text x="271.2" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">label, split</text><line x1="318.5" y1="66.0" x2="326.5" y2="66.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="327.5" y="36" width="92.5" height="60" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="373.8" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">STORE</text><text x="373.8" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">ready to train</text><circle cx="66.0" cy="112" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M62.0 112l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><circle cx="168.5" cy="112" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M164.5 112l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><circle cx="271.0" cy="112" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M267.0 112l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><circle cx="373.5" cy="112" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M369.5 112l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="220" y="136" font-size="10" font-weight="700" text-anchor="middle" fill="#176E3B">quality checks at every stage</text><rect x="20" y="150" width="400" height="80" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="170" font-size="10" font-weight="800" text-anchor="start" fill="#A7350B">CLEANING, FOR EXAMPLE</text><text x="32" y="190" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">"3/4/26" and "2026-04-03"</text><text x="260" y="190" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">→ one date format</text><text x="32" y="206" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">Amira K. listed twice</text><text x="260" y="206" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">→ one record</text><text x="32" y="222" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">age: blank</text><text x="260" y="222" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">→ flag, don't guess</text><rect x="20" y="240" width="400" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="265" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">Rubbish in, rubbish out: the pipeline decides what the model learns.</text></g></svg>