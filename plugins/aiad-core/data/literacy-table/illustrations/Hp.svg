<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Where the extra value comes from</title><desc id="d">Two similar pots: one AI-designed and machine-made, one made by hand. The handmade one is worth more because of its story, the maker's skill and time, and proof that a person made it, such as a record of the making or a verified label like Content Credentials.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><path d="M90 50 h50 l10 18 c14 24 8 56 -10 72 h-50 c-18 -16 -24 -48 -10 -72 z" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="115" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">AI-designed, machine-made</text><text x="115" y="194" font-size="20" font-weight="800" text-anchor="middle" fill="#5f5a52">£5</text><path d="M300 50 h50 l10 18 c14 24 8 56 -10 72 h-50 c-18 -16 -24 -48 -10 -72 z" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="325" y="168" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Made by hand, proven</text><text x="325" y="194" font-size="20" font-weight="800" text-anchor="middle" fill="#176E3B">£40</text><rect x="20" y="218" width="94" height="44" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="67" y="236" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">the maker's</text><text x="67" y="249" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">story</text><rect x="122" y="218" width="94" height="44" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="169" y="236" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">skill and</text><text x="169" y="249" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">hours</text><rect x="224" y="218" width="94" height="44" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="271" y="236" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">record of the</text><text x="271" y="249" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">making</text><rect x="326" y="218" width="94" height="44" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="373" y="236" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">verified</text><text x="373" y="249" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">label</text><text x="220" y="284" font-size="11.5" font-weight="700" text-anchor="middle" fill="#176E3B">What adds the £35: trust that a person made it.</text></g></svg>