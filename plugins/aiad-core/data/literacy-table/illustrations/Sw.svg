<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Simple rules, group behaviour</title><desc id="d">In an agent swarm, each agent follows a few simple rules and only notices its neighbours. Ants, for example, follow trails and strengthen the ones that lead to food. No one is in charge, yet the group finds the short route. Software swarms use the same idea; they can be robust but hard to predict.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="260" height="190" fill="#fff" stroke="#231F20" stroke-width="1.4"/><circle cx="46" cy="200" r="14" fill="#D6F4FA" stroke="#231F20" stroke-width="1.3"/><text x="46" y="204" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">nest</text><circle cx="250" cy="66" r="14" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><text x="250" y="70" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">food</text><path d="M60 192 C120 150 180 110 238 74" fill="none" stroke="#FF7038" stroke-width="7" opacity=".35"/><path d="M60 206 C150 230 260 180 254 82" fill="none" stroke="#FF7038" stroke-width="2" opacity=".35" stroke-dasharray="3 4"/><circle cx="57" cy="193" r="3.5" fill="#231F20"/><circle cx="70" cy="185" r="3.5" fill="#231F20"/><circle cx="85" cy="171" r="3.5" fill="#231F20"/><circle cx="90" cy="172" r="3.5" fill="#231F20"/><circle cx="105" cy="157" r="3.5" fill="#231F20"/><circle cx="125" cy="152" r="3.5" fill="#231F20"/><circle cx="135" cy="145" r="3.5" fill="#231F20"/><circle cx="145" cy="133" r="3.5" fill="#231F20"/><circle cx="157" cy="133" r="3.5" fill="#231F20"/><circle cx="167" cy="124" r="3.5" fill="#231F20"/><circle cx="181" cy="108" r="3.5" fill="#231F20"/><circle cx="194" cy="107" r="3.5" fill="#231F20"/><circle cx="200" cy="92" r="3.5" fill="#231F20"/><circle cx="219" cy="89" r="3.5" fill="#231F20"/><circle cx="229" cy="86" r="3.5" fill="#231F20"/><circle cx="241" cy="79" r="3.5" fill="#231F20"/><circle cx="191" cy="206" r="3.5" fill="#5f5a52"/><circle cx="124" cy="196" r="3.5" fill="#5f5a52"/><circle cx="114" cy="154" r="3.5" fill="#5f5a52"/><circle cx="124" cy="213" r="3.5" fill="#5f5a52"/><circle cx="145" cy="183" r="3.5" fill="#5f5a52"/><text x="150" y="244" font-size="10" font-weight="700" text-anchor="middle" fill="#A7350B">the short trail gets the strongest scent</text><rect x="292" y="36" width="128" height="112" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="356" y="56" font-size="9.5" font-weight="800" text-anchor="middle" fill="#6441B8">EACH ANT'S RULES</text><text x="356" y="78" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">follow the</text><text x="356" y="92" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">strongest scent</text><text x="356" y="106" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">leave scent when</text><text x="356" y="120" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">carrying food</text><rect x="292" y="158" width="128" height="68" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="356" y="178" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">no leader,</text><text x="356" y="193" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">yet the group</text><text x="356" y="208" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">finds the route</text><text x="220" y="276" font-size="11" font-weight="700" text-anchor="middle" fill="#5f5a52">Robust if a few fail, but hard to predict.</text></g></svg>