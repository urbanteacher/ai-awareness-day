<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Compare the options, then recommend one</title><desc id="d">Prescriptive analytics takes a forecast, such as rain likely at 2pm on sports day, and tests each option against it and the constraints: start at 10am, move indoors, or postpone. It scores each one and recommends the best, leaving the final decision to people.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="36" fill="#FDE3F9" stroke="#231F20" stroke-width="1.5"/><text x="220" y="59" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Forecast: 80% chance of rain from 2pm on sports day</text><rect x="20" y="84" width="400" height="48" fill="#DDF8E7" stroke="#231F20" stroke-width="2.5"/><text x="34" y="104" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Start at 10am</text><text x="34" y="122" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">done by 1:30</text><text x="300" y="112" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">all events</text><circle cx="398" cy="108" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M394 108l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><rect x="20" y="140" width="400" height="48" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="34" y="160" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Move indoors</text><text x="34" y="178" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">hall too small</text><text x="300" y="168" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">half the events</text><circle cx="398" cy="164" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M394.5 160.5l7 7M401.5 160.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><rect x="20" y="196" width="400" height="48" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="34" y="216" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Postpone a week</text><text x="34" y="234" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">clashes with exams</text><text x="300" y="224" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">all events, later</text><circle cx="398" cy="220" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M394.5 216.5l7 7M401.5 216.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="220" y="270" font-size="12" font-weight="700" text-anchor="middle" fill="#176E3B">Recommended: start at 10am. A person still decides.</text></g></svg>