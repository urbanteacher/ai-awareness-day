<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Two kinds of explanation</title><desc id="d">A model that flags pupils who may need reading support. A global explanation shows what it relies on overall: reading age 45%, quiz scores 30%, attendance 15%, other 10%. A local explanation shows why it flagged one pupil, Sam: a low quiz score pushed towards flagging, good attendance pushed against.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">FLAG PUPILS FOR READING SUPPORT</text><rect x="20" y="40" width="196" height="236" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="118" y="60" font-size="11" font-weight="800" text-anchor="middle" fill="#A7350B">GLOBAL</text><text x="118" y="76" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">what it relies on overall</text><text x="32" y="96" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">reading age</text><rect x="32" y="103" width="150.0" height="14" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="188.0" y="115" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">45%</text><text x="32" y="138" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">quiz scores</text><rect x="32" y="145" width="100.0" height="14" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="138.0" y="157" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">30%</text><text x="32" y="180" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">attendance</text><rect x="32" y="187" width="50.0" height="14" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="88.0" y="199" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">15%</text><text x="32" y="222" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">other</text><rect x="32" y="229" width="33.3" height="14" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="71.33333333333334" y="241" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">10%</text><rect x="224" y="40" width="196" height="236" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="322" y="60" font-size="11" font-weight="800" text-anchor="middle" fill="#006A7D">LOCAL</text><text x="322" y="76" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">why it flagged Sam</text><line x1="322" y1="92" x2="322" y2="214" stroke="#231F20" stroke-width="1.2"/><text x="296" y="104" font-size="10" font-weight="400" text-anchor="end" fill="#5f5a52">← against</text><text x="348" y="104" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">towards →</text><rect x="322" y="124" width="70" height="16" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><text x="314" y="136" font-size="10" font-weight="700" text-anchor="end" fill="#231F20">low quiz score</text><rect x="322" y="156" width="35" height="16" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><text x="314" y="168" font-size="10" font-weight="700" text-anchor="end" fill="#231F20">reading age</text><rect x="282" y="188" width="40" height="16" fill="#fff" stroke="#231F20" stroke-width="1"/><text x="330" y="200" font-size="10" font-weight="700" text-anchor="start" fill="#231F20">good attendance</text><rect x="236" y="226" width="172" height="38" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="322" y="250" font-size="13" font-weight="800" text-anchor="middle" fill="#231F20">Result: flagged</text></g></svg>