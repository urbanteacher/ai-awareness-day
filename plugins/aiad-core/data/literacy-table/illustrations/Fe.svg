<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Three ways to make better features</title><desc id="d">Feature engineering turns raw data into inputs a model can use. Combine: 36 books in 3 years becomes 12 books a year. Transform: a date of birth becomes an age. Encode: a favourite genre becomes columns of 1s and 0s, because models work with numbers.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="105" y="30" font-size="10.5" font-weight="800" text-anchor="middle" fill="#5f5a52">RAW DATA</text><text x="330" y="30" font-size="10.5" font-weight="800" text-anchor="middle" fill="#5f5a52">FEATURE FOR THE MODEL</text><text x="20" y="54" font-size="10.5" font-weight="800" text-anchor="start" fill="#006A7D">COMBINE</text><rect x="20" y="62" width="170" height="40" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="105" y="87" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">36 books, 3 years</text><line x1="192" y1="82" x2="228" y2="82" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="230" y="62" width="190" height="40" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="325" y="87" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">12 books a year</text><text x="20" y="128" font-size="10.5" font-weight="800" text-anchor="start" fill="#FF7038">TRANSFORM</text><rect x="20" y="136" width="170" height="40" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="105" y="161" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">born 14 May 2012</text><line x1="192" y1="156" x2="228" y2="156" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="230" y="136" width="190" height="40" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="325" y="161" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">age 14</text><text x="20" y="202" font-size="10.5" font-weight="800" text-anchor="start" fill="#AC91FF">ENCODE</text><rect x="20" y="210" width="170" height="40" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="105" y="235" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">favourite: fantasy</text><line x1="192" y1="230" x2="228" y2="230" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="230" y="210" width="190" height="40" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="325" y="235" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">fantasy 1 · crime 0 · sport 0</text><text x="220" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#A7350B">Models only see numbers: good features make the pattern easy to find.</text></g></svg>