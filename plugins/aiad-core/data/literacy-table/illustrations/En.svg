<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Act the moment it happens</title><desc id="d">A booking is made at 9:02. An automation that checks on a schedule, every 15 minutes, only spots it at 9:15 and wastes checks when nothing has happened. An event-driven automation is told straight away, usually by a webhook, and acts at 9:02.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">A BOOKING IS MADE AT 9:02</text><text x="20" y="50" font-size="10.5" font-weight="800" text-anchor="start" fill="#A7350B">CHECKS EVERY 15 MINUTES</text><line x1="40" y1="86" x2="400" y2="86" stroke="#231F20" stroke-width="1.4"/><line x1="40" y1="81" x2="40" y2="91" stroke="#231F20" stroke-width="1.4"/><text x="40" y="106" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">9:00</text><line x1="220" y1="81" x2="220" y2="91" stroke="#231F20" stroke-width="1.4"/><text x="220" y="106" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">9:15</text><line x1="400" y1="81" x2="400" y2="91" stroke="#231F20" stroke-width="1.4"/><text x="400" y="106" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">9:30</text><circle cx="64" cy="86" r="6" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><circle cx="40" cy="70" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="220" cy="70" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="400" cy="70" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="70" y1="70" x2="212" y2="70" stroke="#A7350B" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="226" y="62" font-size="10.5" font-weight="800" text-anchor="start" fill="#A7350B">spotted at 9:15</text><text x="20" y="140" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">EVENT-DRIVEN</text><line x1="40" y1="176" x2="400" y2="176" stroke="#231F20" stroke-width="1.4"/><line x1="40" y1="171" x2="40" y2="181" stroke="#231F20" stroke-width="1.4"/><text x="40" y="196" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">9:00</text><line x1="220" y1="171" x2="220" y2="181" stroke="#231F20" stroke-width="1.4"/><text x="220" y="196" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">9:15</text><line x1="400" y1="171" x2="400" y2="181" stroke="#231F20" stroke-width="1.4"/><text x="400" y="196" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">9:30</text><circle cx="64" cy="176" r="6" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><circle cx="64" cy="158" r="7" fill="#63DF93" stroke="#231F20" stroke-width="1"/><text x="78" y="162" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">acts at 9:02: told the moment it happens</text><rect x="20" y="236" width="400" height="44" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="254" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Faster, with no wasted checks.</text><text x="220" y="269" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Usually set up with triggers and webhooks.</text></g></svg>