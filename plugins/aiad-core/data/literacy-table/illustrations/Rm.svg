<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Thinking before answering</title><desc id="d">A bat and a ball cost £1.10 in total; the bat costs £1 more than the ball. A quick answer says the ball costs 10p, which is wrong. A reasoning model works through steps first, checks them, and finds 5p. The extra thinking helps with maths, code and logic, but takes longer and costs more.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="52" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">A bat and a ball cost £1.10. The bat costs £1 more</text><text x="220" y="67" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">than the ball. How much is the ball?</text><rect x="20" y="88" width="150" height="110" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="95" y="108" font-size="10" font-weight="800" text-anchor="middle" fill="#5f5a52">QUICK ANSWER</text><text x="95" y="146" font-size="18" font-weight="800" text-anchor="middle" fill="#9b1c14">"10p"</text><circle cx="95" cy="176" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M91.5 172.5l7 7M98.5 172.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><rect x="180" y="88" width="240" height="110" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="300" y="108" font-size="10" font-weight="800" text-anchor="middle" fill="#176E3B">REASONING MODEL</text><text x="194" y="128" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">ball = x, bat = x + £1</text><text x="194" y="144" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">x + x + £1 = £1.10, so 2x = 10p</text><text x="194" y="160" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">check: 5p + £1.05 = £1.10 ✓</text><text x="300" y="188" font-size="14" font-weight="800" text-anchor="middle" fill="#176E3B">"5p"</text><rect x="20" y="212" width="400" height="66" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="234" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Better at maths, code and logic.</text><text x="220" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Slower and dearer: more thinking means more computing.</text><text x="220" y="266" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Its steps can still go wrong, so check them.</text></g></svg>