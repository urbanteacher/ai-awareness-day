<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Small enough to run on your phone</title><desc id="d">A small language model has a few billion parameters or fewer, so it can run on a phone or laptop: fast, cheap, offline, and private because your words stay on the device. A large model in a data centre knows far more and reasons better. Many apps use both: small for quick jobs, large for hard ones.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="170" height="160" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><rect x="88" y="50" width="34" height="58" rx="6" fill="#fff" stroke="#231F20" stroke-width="1.5"/><circle cx="105" cy="79" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1"/><text x="105" y="126" font-size="10.5" font-weight="800" text-anchor="middle" fill="#176E3B">SMALL MODEL</text><text x="105" y="142" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">a few billion numbers</text><text x="105" y="162" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">on the device: fast,</text><text x="105" y="176" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">offline, private</text><rect x="250" y="36" width="170" height="160" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><rect x="284" y="50" width="30" height="58" fill="#fff" stroke="#231F20" stroke-width="1.3"/><line x1="288" y1="58" x2="310" y2="58" stroke="#5f5a52" stroke-width="2"/><line x1="288" y1="70" x2="310" y2="70" stroke="#5f5a52" stroke-width="2"/><line x1="288" y1="82" x2="310" y2="82" stroke="#5f5a52" stroke-width="2"/><line x1="288" y1="94" x2="310" y2="94" stroke="#5f5a52" stroke-width="2"/><rect x="320" y="50" width="30" height="58" fill="#fff" stroke="#231F20" stroke-width="1.3"/><line x1="324" y1="58" x2="346" y2="58" stroke="#5f5a52" stroke-width="2"/><line x1="324" y1="70" x2="346" y2="70" stroke="#5f5a52" stroke-width="2"/><line x1="324" y1="82" x2="346" y2="82" stroke="#5f5a52" stroke-width="2"/><line x1="324" y1="94" x2="346" y2="94" stroke="#5f5a52" stroke-width="2"/><rect x="356" y="50" width="30" height="58" fill="#fff" stroke="#231F20" stroke-width="1.3"/><line x1="360" y1="58" x2="382" y2="58" stroke="#5f5a52" stroke-width="2"/><line x1="360" y1="70" x2="382" y2="70" stroke="#5f5a52" stroke-width="2"/><line x1="360" y1="82" x2="382" y2="82" stroke="#5f5a52" stroke-width="2"/><line x1="360" y1="94" x2="382" y2="94" stroke="#5f5a52" stroke-width="2"/><text x="335" y="126" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">LARGE MODEL</text><text x="335" y="142" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">hundreds of billions</text><text x="335" y="162" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">in a data centre: knows</text><text x="335" y="176" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">more, reasons better</text><text x="220" y="120" font-size="13" font-weight="800" text-anchor="middle" fill="#5f5a52">vs</text><rect x="20" y="210" width="400" height="68" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Many apps use both: the small one for quick jobs</text><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">(autocorrect, summaries), the large one for hard ones.</text><text x="220" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Smaller means less knowledge, so check its facts.</text></g></svg>