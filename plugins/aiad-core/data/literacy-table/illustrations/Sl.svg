<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Bigger, more data, more computing: steadily better</title><desc id="d">Researchers found that when models get more computing power for training, their error falls along a smooth, predictable curve. The 2022 Chinchilla study showed that size and data should grow together, roughly 20 words of training text for every parameter. Each improvement costs more, and the pattern is an observation, not a law of nature.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">ERROR AS TRAINING COMPUTING GROWS</text><path d="M40 40 V190 H410" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="410" y="204" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">computing power (each step ×10) →</text><text x="36" y="36" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">error ↑</text><polyline points="50,60 84,85 118,105 152,121 186,134 220,144 254,151 288,157 322,162 356,166 390,169" fill="none" stroke="#006A7D" stroke-width="3"/><circle cx="50" cy="60" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="84" cy="85" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="118" cy="105" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="152" cy="121" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="186" cy="134" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="220" cy="144" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="254" cy="151" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="288" cy="157" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="322" cy="162" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="356" cy="166" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><circle cx="390" cy="169" r="3.5" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><text x="130" y="76" font-size="10" font-weight="800" text-anchor="start" fill="#006A7D">big gains early</text><text x="400" y="140" font-size="10" font-weight="800" text-anchor="end" fill="#A7350B">smaller gains, much higher cost</text><rect x="20" y="214" width="400" height="66" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="234" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Grow model size and data together:</text><text x="220" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">about 20 tokens of text per parameter (Chinchilla, 2022).</text><text x="220" y="266" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">An observed pattern, not a law of nature.</text></g></svg>