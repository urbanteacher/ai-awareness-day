<svg viewBox="0 0 440 280" role="img" aria-labelledby="t d"><title id="t">How k-means finds groups</title><desc id="d">One common clustering method, k-means, works in steps. Drop three centres at random. Give every point to its nearest centre. Move each centre to the middle of its points. Repeat until the centres stop moving: the groups are found.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="128" height="170" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="84" y="60" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">1 · DROP 3 CENTRES</text><circle cx="50" cy="110" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="62" cy="125" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="45" cy="130" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="58" cy="140" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="115" cy="100" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="130" cy="112" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="120" cy="125" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="138" cy="105" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="90" cy="165" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="102" cy="175" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="85" cy="180" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><circle cx="110" cy="162" r="4.5" fill="#fff" stroke="#231F20" stroke-width="1"/><path d="M68 93l14 14M82 93l-14 14" stroke="#00BEDD" stroke-width="3.5"/><path d="M73 133l14 14M87 133l-14 14" stroke="#FF7038" stroke-width="3.5"/><path d="M123 163l14 14M137 163l-14 14" stroke="#AC91FF" stroke-width="3.5"/><line x1="149" y1="125" x2="157" y2="125" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="158" y="40" width="128" height="170" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="222" y="60" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">2 · NEAREST CENTRE</text><circle cx="188" cy="110" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="200" cy="125" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="183" cy="130" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="196" cy="140" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="253" cy="100" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="268" cy="112" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="258" cy="125" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="276" cy="105" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="228" cy="165" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="240" cy="175" r="4.5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="223" cy="180" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="248" cy="162" r="4.5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><path d="M206 93l14 14M220 93l-14 14" stroke="#00BEDD" stroke-width="3.5"/><path d="M211 133l14 14M225 133l-14 14" stroke="#FF7038" stroke-width="3.5"/><path d="M261 163l14 14M275 163l-14 14" stroke="#AC91FF" stroke-width="3.5"/><line x1="287" y1="125" x2="295" y2="125" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="296" y="40" width="128" height="170" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="360" y="60" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">3 · MOVE TO MIDDLE</text><circle cx="326" cy="110" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="338" cy="125" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="321" cy="130" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="334" cy="140" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="391" cy="100" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="406" cy="112" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="396" cy="125" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="414" cy="105" r="4.5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="366" cy="165" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="378" cy="175" r="4.5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="361" cy="180" r="4.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="386" cy="162" r="4.5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><path d="M377.25 99.75l14 14M391.25 99.75l-14 14" stroke="#00BEDD" stroke-width="3.5"/><path d="M345.6666666666667 137.16666666666669l14 14M359.6666666666667 137.16666666666669l-14 14" stroke="#FF7038" stroke-width="3.5"/><path d="M375.0 161.5l14 14M389.0 161.5l-14 14" stroke="#AC91FF" stroke-width="3.5"/><path d="M304 214 Q197.0 240.0 90 214" fill="none" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="220" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="#5f5a52">repeat 2 and 3 until the centres stop moving</text><text x="220" y="272" font-size="11.5" font-weight="700" text-anchor="middle" fill="#A7350B">You choose how many groups to look for.</text></g></svg>