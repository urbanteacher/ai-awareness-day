<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">What starts an automation</title><desc id="d">Every automation starts with a trigger, then may check a condition, then does its actions. Triggers come in three kinds: something happens (a new email arrives), someone does something (a form is submitted), or a time arrives (every Monday at 8am).</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="30" font-size="10.5" font-weight="800" text-anchor="start" fill="#5f5a52">THREE KINDS OF TRIGGER</text><rect x="20" y="40" width="128" height="60" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="84" y="62" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">SOMETHING HAPPENS</text><text x="84" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">a new email arrives</text><rect x="156" y="40" width="128" height="60" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="220" y="62" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">SOMEONE ACTS</text><text x="220" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">a form is submitted</text><rect x="292" y="40" width="128" height="60" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="356" y="62" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">A TIME ARRIVES</text><text x="356" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">every Monday, 8am</text><text x="20" y="132" font-size="10.5" font-weight="800" text-anchor="start" fill="#5f5a52">THEN, FOR EXAMPLE</text><rect x="20.0" y="142" width="125.3" height="66" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="160" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TRIGGER</text><text x="82.7" y="178" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">form submitted</text><line x1="146.3" y1="175.0" x2="156.3" y2="175.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="142" width="125.3" height="66" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="160" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">CONDITION</text><text x="220.0" y="178" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">is it Year 7?</text><line x1="283.7" y1="175.0" x2="293.7" y2="175.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="142" width="125.3" height="66" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="160" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">ACTION</text><text x="357.3" y="178" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">email the tutor,</text><text x="357.3" y="191" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">add a row</text><rect x="20" y="224" width="400" height="54" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="246" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">A trigger that fires too often floods inboxes;</text><text x="220" y="262" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">one that never fires fails silently. Test it.</text></g></svg>