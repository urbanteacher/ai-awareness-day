<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">One direction that means "refuse"</title><desc id="d">Researchers compared a model's internal numbers for harmful and harmless requests and found one direction that separates them. When a request's numbers point along that direction, the model refuses. This was found across many open chat models in 2024.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">INSIDE THE MODEL'S NUMBERS</text><rect x="20" y="40" width="400" height="190" fill="#fff" stroke="#231F20" stroke-width="1.5"/><line x1="60" y1="200" x2="390" y2="70" stroke="#BE123C" stroke-width="3" marker-end="url(#ar)"/><text x="300" y="74" font-size="11.5" font-weight="800" text-anchor="end" fill="#BE123C">refusal direction</text><circle cx="110" cy="190" r="6" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><circle cx="140" cy="205" r="6" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><circle cx="90" cy="176" r="6" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><circle cx="160" cy="186" r="6" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><circle cx="125" cy="170" r="6" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><circle cx="300" cy="108" r="6" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><circle cx="330" cy="96" r="6" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><circle cx="280" cy="124" r="6" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><circle cx="320" cy="122" r="6" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><circle cx="350" cy="104" r="6" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><text x="120" y="220" font-size="10.5" font-weight="700" text-anchor="middle" fill="#176E3B">harmless requests</text><text x="328" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#9b1c14">harmful requests</text><rect x="20" y="240" width="400" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="265" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Points along the direction → "Sorry, I can't help with that."</text></g></svg>