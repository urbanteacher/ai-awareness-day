<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Models drift; someone has to notice</title><desc id="d">A model that tested well at launch can get worse as the world changes, because new data looks different from its training data. MLOps keeps a loop running: deploy, monitor accuracy, spot the drift, retrain on newer data, test, and deploy again.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">ACCURACY AFTER LAUNCH</text><path d="M40 40 V170 H420" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="420" y="184" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">months →</text><polyline points="50,60 100,62 150,70 200,86 250,104 280,112" fill="none" stroke="#9b1c14" stroke-width="2.5"/><polyline points="280,112 290,62 400,64" fill="none" stroke="#176E3B" stroke-width="2.5"/><line x1="40" y1="92" x2="420" y2="92" stroke="#A7350B" stroke-width="1.5" stroke-dasharray="5 4"/><text x="44" y="88" font-size="9.5" font-weight="700" text-anchor="start" fill="#A7350B">alert level</text><text x="220" y="134" font-size="10" font-weight="800" text-anchor="middle" fill="#9b1c14">drift: new data looks different</text><text x="296" y="56" font-size="10" font-weight="800" text-anchor="start" fill="#176E3B">retrained</text><rect x="20" y="200" width="72" height="34" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="56" y="221" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">deploy</text><line x1="93" y1="217" x2="101" y2="217" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="102" y="200" width="72" height="34" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="138" y="221" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">monitor</text><line x1="175" y1="217" x2="183" y2="217" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="184" y="200" width="72" height="34" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220" y="221" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">spot drift</text><line x1="257" y1="217" x2="265" y2="217" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="266" y="200" width="72" height="34" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="302" y="221" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">retrain</text><line x1="339" y1="217" x2="347" y2="217" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="348" y="200" width="72" height="34" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="384" y="221" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">test</text><path d="M380 236 Q218.0 252.0 56 236" fill="none" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="220" y="274" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">and round again</text></g></svg>