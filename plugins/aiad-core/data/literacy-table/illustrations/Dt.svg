<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">How a tree picks its questions</title><desc id="d">Ten days: some needed a coat, some did not. To choose its first question, a decision tree tries each one and keeps the question that splits the days into the purest groups. "Raining?" gives two mixed groups; "Below 10°C?" sorts them almost perfectly, so the tree asks that first.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">COAT OR NO COAT? 10 DAYS</text><rect x="20" y="40" width="194" height="196" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="117" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TRY "RAINING?"</text><text x="66" y="96" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5f5a52">yes</text><text x="166" y="96" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5f5a52">no</text><rect x="34" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="47" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="60" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="73" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="86" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="134" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="147" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="160" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="173" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="186" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><circle cx="117" cy="170" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M113.5 166.5l7 7M120.5 166.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="117" y="200" font-size="12" font-weight="800" text-anchor="middle" fill="#9b1c14">mixed groups</text><text x="117" y="220" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">try another</text><rect x="226" y="40" width="194" height="196" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="323" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TRY "BELOW 10°C?"</text><text x="272" y="96" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5f5a52">yes</text><text x="372" y="96" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5f5a52">no</text><rect x="240" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="253" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="266" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="279" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="292" y="106" width="10" height="14" fill="#00BEDD" stroke="#231F20" stroke-width=".8"/><rect x="340" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="353" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="366" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="379" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><rect x="392" y="106" width="10" height="14" fill="#FFE2D5" stroke="#231F20" stroke-width=".8"/><circle cx="323" cy="170" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M319 170l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="323" y="200" font-size="12" font-weight="800" text-anchor="middle" fill="#176E3B">pure groups</text><text x="323" y="220" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">ask this first</text><text x="20" y="258" font-size="10.5" font-weight="700" text-anchor="start" fill="#006A7D">blue = needed a coat</text><text x="220" y="278" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">Then the tree repeats the search inside each branch.</text></g></svg>