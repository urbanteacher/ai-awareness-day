<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">A short extra course for one job</title><desc id="d">A general model already knows a lot. Fine-tuning trains it a little more on a smaller set of examples, such as 2,000 marked science answers, which changes some of its settings so it gets better at that one job. It costs far less than training from scratch, but it can get worse at other things.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20.0" y="36" width="125.3" height="70" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">GENERAL MODEL</text><text x="82.7" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">trained on a huge</text><text x="82.7" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">mix of text</text><line x1="146.3" y1="71.0" x2="156.3" y2="71.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="36" width="125.3" height="70" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">+ 2,000 EXAMPLES</text><text x="220.0" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">science answers,</text><text x="220.0" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">marked by teachers</text><line x1="283.7" y1="71.0" x2="293.7" y2="71.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="36" width="125.3" height="70" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">FINE-TUNED</text><text x="357.3" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">its settings now</text><text x="357.3" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">suit this job</text><text x="20" y="136" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">MARKING SCIENCE ANSWERS WELL</text><text x="20" y="164" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">before</text><rect x="80" y="150" width="195.20000000000002" height="20" fill="#D6F4FA" stroke="#231F20" stroke-width="1.2"/><text x="281.20000000000005" y="165" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">61%</text><text x="20" y="194" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">after</text><rect x="80" y="180" width="281.6" height="20" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><text x="367.6" y="195" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">88%</text><rect x="20" y="216" width="400" height="62" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="236" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Far cheaper than training from scratch.</text><text x="220" y="251" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">But poor examples teach poor habits,</text><text x="220" y="266" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">and the model can get worse at other things.</text></g></svg>