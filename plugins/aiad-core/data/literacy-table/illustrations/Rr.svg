<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Choosing the line with the smallest errors</title><desc id="d">Points show hours revised and test scores. Regression draws the line that makes the gaps between the points and the line, the errors, as small as possible overall. The line then predicts a score for new hours, with a range rather than one exact number.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">HOURS REVISED AND TEST SCORE</text><path d="M40 44 V234 H400" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="400" y="248" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">hours revised →</text><text x="36" y="40" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">score ↑</text><polygon points="40,196.0 400,66.4 400,102.4 40,232.0" fill="#D6F4FA" opacity=".7"/><line x1="70" y1="200" x2="70" y2="203.2" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="70" cy="200" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="110" y1="180" x2="110" y2="188.8" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="110" cy="180" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="140" y1="192" x2="140" y2="178.0" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="140" cy="192" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="180" y1="150" x2="180" y2="163.6" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="180" cy="150" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="220" y1="160" x2="220" y2="149.2" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="220" cy="160" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="250" y1="120" x2="250" y2="138.4" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="250" cy="120" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="290" y1="128" x2="290" y2="124.0" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="290" cy="128" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="330" y1="96" x2="330" y2="109.6" stroke="#9b1c14" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="330" cy="96" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><line x1="40" y1="214.0" x2="400" y2="84.4" stroke="#006A7D" stroke-width="2.5"/><circle cx="370" cy="95.2" r="7" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="362" y="69.2" font-size="10.5" font-weight="800" text-anchor="end" fill="#231F20">prediction</text><text x="60" y="60" font-size="10.5" font-weight="700" text-anchor="start" fill="#9b1c14">red dashes = errors</text><text x="60" y="76" font-size="10.5" font-weight="700" text-anchor="start" fill="#006A7D">blue band = likely range</text><text x="220" y="272" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">Training picks the line with the smallest total error.</text></g></svg>