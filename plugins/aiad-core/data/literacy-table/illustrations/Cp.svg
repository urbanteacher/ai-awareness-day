<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">It suggests; you decide</title><desc id="d">A copilot sits inside the app you are using. As you write an email or code, it suggests the next part. You accept it, edit it or reject it. In one 2023 experiment, programmers with GitHub Copilot finished a set task 55.8% faster; you are still responsible for what you keep.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="96" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="56" font-size="10" font-weight="800" text-anchor="start" fill="#5f5a52">DRAFTING AN EMAIL</text><text x="32" y="80" font-size="12" font-weight="700" text-anchor="start" fill="#231F20">Dear parents, the Year 8 trip to the</text><text x="32" y="102" font-size="12" font-weight="700" text-anchor="start" fill="#6441B8" font-style="italic">Science Museum is on Friday 12 March.</text><text x="32" y="122" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">↑ the copilot's suggestion, until you choose</text><rect x="60" y="146" width="96" height="34" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="108" y="168" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">accept</text><rect x="172" y="146" width="96" height="34" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220" y="168" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">edit</text><rect x="284" y="146" width="96" height="34" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="332" y="168" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">reject</text><rect x="20" y="196" width="400" height="82" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="218" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">One 2023 experiment: programmers with a copilot</text><text x="220" y="235" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">finished a set task 55.8% faster.</text><text x="220" y="252" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">You are still responsible for what you keep.</text></g></svg>