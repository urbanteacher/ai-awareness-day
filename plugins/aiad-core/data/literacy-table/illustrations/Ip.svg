<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Two copyright questions</title><desc id="d">Copyright and AI raises two questions. Going in: can a company train on people's work? In UK law, mining others' work is clearly allowed only for non-commercial research, so commercial training generally needs permission or a licence. Coming out: who owns what the AI makes, and does it copy anyone? That depends on how much a person shaped it, and the law is still being settled.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="196" height="220" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="118" y="62" font-size="11" font-weight="800" text-anchor="middle" fill="#6441B8">GOING IN</text><text x="118" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">Can a company train</text><text x="118" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">on your work?</text><rect x="32" y="120" width="172" height="46" fill="#fff" stroke="#231F20" stroke-width="1.5"/><circle cx="48" cy="143" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M44 143l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="62" y="139" font-size="10.5" font-weight="400" text-anchor="start" fill="#231F20">Non-commercial research:</text><text x="62" y="153" font-size="10.5" font-weight="400" text-anchor="start" fill="#231F20">allowed (section 29A)</text><rect x="32" y="176" width="172" height="70" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="48" y="196" font-size="15" font-weight="800" text-anchor="middle" fill="#BE123C">?</text><text x="62" y="194" font-size="10.5" font-weight="400" text-anchor="start" fill="#231F20">Commercial training:</text><text x="62" y="208" font-size="10.5" font-weight="400" text-anchor="start" fill="#231F20">generally needs</text><text x="62" y="222" font-size="10.5" font-weight="400" text-anchor="start" fill="#231F20">permission or a licence</text><rect x="224" y="40" width="196" height="220" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="322" y="62" font-size="11" font-weight="800" text-anchor="middle" fill="#A7350B">COMING OUT</text><text x="322" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">Who owns what</text><text x="322" y="98" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">the AI makes?</text><rect x="236" y="120" width="172" height="60" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="322" y="140" font-size="10.5" font-weight="400" text-anchor="middle" fill="#231F20">A person shaped it a lot:</text><text x="322" y="154" font-size="10.5" font-weight="400" text-anchor="middle" fill="#231F20">a stronger claim</text><rect x="236" y="188" width="172" height="58" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="322" y="208" font-size="10.5" font-weight="400" text-anchor="middle" fill="#231F20">Does it copy someone's</text><text x="322" y="222" font-size="10.5" font-weight="400" text-anchor="middle" fill="#231F20">work too closely?</text><text x="220" y="284" font-size="11" font-weight="700" text-anchor="middle" fill="#9b1c14">UK law on AI and copyright is still being settled.</text></g></svg>