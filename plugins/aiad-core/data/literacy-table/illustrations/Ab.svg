<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Removing a model's "no"</title><desc id="d">Abliteration edits an open model's weights to remove its refusal direction. The original model refuses an unsafe request; the edited copy may answer it. The edit removes the safety behaviour, not the law: harmful or illegal content stays illegal.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="160" y="40" width="120" height="44" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">An unsafe</text><text x="220" y="75" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">request</text><line x1="190" y1="86" x2="110" y2="112" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="250" y1="86" x2="330" y2="112" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="114" width="190" height="112" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="115" y="136" font-size="10.5" font-weight="800" text-anchor="middle" fill="#176E3B">ORIGINAL MODEL</text><text x="115" y="160" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">refusal direction</text><text x="115" y="175" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">in place</text><rect x="35" y="186" width="160" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="115" y="205" font-size="11" font-weight="800" text-anchor="middle" fill="#176E3B">"Sorry, I can't help."</text><rect x="230" y="114" width="190" height="112" fill="#FCEBEB" stroke="#231F20" stroke-width="1.5"/><text x="325" y="136" font-size="10.5" font-weight="800" text-anchor="middle" fill="#9b1c14">EDITED COPY</text><text x="325" y="160" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">refusal direction</text><text x="325" y="175" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">removed</text><rect x="245" y="186" width="160" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="325" y="205" font-size="11" font-weight="800" text-anchor="middle" fill="#9b1c14">may answer it</text><rect x="20" y="238" width="400" height="40" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="263" font-size="11" font-weight="700" text-anchor="middle" fill="#9b1c14">It removes a safety behaviour, not the law: illegal stays illegal.</text></g></svg>