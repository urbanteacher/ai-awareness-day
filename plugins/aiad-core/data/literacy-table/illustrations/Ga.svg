<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Analysing versus creating</title><desc id="d">Given the same kind of data, analytical AI answers a question about it, such as "is this a cat?", while generative AI makes something new that fits the patterns it learned: a new cat picture, a poem, a voice or code. What it makes is likely, not checked: it can look right and still be wrong.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="196" height="160" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="118" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">ANALYTICAL AI</text><text x="118" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">answers a question about data</text><rect x="48" y="86" width="140" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="118" y="113" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">photo of a cat</text><line x1="118" y1="132" x2="118" y2="150" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="118" y="176" font-size="13" font-weight="800" text-anchor="middle" fill="#231F20">"Cat: 97% likely"</text><rect x="224" y="36" width="196" height="160" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="322" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#6441B8">GENERATIVE AI</text><text x="322" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">makes something new</text><rect x="252" y="86" width="140" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="322" y="113" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">"a cat in a top hat"</text><line x1="322" y1="132" x2="322" y2="150" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="236" y="156" width="40" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="256" y="174" font-size="9" font-weight="700" text-anchor="middle" fill="#231F20">picture</text><rect x="280" y="156" width="40" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="300" y="174" font-size="9" font-weight="700" text-anchor="middle" fill="#231F20">text</text><rect x="324" y="156" width="40" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="344" y="174" font-size="9" font-weight="700" text-anchor="middle" fill="#231F20">audio</text><rect x="368" y="156" width="40" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="388" y="174" font-size="9" font-weight="700" text-anchor="middle" fill="#231F20">code</text><rect x="20" y="210" width="400" height="66" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">It learns patterns from huge numbers of examples,</text><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">then makes what is likely to fit them.</text><text x="220" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Likely is not the same as checked.</text></g></svg>