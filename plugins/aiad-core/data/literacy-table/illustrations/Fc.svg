<svg viewBox="0 0 440 280" role="img" aria-labelledby="t d"><title id="t">A forecast is a range, not a point</title><desc id="d">Past weekly lunch numbers are drawn as a line. The forecast continues the line, with a shaded band showing the likely range, which gets wider the further ahead it looks, because uncertainty grows.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">LUNCHES SOLD EACH WEEK</text><path d="M40 40 V220 H410" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="410" y="234" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">weeks →</text><polyline points="50,150 80,140 110,156 140,132 170,144 200,126 230,138" fill="none" stroke="#231F20" stroke-width="2.5"/><polygon points="230,138 400,72 400,168" fill="#FDE3F9" stroke="none"/><line x1="230" y1="138" x2="400" y2="120" stroke="#983488" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="230" y1="48" x2="230" y2="220" stroke="#5f5a52" stroke-width="1" stroke-dasharray="3 3"/><text x="226" y="58" font-size="10.5" font-weight="700" text-anchor="end" fill="#5f5a52">past</text><text x="236" y="58" font-size="10.5" font-weight="700" text-anchor="start" fill="#983488">forecast</text><text x="396" y="66" font-size="10.5" font-weight="800" text-anchor="end" fill="#983488">wider further ahead</text><text x="220" y="252" font-size="12" font-weight="700" text-anchor="middle" fill="#983488">Plan for the range, not just the middle line.</text></g></svg>