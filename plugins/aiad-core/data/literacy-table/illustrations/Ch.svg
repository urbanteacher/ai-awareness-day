<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">From a risk score to an action</title><desc id="d">A churn model scores each subscriber's chance of leaving. Those above a threshold get an action, such as a reminder or an offer. Afterwards, the business checks whether the action really kept people, compared with similar people who got nothing, because some would have stayed anyway.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">CHANCE OF LEAVING</text><text x="20" y="58" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Amir</text><rect x="80" y="46" width="200" height="16" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="80" y="46" width="24" height="16" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><text x="288" y="59" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">12%</text><text x="20" y="92" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Bea</text><rect x="80" y="80" width="200" height="16" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="80" y="80" width="68" height="16" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><text x="288" y="93" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">34%</text><text x="20" y="126" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Chloe</text><rect x="80" y="114" width="200" height="16" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="80" y="114" width="170" height="16" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="288" y="127" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">85%</text><text x="20" y="160" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Dev</text><rect x="80" y="148" width="200" height="16" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="80" y="148" width="142" height="16" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="288" y="161" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">71%</text><line x1="200" y1="36" x2="200" y2="176" stroke="#A7350B" stroke-width="2" stroke-dasharray="5 4"/><text x="200" y="188" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">threshold 60%</text><rect x="330" y="64" width="90" height="84" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="375" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Chloe, Dev:</text><text x="375" y="107" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">send an</text><text x="375" y="122" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">offer</text><line x1="316" y1="106" x2="328" y2="106" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="206" width="400" height="72" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="32" y="226" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">THEN TEST IT</text><text x="32" y="246" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">Compare with similar people who got no offer:</text><text x="32" y="262" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">did the offer keep anyone who would have left?</text></g></svg>