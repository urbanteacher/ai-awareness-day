<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">How the work really flows</title><desc id="d">Process mining reads the records systems already keep, each a case, a step and a time, and draws how the work really happens. For 400 trip requests it shows most go straight through in a day, but some wait 3 days for a signature: the bottleneck worth fixing or automating.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="150" height="112" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="30" y="54" font-size="9.5" font-weight="800" text-anchor="start" fill="#5f5a52">THE RECORDS</text><text x="30" y="74" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">#17</text><text x="60" y="74" font-size="9.5" font-weight="700" text-anchor="start" fill="#231F20">request</text><text x="162" y="74" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">Mon 9:10</text><text x="30" y="92" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">#17</text><text x="60" y="92" font-size="9.5" font-weight="700" text-anchor="start" fill="#231F20">signed</text><text x="162" y="92" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">Thu 14:02</text><text x="30" y="110" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">#18</text><text x="60" y="110" font-size="9.5" font-weight="700" text-anchor="start" fill="#231F20">request</text><text x="162" y="110" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">Mon 9:30</text><text x="30" y="128" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">#18</text><text x="60" y="128" font-size="9.5" font-weight="700" text-anchor="start" fill="#231F20">signed</text><text x="162" y="128" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">Mon 11:15</text><line x1="172" y1="59" x2="194" y2="59" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="196" y="44" width="100" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="246" y="64" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">request</text><rect x="320" y="44" width="100" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="370" y="64" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">approve</text><rect x="320" y="112" width="100" height="30" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="370" y="132" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">sign</text><rect x="196" y="112" width="100" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="246" y="132" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">book</text><line x1="298" y1="59" x2="318" y2="59" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="308" y="40" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">400</text><line x1="370" y1="76" x2="370" y2="110" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="376" y="98" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">400</text><line x1="318" y1="127" x2="298" y2="127" stroke="#9b1c14" stroke-width="2.5" marker-end="url(#ar)"/><text x="308" y="158" font-size="10.5" font-weight="800" text-anchor="middle" fill="#9b1c14">waits 3 days</text><rect x="20" y="166" width="400" height="112" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="32" y="188" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">WHAT IT SHOWS</text><text x="32" y="210" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Most requests flow through in under a day.</text><text x="32" y="230" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Waiting for a signature adds 3 days: the bottleneck.</text><text x="32" y="250" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Fix: e-signatures, or a reminder after 1 day.</text></g></svg>