<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Steering a reply without retraining</title><desc id="d">Researchers record the model's internal numbers for contrasting prompts, such as kind and unkind ones, and take the difference: a steering direction. Adding a little of it while the model answers makes the reply kinder; adding more pushes harder. The model's weights are not changed.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">FIND A DIRECTION, THEN ADD IT</text><rect x="20" y="40" width="120" height="56" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="80" y="62" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">kind prompts</text><text x="80" y="76" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">→ inner numbers</text><rect x="20" y="104" width="120" height="56" fill="#FCEBEB" stroke="#231F20" stroke-width="1.5"/><text x="80" y="126" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">unkind prompts</text><text x="80" y="140" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">→ inner numbers</text><line x1="142" y1="100" x2="168" y2="100" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="170" y="72" width="100" height="56" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="94" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">difference =</text><text x="220" y="108" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">a "kind" direction</text><line x1="272" y1="100" x2="296" y2="100" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="298" y="40" width="122" height="120" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="359" y="60" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">WHILE ANSWERING</text><text x="308" y="80" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">add none</text><text x="308" y="93" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">"Revise more."</text><text x="308" y="107" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">add a little</text><text x="308" y="120" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">"You've got this!"</text><text x="308" y="134" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">add a lot</text><text x="308" y="147" font-size="10" font-weight="400" text-anchor="start" fill="#9b1c14">odd, over the top</text><rect x="20" y="186" width="400" height="46" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="205" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">The model's weights aren't changed: only this reply is steered.</text><text x="32" y="222" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">The same idea, used on safety directions, can also weaken them.</text><text x="220" y="266" font-size="11" font-weight="700" text-anchor="middle" fill="#006A7D">Researchers use it to test what a direction really does.</text></g></svg>