<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">A bot that copies your clicks</title><desc id="d">Robotic process automation records the fixed steps a person does on screen, such as open the email, copy the name, paste it into the spreadsheet, next email, and repeats them exactly, hundreds of times. It does not understand the screen: if a button moves or a form changes, the bot stops.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">THE STEPS THE BOT REPEATS</text><rect x="20" y="38" width="180" height="24" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="54" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">1  open next email</text><rect x="20" y="68" width="180" height="24" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="84" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">2  copy the name</text><rect x="20" y="98" width="180" height="24" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="114" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">3  paste into sheet</text><rect x="20" y="128" width="180" height="24" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="144" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">4  copy the date</text><rect x="20" y="158" width="180" height="24" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="174" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">5  paste, save</text><path d="M208 170 Q232.0 110.0 208 50" fill="none" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="236" y="116" font-size="14" font-weight="800" text-anchor="start" fill="#006A7D">× 300</text><rect x="290" y="40" width="130" height="70" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="355" y="64" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">300 emails</text><text x="355" y="80" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">in 10 minutes</text><rect x="290" y="122" width="130" height="66" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="355" y="142" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">the form changes:</text><text x="355" y="156" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">button moved</text><text x="355" y="170" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">bot stops</text><rect x="20" y="204" width="400" height="74" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="226" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">It copies clicks; it doesn't understand them.</text><text x="220" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Great for fixed, repetitive steps.</text><text x="220" y="258" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Someone has to fix it when the screen changes.</text></g></svg>