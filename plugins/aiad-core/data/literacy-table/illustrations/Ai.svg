<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">AI is the big family</title><desc id="d">Artificial intelligence is the widest circle. Inside it is machine learning, systems that learn from data. Inside that is deep learning, using many-layered neural networks. Inside that are generative models such as large language models. Some AI, like a chess program's rules, sits outside machine learning altogether.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><ellipse cx="220" cy="140" rx="200" ry="118" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220" y="46" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">ARTIFICIAL INTELLIGENCE</text><ellipse cx="274" cy="150" rx="132" ry="86" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="274" y="82" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">MACHINE LEARNING</text><ellipse cx="288" cy="164" rx="92" ry="62" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="288" y="122" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">DEEP LEARNING</text><ellipse cx="296" cy="180" rx="56" ry="32" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="296" y="172" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">GENERATIVE</text><text x="296" y="192" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">e.g. chatbots</text><text x="80" y="130" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">rule-based AI:</text><text x="80" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">chess rules,</text><text x="80" y="156" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">route finders</text><rect x="20" y="264" width="400" height="22" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="280" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Every one of them is built and used by people, for a purpose.</text></g></svg>