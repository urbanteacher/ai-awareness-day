<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Try, get a score, adjust</title><desc id="d">In reinforcement learning, an agent takes an action, the world responds, and it gets a reward score. Over many tries it is adjusted towards actions that score well. Chatbots are partly tuned this way: people compare two answers, a reward model learns their preferences, and the chatbot is trained to score well on it.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="30" y="38" width="120" height="44" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="90" y="65" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">AGENT</text><rect x="270" y="38" width="120" height="44" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="330" y="65" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">WORLD</text><line x1="152" y1="50" x2="268" y2="50" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="210" y="42" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">action</text><line x1="268" y1="72" x2="152" y2="72" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="210" y="92" font-size="10.5" font-weight="700" text-anchor="middle" fill="#176E3B">new state + reward</text><text x="20" y="128" font-size="10.5" font-weight="800" text-anchor="start" fill="#5f5a52">TUNING A CHATBOT WITH PEOPLE'S RATINGS</text><rect x="20" y="138" width="120" height="72" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="80" y="158" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">Answer A</text><text x="80" y="174" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">Answer B</text><text x="80" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">a person picks B</text><line x1="142" y1="174" x2="160" y2="174" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="162" y="138" width="120" height="72" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="222" y="158" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">reward model</text><text x="222" y="174" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">learns what</text><text x="222" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">people prefer</text><line x1="284" y1="174" x2="300" y2="174" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="302" y="138" width="118" height="72" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="361" y="158" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">chatbot trained</text><text x="361" y="174" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">to score</text><text x="361" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">higher</text><rect x="20" y="224" width="400" height="54" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="246" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">It learns whatever earns reward: if people reward</text><text x="220" y="262" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">pleasing answers, it learns to please.</text></g></svg>