<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">How bias gets in, and how it can grow</title><desc id="d">Past hiring decisions favoured group A, 80 to 20. A model trained on them learns that pattern, so two equally qualified new applicants get different scores, A 0.8 and B 0.5. If its picks become next year's training data, the gap can grow.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">HOW BIAS GETS IN</text><rect x="20" y="40" width="120" height="150" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="80" y="60" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">1 · PAST DECISIONS</text><text x="80" y="76" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">who was hired</text><rect x="30.0" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="39.5" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="49.0" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="58.5" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="68.0" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="77.5" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="87.0" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="96.5" y="88" width="7" height="40" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><rect x="30.0" y="140" width="7" height="40" fill="#FF7038" stroke="#231F20" stroke-width="1"/><rect x="39.5" y="140" width="7" height="40" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="133" y="113" font-size="11" font-weight="700" text-anchor="end" fill="#231F20">80 A</text><text x="133" y="165" font-size="11" font-weight="700" text-anchor="end" fill="#231F20">20 B</text><line x1="144" y1="115" x2="172" y2="115" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="176" y="70" width="96" height="90" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="224" y="92" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">2 · MODEL</text><text x="224" y="112" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">learns:</text><text x="224" y="127" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">"people like</text><text x="224" y="142" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">A get hired"</text><line x1="276" y1="115" x2="304" y2="115" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="308" y="40" width="112" height="150" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="364" y="60" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">3 · NEW APPLICANTS</text><text x="364" y="76" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">equally qualified</text><circle cx="338" cy="97" r="7" fill="#D6F4FA" stroke="#231F20" stroke-width="1.3"/><path d="M326.8 119.4 C326.8 106.8 349.2 106.8 349.2 119.4 Z" fill="#D6F4FA" stroke="#231F20" stroke-width="1.3"/><circle cx="390" cy="97" r="7" fill="#FFE2D5" stroke="#231F20" stroke-width="1.3"/><path d="M378.8 119.4 C378.8 106.8 401.2 106.8 401.2 119.4 Z" fill="#FFE2D5" stroke="#231F20" stroke-width="1.3"/><text x="338" y="140" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">A</text><text x="390" y="140" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">B</text><text x="338" y="168" font-size="15" font-weight="800" text-anchor="middle" fill="#176E3B">0.8</text><text x="390" y="168" font-size="15" font-weight="800" text-anchor="middle" fill="#9b1c14">0.5</text><text x="364" y="184" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">score</text><path d="M364 194 Q222.0 254.0 80 194" fill="none" stroke="#9b1c14" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="222" y="262" font-size="12" font-weight="700" text-anchor="middle" fill="#9b1c14">If its picks become next year's data,</text><text x="222" y="278" font-size="12" font-weight="700" text-anchor="middle" fill="#9b1c14">the gap can grow.</text></g></svg>