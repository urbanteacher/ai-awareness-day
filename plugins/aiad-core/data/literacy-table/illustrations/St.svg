<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Straight through, or out to a person</title><desc id="d">Straight-through processing lets a computer handle a whole job, such as a lunch-money top-up, with no person in the middle: received, checked, paid in, confirmed. Cases that fail a check, such as a name that doesn't match, drop out to a person. The share that goes straight through is the measure.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20.0" y="40" width="92.5" height="64" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="66.2" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">RECEIVED</text><text x="66.2" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">£20 top-up</text><line x1="113.5" y1="72.0" x2="121.5" y2="72.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="122.5" y="40" width="92.5" height="64" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="168.8" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">CHECKED</text><text x="168.8" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">name, account,</text><text x="168.8" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">amount</text><line x1="216.0" y1="72.0" x2="224.0" y2="72.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="225.0" y="40" width="92.5" height="64" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="271.2" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PAID IN</text><text x="271.2" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">balance</text><text x="271.2" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">updated</text><line x1="318.5" y1="72.0" x2="326.5" y2="72.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="327.5" y="40" width="92.5" height="64" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="373.8" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">CONFIRMED</text><text x="373.8" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">email sent</text><line x1="160" y1="106" x2="160" y2="140" stroke="#9b1c14" stroke-width="1.8" marker-end="url(#ar)"/><rect x="90" y="142" width="140" height="40" fill="#F7C1C1" stroke="#231F20" stroke-width="1.5"/><text x="160" y="158" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">check fails:</text><text x="160" y="172" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">to a person</text><text x="260" y="124" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">no one in the middle</text><text x="20" y="208" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">1,000 TOP-UPS</text><rect x="20" y="218" width="368" height="24" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><rect x="388" y="218" width="32" height="24" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><text x="30" y="235" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">920 straight through, in seconds</text><text x="404" y="260" font-size="10" font-weight="800" text-anchor="end" fill="#9b1c14">80 to a person</text></g></svg>