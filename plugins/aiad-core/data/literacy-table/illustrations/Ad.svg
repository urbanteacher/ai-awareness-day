<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Learn what is normal, flag what is far from it</title><desc id="d">Anomaly detection first learns what normal looks like, such as usual payment amounts, times and places. Each new event gets a score for how far it is from normal. Events past a threshold are flagged for a person to check, because some unusual events are innocent.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">CARD PAYMENTS: HOW UNUSUAL?</text><path d="M40 40 V200 H410" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="410" y="214" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">how unusual →</text><path d="M50 190 C90 190 100 70 140 70 S190 190 230 192" fill="#D6F4FA" stroke="#006A7D" stroke-width="2"/><text x="140" y="62" font-size="10.5" font-weight="700" text-anchor="middle" fill="#006A7D">normal: £2–£10, daytime, UK</text><line x1="280" y1="50" x2="280" y2="200" stroke="#A7350B" stroke-width="2" stroke-dasharray="5 4"/><text x="284" y="60" font-size="10.5" font-weight="800" text-anchor="start" fill="#A7350B">threshold</text><circle cx="390" cy="180" r="7" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><circle cx="320" cy="180" r="7" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><text x="294" y="100" font-size="10" font-weight="700" text-anchor="start" fill="#9b1c14">£950, 3am, abroad</text><text x="294" y="138" font-size="10" font-weight="700" text-anchor="start" fill="#5f5a52">£40 trip</text><line x1="380" y1="104" x2="390" y2="172" stroke="#9b1c14" stroke-width="1"/><line x1="312" y1="142" x2="320" y2="172" stroke="#5f5a52" stroke-width="1"/><rect x="20" y="226" width="400" height="54" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Flagged for a person to check: the £40 school trip</text><text x="220" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">was unusual but fine. Unusual isn't always wrong.</text></g></svg>