<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">The programmer sets the task and checks the result</title><desc id="d">A coding agent gets a task, such as "add a dark mode", reads the project's files, makes a plan, edits several files, runs the tests and fixes what fails, then hands over its changes. The programmer reviews every change before it is used.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="34" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="58" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Task: "add a dark mode to the homework app"</text><rect x="20.0" y="82" width="92.5" height="60" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="66.2" y="100" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">READ</text><text x="66.2" y="118" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">the project</text><line x1="113.5" y1="112.0" x2="121.5" y2="112.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="122.5" y="82" width="92.5" height="60" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="168.8" y="100" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PLAN</text><text x="168.8" y="118" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">which files</text><line x1="216.0" y1="112.0" x2="224.0" y2="112.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="225.0" y="82" width="92.5" height="60" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="271.2" y="100" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">EDIT</text><text x="271.2" y="118" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">5 files</text><line x1="318.5" y1="112.0" x2="326.5" y2="112.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="327.5" y="82" width="92.5" height="60" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="373.8" y="100" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TEST</text><text x="373.8" y="118" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">2 fail, fixed,</text><text x="373.8" y="131" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">all pass</text><path d="M392 146 Q346.0 158.0 300 146" fill="none" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="346" y="170" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">fix and re-run</text><rect x="20" y="184" width="400" height="50" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="204" font-size="10" font-weight="800" text-anchor="start" fill="#006A7D">THE PROGRAMMER</text><text x="32" y="224" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">sets the task · reviews every change · owns the code</text><text x="220" y="266" font-size="11.5" font-weight="700" text-anchor="middle" fill="#A7350B">Tests are its feedback; review is yours.</text></g></svg>