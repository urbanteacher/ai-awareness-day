<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Set the goals, let it propose shapes</title><desc id="d">Generative design starts from goals rather than a drawing: where a bracket must attach, what weight it carries, the material and how it will be made. The software proposes many shapes that meet them, often lighter and more curved than a person would draw. An engineer chooses, checks and tests one before it is printed.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="150" height="150" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="95" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">THE GOALS</text><text x="32" y="78" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">fix to 2 bolt holes</text><text x="32" y="98" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">hold 5 kg</text><text x="32" y="118" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">use PLA plastic</text><text x="32" y="138" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">3D printable</text><text x="32" y="158" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">as light as possible</text><line x1="172" y1="111" x2="194" y2="111" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="196" y="36" width="224" height="150" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="308" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">SHAPES IT PROPOSES</text><path d="M206 160 h60 v-14 h-46 v-60 h-14z" fill="#ECE5FF" stroke="#231F20" stroke-width="1.4"/><path d="M280 160 h64 v-12 q-30 -4 -44 -30 q-6 -14 -6 -34 h-14z" fill="#ECE5FF" stroke="#231F20" stroke-width="1.4"/><path d="M356 160 h56 v-10 c-22 0 -24 -14 -30 -24 c-8 -14 2 -26 -10 -42 h-16z" fill="#DDF8E7" stroke="#231F20" stroke-width="2.2"/><text x="236" y="178" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">heavy</text><text x="312" y="178" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">lighter</text><text x="384" y="178" font-size="9.5" font-weight="800" text-anchor="middle" fill="#176E3B">lightest</text><rect x="20.0" y="200" width="125.3" height="54" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="218" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">ENGINEER CHOOSES</text><text x="82.7" y="236" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">and checks it</text><line x1="146.3" y1="227.0" x2="156.3" y2="227.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="200" width="125.3" height="54" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="218" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TEST IT</text><text x="220.0" y="236" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">on screen, then for real</text><line x1="283.7" y1="227.0" x2="293.7" y2="227.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="200" width="125.3" height="54" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="218" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PRINT OR MAKE</text><text x="357.3" y="236" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">ready to use</text><text x="220" y="276" font-size="11" font-weight="700" text-anchor="middle" fill="#006A7D">People set the goals and test the result.</text></g></svg>