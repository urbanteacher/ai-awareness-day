<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Where to draw the line</title><desc id="d">A spam classifier gives each email a score from 0 to 1. A threshold decides which count as spam. A low threshold catches more spam but blocks some real emails; a high threshold lets more spam through but blocks fewer real ones. Choosing it depends on which mistake costs more.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">SPAM SCORE FOR EACH EMAIL</text><line x1="30" y1="120" x2="410" y2="120" stroke="#231F20" stroke-width="1.5"/><line x1="30" y1="116" x2="30" y2="124" stroke="#231F20" stroke-width="1.5"/><text x="30" y="138" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">0</text><line x1="220.0" y1="116" x2="220.0" y2="124" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="138" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">0.5</text><line x1="410" y1="116" x2="410" y2="124" stroke="#231F20" stroke-width="1.5"/><text x="410" y="138" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">1</text><rect x="51.400000000000006" y="92" width="18" height="16" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><rect x="89.39999999999999" y="92" width="18" height="16" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><rect x="135.0" y="92" width="18" height="16" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><rect x="180.6" y="88" width="18" height="20" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><rect x="230.00000000000003" y="92" width="18" height="16" fill="#DDF8E7" stroke="#231F20" stroke-width="1"/><rect x="271.8" y="88" width="18" height="20" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><rect x="317.40000000000003" y="88" width="18" height="20" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><rect x="363.0" y="88" width="18" height="20" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><rect x="385.8" y="88" width="18" height="20" fill="#F7C1C1" stroke="#231F20" stroke-width="1"/><text x="30" y="64" font-size="10.5" font-weight="700" text-anchor="start" fill="#9b1c14">red = really spam</text><text x="150" y="64" font-size="10.5" font-weight="700" text-anchor="start" fill="#176E3B">green = real email</text><line x1="182.0" y1="80" x2="182.0" y2="150" stroke="#A7350B" stroke-width="2.5" stroke-dasharray="5 3"/><text x="182.0" y="164" font-size="10.5" font-weight="800" text-anchor="middle" fill="#A7350B">low threshold</text><line x1="353.0" y1="80" x2="353.0" y2="150" stroke="#006A7D" stroke-width="2.5" stroke-dasharray="5 3"/><text x="353.0" y="164" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">high threshold</text><rect x="20" y="180" width="196" height="90" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="118" y="200" font-size="10.5" font-weight="800" text-anchor="middle" fill="#A7350B">LOW THRESHOLD</text><text x="118" y="222" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">catches all the spam</text><text x="118" y="237" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">but blocks a real email</text><rect x="224" y="180" width="196" height="90" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="322" y="200" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">HIGH THRESHOLD</text><text x="322" y="222" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">blocks no real email</text><text x="322" y="237" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">but lets spam through</text></g></svg>