<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Draft, critique, revise</title><desc id="d">Self-reflection: the agent writes a draft, then reviews it against the task and writes a critique, then revises. It works best when the review uses something outside the model, such as running the tests, a calculator or a search. Checking its own reasoning with nothing new to go on often doesn't help, and can make answers worse.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="120" height="60" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="80" y="62" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">DRAFT</text><text x="80" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">writes an answer</text><line x1="142" y1="70" x2="158" y2="70" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="160" y="40" width="120" height="60" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220" y="62" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">CRITIQUE</text><text x="220" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">"step 3 is wrong"</text><line x1="282" y1="70" x2="298" y2="70" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="300" y="40" width="120" height="60" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="360" y="62" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">REVISE</text><text x="360" y="84" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">fixes it</text><path d="M340 102 Q210.0 124.0 80 102" fill="none" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="210" y="140" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">repeat until it passes</text><rect x="20" y="156" width="196" height="82" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="118" y="176" font-size="10" font-weight="800" text-anchor="middle" fill="#176E3B">WORKS BEST WITH</text><text x="118" y="196" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">test results</text><text x="118" y="210" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">a calculator or search</text><text x="118" y="224" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">a checklist from the task</text><rect x="224" y="156" width="196" height="82" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="322" y="176" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">ON ITS OWN</text><text x="322" y="196" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">rereading its own reasoning</text><text x="322" y="210" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">often misses the mistake,</text><text x="322" y="224" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">and can make it worse</text><text x="220" y="268" font-size="11.5" font-weight="700" text-anchor="middle" fill="#A7350B">Reflection needs something real to check against.</text></g></svg>