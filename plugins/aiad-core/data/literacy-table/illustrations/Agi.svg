<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Good at some things, or almost everything</title><desc id="d">Today's AI is uneven: very strong at some tasks, such as writing code or translating, and weak at others, such as handling the physical world or long, open-ended projects. AGI would be strong across almost all of them. In a 2023 survey of 2,778 AI researchers, the average answer gave a 50% chance that machines could beat people at every task by 2047, with wide disagreement.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="30" font-size="10.5" font-weight="800" text-anchor="start" fill="#006A7D">TODAY'S AI: UNEVEN</text><text x="300" y="30" font-size="10.5" font-weight="800" text-anchor="start" fill="#6441B8">AGI WOULD BE</text><text x="20" y="56" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">translating</text><rect x="150" y="45" width="120" height="14" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="150" y="45" width="108.0" height="14" fill="#00BEDD"/><rect x="300" y="45" width="120" height="14" fill="#ECE5FF" stroke="#6441B8" stroke-width="1" stroke-dasharray="4 3"/><text x="20" y="80" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">writing code</text><rect x="150" y="69" width="120" height="14" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="150" y="69" width="102.0" height="14" fill="#00BEDD"/><rect x="300" y="69" width="120" height="14" fill="#ECE5FF" stroke="#6441B8" stroke-width="1" stroke-dasharray="4 3"/><text x="20" y="104" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">maths problems</text><rect x="150" y="93" width="120" height="14" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="150" y="93" width="90.0" height="14" fill="#00BEDD"/><rect x="300" y="93" width="120" height="14" fill="#ECE5FF" stroke="#6441B8" stroke-width="1" stroke-dasharray="4 3"/><text x="20" y="128" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">long projects</text><rect x="150" y="117" width="120" height="14" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="150" y="117" width="42.0" height="14" fill="#00BEDD"/><rect x="300" y="117" width="120" height="14" fill="#ECE5FF" stroke="#6441B8" stroke-width="1" stroke-dasharray="4 3"/><text x="20" y="152" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">physical world</text><rect x="150" y="141" width="120" height="14" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="150" y="141" width="24.0" height="14" fill="#00BEDD"/><rect x="300" y="141" width="120" height="14" fill="#ECE5FF" stroke="#6441B8" stroke-width="1" stroke-dasharray="4 3"/><text x="20" y="176" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">learning from 1 example</text><rect x="150" y="165" width="120" height="14" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="150" y="165" width="36.0" height="14" fill="#00BEDD"/><rect x="300" y="165" width="120" height="14" fill="#ECE5FF" stroke="#6441B8" stroke-width="1" stroke-dasharray="4 3"/><text x="210" y="196" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">made-up levels</text><text x="360" y="196" font-size="9.5" font-weight="700" text-anchor="middle" fill="#6441B8">strong at almost all</text><rect x="20" y="208" width="400" height="72" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="32" y="228" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">WHEN? A 2023 SURVEY OF 2,778 AI RESEARCHERS</text><text x="32" y="248" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">50% chance machines beat people at every task by 2047,</text><text x="32" y="264" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">but answers ranged from a few years to never.</text></g></svg>