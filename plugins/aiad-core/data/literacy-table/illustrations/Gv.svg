<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Every frame has to agree</title><desc id="d">A video clip is many still frames, often 24 a second. A generative video model has to make each frame look right and also keep them consistent: the same face, objects that don't vanish, movement that obeys gravity. Long clips, hands, text and physics are where it most often slips.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="34" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="58" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">"a red ball bounces down some steps"</text><rect x="20" y="84" width="74" height="74" fill="#fff" stroke="#231F20" stroke-width="1.4"/><path d="M20 158 v-14 h20 v-16 h20 v-16 h20 v-16 h14 v62z" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="84" cy="100" r="6" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="57" y="172" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">frame 1</text><rect x="102" y="84" width="74" height="74" fill="#fff" stroke="#231F20" stroke-width="1.4"/><path d="M102 158 v-14 h20 v-16 h20 v-16 h20 v-16 h14 v62z" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="150" cy="104" r="6" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="139" y="172" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">frame 2</text><rect x="184" y="84" width="74" height="74" fill="#fff" stroke="#231F20" stroke-width="1.4"/><path d="M184 158 v-14 h20 v-16 h20 v-16 h20 v-16 h14 v62z" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="220" cy="120" r="6" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="221" y="172" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">frame 3</text><rect x="266" y="84" width="74" height="74" fill="#fff" stroke="#231F20" stroke-width="1.4"/><path d="M266 158 v-14 h20 v-16 h20 v-16 h20 v-16 h14 v62z" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="290" cy="122" r="4" fill="#AC91FF" stroke="#231F20" stroke-width="1"/><text x="303" y="172" font-size="9.5" font-weight="700" text-anchor="middle" fill="#9b1c14">frame 4</text><rect x="348" y="84" width="74" height="74" fill="#fff" stroke="#231F20" stroke-width="1.4"/><path d="M348 158 v-14 h20 v-16 h20 v-16 h20 v-16 h14 v62z" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="360" cy="138" r="6" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="385" y="172" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">frame 5</text><rect x="262" y="84" width="74" height="74" fill="none" stroke="#9b1c14" stroke-width="3"/><text x="299" y="190" font-size="10" font-weight="800" text-anchor="middle" fill="#9b1c14">slip: ball changed</text><rect x="20" y="204" width="400" height="76" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="224" font-size="10" font-weight="800" text-anchor="start" fill="#006A7D">EVERY FRAME HAS TO AGREE</text><text x="32" y="244" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">same faces and objects, movement that obeys gravity</text><text x="32" y="261" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Most likely to slip: long clips, hands, text, physics</text></g></svg>