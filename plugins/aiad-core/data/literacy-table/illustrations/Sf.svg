<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Two kinds of harm, many layers</title><desc id="d">AI safety guards against accidents, where the AI makes a harmful mistake, and misuse, where a person uses it to cause harm. Layers work at different times: tests before release, training the model to refuse, filters around it, and monitoring after launch. Each layer misses some things, so several are used.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">LAYERS BEFORE AND AFTER RELEASE</text><rect x="20.0" y="40" width="91.0" height="74" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="65.5" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TESTS</text><text x="65.5" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">evals, red</text><text x="65.5" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">teaming</text><line x1="112.0" y1="77.0" x2="122.0" y2="77.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="123.0" y="40" width="91.0" height="74" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="168.5" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TRAINING</text><text x="168.5" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">taught to</text><text x="168.5" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">refuse harm</text><line x1="215.0" y1="77.0" x2="225.0" y2="77.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="226.0" y="40" width="91.0" height="74" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="271.5" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">FILTERS</text><text x="271.5" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">check what goes</text><text x="271.5" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">in and out</text><line x1="318.0" y1="77.0" x2="328.0" y2="77.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="329.0" y="40" width="91.0" height="74" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="374.5" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">MONITORING</text><text x="374.5" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">reports,</text><text x="374.5" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">fixes</text><text x="20" y="138" font-size="10.5" font-weight="800" text-anchor="start" fill="#9b1c14">ACCIDENT</text><text x="98" y="138" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">gives a dangerous wrong answer</text><text x="65.5" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">slips past</text><text x="168.5" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">slips past</text><circle cx="271.5" cy="162" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M267.5 162l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="271.5" y="186" font-size="10" font-weight="700" text-anchor="middle" fill="#176E3B">caught</text><text x="20" y="200" font-size="10.5" font-weight="800" text-anchor="start" fill="#9b1c14">MISUSE</text><text x="98" y="200" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">someone asks for help to cause harm</text><text x="65.5" y="228" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">slips past</text><circle cx="168.5" cy="224" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M164.5 224l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="168.5" y="248" font-size="10" font-weight="700" text-anchor="middle" fill="#176E3B">caught</text><text x="220" y="266" font-size="12" font-weight="700" text-anchor="middle" fill="#176E3B">Each layer misses something; together they catch more.</text></g></svg>