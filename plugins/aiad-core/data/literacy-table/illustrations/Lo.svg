<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Running an LLM tool day to day</title><desc id="d">LLMOps tracks the things that change in a language model tool: which version of the prompt is live, how it scores on a fixed set of test questions, what it costs each day, and how many answers were flagged as harmful or wrong. A prompt change is tested before it goes live.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">HOMEWORK HELPER: THIS WEEK</text><rect x="20" y="40" width="196" height="74" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="60" font-size="9.5" font-weight="800" text-anchor="start" fill="#5f5a52">PROMPT</text><text x="32" y="86" font-size="16" font-weight="800" text-anchor="start" fill="#231F20">version 4</text><text x="32" y="104" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">live since Monday</text><rect x="224" y="40" width="196" height="74" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="236" y="60" font-size="9.5" font-weight="800" text-anchor="start" fill="#5f5a52">TEST QUESTIONS</text><text x="236" y="86" font-size="16" font-weight="800" text-anchor="start" fill="#231F20">188 / 200</text><text x="236" y="104" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">passed (v3: 171)</text><rect x="20" y="124" width="196" height="74" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="32" y="144" font-size="9.5" font-weight="800" text-anchor="start" fill="#5f5a52">COST</text><text x="32" y="170" font-size="16" font-weight="800" text-anchor="start" fill="#231F20">£3.20 a day</text><text x="32" y="188" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">41,000 requests</text><rect x="224" y="124" width="196" height="74" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="236" y="144" font-size="9.5" font-weight="800" text-anchor="start" fill="#5f5a52">FLAGGED</text><text x="236" y="170" font-size="16" font-weight="800" text-anchor="start" fill="#231F20">12 answers</text><text x="236" y="188" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">for a person to review</text><rect x="20" y="216" width="400" height="62" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="238" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Treat prompts like code: version them,</text><text x="220" y="255" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">test changes before they go live, and keep watching.</text></g></svg>