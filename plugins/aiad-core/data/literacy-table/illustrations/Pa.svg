<svg viewBox="0 0 440 320" role="img" aria-labelledby="t d"><title id="t">From what happened to what will happen</title><desc id="d">Analytics climbs four steps. Descriptive: what happened? Diagnostic: why did it happen? Predictive: what is likely to happen? Prescriptive: what should we do? Predictive analytics is the third step: it gives a likelihood, such as about 240 lunches next Friday, give or take 15.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="180" width="96" height="96" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="68" y="198" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">DESCRIPTIVE</text><text x="68" y="216" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">What</text><text x="68" y="229" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">happened?</text><text x="68" y="248" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">238 lunches</text><text x="68" y="260" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">last Friday</text><rect x="120" y="136" width="96" height="140" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="168" y="154" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">DIAGNOSTIC</text><text x="168" y="172" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">Why?</text><text x="168" y="191" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">it was pizza</text><text x="168" y="203" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">day</text><rect x="220" y="92" width="96" height="184" fill="#FFF3C4" stroke="#231F20" stroke-width="2.5"/><text x="268" y="110" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">PREDICTIVE</text><text x="268" y="128" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">What's</text><text x="268" y="141" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">likely?</text><text x="268" y="160" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">about 240 next</text><text x="268" y="172" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">Friday, ±15</text><rect x="320" y="48" width="96" height="228" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="368" y="66" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">PRESCRIPTIVE</text><text x="368" y="84" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">What should</text><text x="368" y="97" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">we do?</text><text x="368" y="116" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">order for 255</text><text x="368" y="128" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">to be safe</text><text x="20" y="30" font-size="13" font-weight="800" text-anchor="start" fill="#231F20">FOUR STEPS OF ANALYTICS</text><text x="220" y="304" font-size="11.5" font-weight="700" text-anchor="middle" fill="#983488">Predictive analytics gives a likelihood, not a certainty.</text></g></svg>