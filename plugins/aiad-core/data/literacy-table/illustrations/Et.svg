<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Who gains, who could be harmed?</title><desc id="d">An ethics question: should a school use AI to mark homework? Pupils could get faster feedback but might be marked unfairly; teachers could save time but must still check; parents could see progress sooner but have privacy concerns; the school could spend less but depends on a supplier.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="130" y="118" width="180" height="62" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="140" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Should our school use</text><text x="220" y="156" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">AI to mark homework?</text><rect x="20" y="20" width="180" height="84" fill="#fff" stroke="#231F20" stroke-width="1.5"/><circle cx="40" cy="40" r="6" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><path d="M30.4 59.2 C30.4 48.4 49.6 48.4 49.6 59.2 Z" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><text x="58" y="46" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Pupils</text><text x="34" y="74" font-size="11" font-weight="700" text-anchor="start" fill="#176E3B">+ faster feedback</text><text x="34" y="92" font-size="11" font-weight="700" text-anchor="start" fill="#9b1c14">− marked unfairly?</text><line x1="110" y1="104" x2="150" y2="118" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="240" y="20" width="180" height="84" fill="#fff" stroke="#231F20" stroke-width="1.5"/><circle cx="260" cy="40" r="6" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><path d="M250.4 59.2 C250.4 48.4 269.6 48.4 269.6 59.2 Z" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><text x="278" y="46" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Teachers</text><text x="254" y="74" font-size="11" font-weight="700" text-anchor="start" fill="#176E3B">+ saves time</text><text x="254" y="92" font-size="11" font-weight="700" text-anchor="start" fill="#9b1c14">− still must check</text><line x1="330" y1="104" x2="290" y2="118" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="20" y="196" width="180" height="84" fill="#fff" stroke="#231F20" stroke-width="1.5"/><circle cx="40" cy="216" r="6" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><path d="M30.4 235.2 C30.4 224.4 49.6 224.4 49.6 235.2 Z" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><text x="58" y="222" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Parents</text><text x="34" y="250" font-size="11" font-weight="700" text-anchor="start" fill="#176E3B">+ see progress sooner</text><text x="34" y="268" font-size="11" font-weight="700" text-anchor="start" fill="#9b1c14">− privacy worries</text><line x1="110" y1="196" x2="150" y2="180" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="240" y="196" width="180" height="84" fill="#fff" stroke="#231F20" stroke-width="1.5"/><circle cx="260" cy="216" r="6" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><path d="M250.4 235.2 C250.4 224.4 269.6 224.4 269.6 235.2 Z" fill="#FFF3C4" stroke="#231F20" stroke-width="1.3"/><text x="278" y="222" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">The school</text><text x="254" y="250" font-size="11" font-weight="700" text-anchor="start" fill="#176E3B">+ costs less</text><text x="254" y="268" font-size="11" font-weight="700" text-anchor="start" fill="#9b1c14">− relies on a supplier</text><line x1="330" y1="196" x2="290" y2="180" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/></g></svg>