<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Responsible AI, step by step</title><desc id="d">Responsible AI adds a check at every stage of an AI system's life: plan (should we build it, and who could it harm?), build (fair, permitted data), test (try to break it, check every group), launch (tell people, keep a human in charge), and watch (monitor and fix), feeding back into the plan.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">A CHECK AT EVERY STAGE</text><rect x="20" y="44" width="72" height="130" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><rect x="20" y="44" width="72" height="24" fill="#00BEDD" stroke="#231F20" stroke-width="1.5"/><text x="56" y="61" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PLAN</text><circle cx="56" cy="92" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M52 92l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="124" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Should we</text><text x="56" y="137" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">build it?</text><text x="56" y="150" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Who could it</text><text x="56" y="163" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">harm?</text><line x1="93" y1="109" x2="101" y2="109" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="102" y="44" width="72" height="130" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><rect x="102" y="44" width="72" height="24" fill="#AC91FF" stroke="#231F20" stroke-width="1.5"/><text x="138" y="61" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">BUILD</text><circle cx="138" cy="92" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M134 92l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="138" y="124" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Fair,</text><text x="138" y="137" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">permitted</text><text x="138" y="150" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">data</text><line x1="175" y1="109" x2="183" y2="109" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="184" y="44" width="72" height="130" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><rect x="184" y="44" width="72" height="24" fill="#FF7038" stroke="#231F20" stroke-width="1.5"/><text x="220" y="61" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TEST</text><circle cx="220" cy="92" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M216 92l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="220" y="124" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Try to break</text><text x="220" y="137" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">it.</text><text x="220" y="150" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Check every</text><text x="220" y="163" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">group.</text><line x1="257" y1="109" x2="265" y2="109" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="266" y="44" width="72" height="130" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><rect x="266" y="44" width="72" height="24" fill="#63DF93" stroke="#231F20" stroke-width="1.5"/><text x="302" y="61" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">LAUNCH</text><circle cx="302" cy="92" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M298 92l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="302" y="124" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Tell people.</text><text x="302" y="137" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Human in</text><text x="302" y="150" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">charge.</text><line x1="339" y1="109" x2="347" y2="109" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="348" y="44" width="72" height="130" fill="#FDE3F9" stroke="#231F20" stroke-width="1.5"/><rect x="348" y="44" width="72" height="24" fill="#FA83EB" stroke="#231F20" stroke-width="1.5"/><text x="384" y="61" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">WATCH</text><circle cx="384" cy="92" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M380 92l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="384" y="124" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">Monitor,</text><text x="384" y="137" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">report,</text><text x="384" y="150" font-size="10" font-weight="400" text-anchor="middle" fill="#231F20">fix.</text><path d="M392 178 Q224.0 212.0 56 178" fill="none" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="224" y="236" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">what you learn goes back into the plan</text><text x="224" y="266" font-size="13" font-weight="800" text-anchor="middle" fill="#176E3B">Safe · Fair · Transparent · Accountable</text></g></svg>