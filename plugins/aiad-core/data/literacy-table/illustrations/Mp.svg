<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Finding the ideas inside a model</title><desc id="d">Inside a model, each word is a long list of numbers that mixes many ideas together. Researchers train a second tool, a sparse autoencoder, to split those numbers into features that each match one idea, such as the Golden Gate Bridge, a bug in code or sarcasm. Turning a feature up or down and watching the answer change tests whether it really does that job.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="120" height="150" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="80" y="60" font-size="9.5" font-weight="800" text-anchor="middle" fill="#6441B8">INSIDE THE MODEL</text><text x="80" y="82" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">0.8</text><text x="80" y="97" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">−1.2</text><text x="80" y="112" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">0.1</text><text x="80" y="127" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">2.4</text><text x="80" y="142" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">−0.3</text><text x="80" y="157" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">1.1</text><text x="80" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">…</text><text x="80" y="206" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">numbers that mix</text><text x="80" y="220" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">many ideas</text><line x1="142" y1="115" x2="168" y2="115" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="170" y="80" width="100" height="70" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="104" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">sparse</text><text x="220" y="118" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">autoencoder</text><text x="220" y="132" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">splits them</text><line x1="272" y1="115" x2="296" y2="115" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="298" y="40" width="122" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="359" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Golden Gate Bridge</text><rect x="298" y="78" width="122" height="30" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="359" y="98" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">bug in code</text><rect x="298" y="116" width="122" height="30" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="359" y="136" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">sarcasm</text><rect x="298" y="154" width="122" height="30" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="359" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">…millions more</text><rect x="20" y="236" width="400" height="50" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="256" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">TEST IT</text><text x="32" y="276" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">Turn a feature up or down: does the answer change as expected?</text></g></svg>