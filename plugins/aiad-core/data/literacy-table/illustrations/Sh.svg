<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Approved tool or shadow AI?</title><desc id="d">The same homework question can go two ways. Through an approved school tool, a data agreement controls how it is stored, it is not used for training, and the school can help if something goes wrong. Through an unapproved app on a personal account, nobody at school knows what happens to the data, which may be kept or used for training.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="160" y="40" width="120" height="46" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">A question with</text><text x="220" y="75" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">pupil names in it</text><line x1="190" y1="88" x2="110" y2="118" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="250" y1="88" x2="330" y2="118" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="120" width="190" height="130" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="115" y="142" font-size="10.5" font-weight="800" text-anchor="middle" fill="#176E3B">APPROVED SCHOOL TOOL</text><circle cx="40" cy="166" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M36 166l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="170" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">data agreement in place</text><circle cx="40" cy="192" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M36 192l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="196" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">not used for training</text><circle cx="40" cy="218" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M36 218l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="222" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">school can see and help</text><rect x="230" y="120" width="190" height="130" fill="#FCEBEB" stroke="#231F20" stroke-width="1.5"/><text x="325" y="142" font-size="10.5" font-weight="800" text-anchor="middle" fill="#9b1c14">UNAPPROVED APP</text><circle cx="250" cy="166" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M246.5 162.5l7 7M253.5 162.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="266" y="170" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">personal account</text><circle cx="250" cy="192" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M246.5 188.5l7 7M253.5 188.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="266" y="196" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">may be kept or trained on</text><circle cx="250" cy="218" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M246.5 214.5l7 7M253.5 214.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="266" y="222" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">nobody at school knows</text><text x="220" y="278" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">Same question; very different journey for the data.</text></g></svg>