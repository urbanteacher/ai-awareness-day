<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">The sweet spot between too simple and too complex</title><desc id="d">As a model gets more complex, its error on training data keeps falling. Its error on new data falls at first, then rises once it starts memorising noise: that is overfitting. The best model sits at the lowest point of the new-data curve. More data, simpler models and stopping early all help.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><path d="M40 30 V220 H410" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="36" y="26" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">error ↑</text><text x="220" y="236" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">model complexity →</text><path d="M50 66 C120 160 200 195 400 208" fill="none" stroke="#006A7D" stroke-width="3"/><path d="M50 56 C120 135 170 158 210 156 S320 110 400 60" fill="none" stroke="#9b1c14" stroke-width="3"/><text x="392" y="196" font-size="11" font-weight="800" text-anchor="end" fill="#006A7D">training data</text><text x="392" y="54" font-size="11" font-weight="800" text-anchor="end" fill="#9b1c14">new data</text><line x1="205" y1="52" x2="205" y2="220" stroke="#176E3B" stroke-width="2" stroke-dasharray="5 4"/><text x="205" y="44" font-size="11" font-weight="800" text-anchor="middle" fill="#176E3B">sweet spot</text><text x="100" y="214" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5f5a52">too simple</text><text x="330" y="140" font-size="10.5" font-weight="700" text-anchor="middle" fill="#9b1c14">overfitting:</text><text x="330" y="154" font-size="10.5" font-weight="700" text-anchor="middle" fill="#9b1c14">memorising noise</text><rect x="20" y="248" width="400" height="34" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="220" y="270" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">Helps: more data · a simpler model · stopping training early</text></g></svg>