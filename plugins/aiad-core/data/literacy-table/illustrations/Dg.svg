<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Rules for data, from start to finish</title><desc id="d">Data governance sets rules at each stage of data's life: collect only what is needed with a clear purpose, store it securely, give access only to those who need it, use it only for the agreed purpose, and delete it on schedule. A school example shows who may see pupil data, and that an AI tool may only if it has been approved.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">THE LIFE OF PUPIL DATA</text><rect x="20.0" y="40" width="70.4" height="70" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="55.2" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">COLLECT</text><text x="55.2" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">only what's</text><text x="55.2" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">needed, why</text><line x1="91.4" y1="75.0" x2="101.4" y2="75.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="102.4" y="40" width="70.4" height="70" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="137.6" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">STORE</text><text x="137.6" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">secure,</text><text x="137.6" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">in the UK?</text><line x1="173.8" y1="75.0" x2="183.8" y2="75.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="184.8" y="40" width="70.4" height="70" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">ACCESS</text><text x="220.0" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">only those</text><text x="220.0" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">who need it</text><line x1="256.2" y1="75.0" x2="266.2" y2="75.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="267.2" y="40" width="70.4" height="70" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="302.4" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">USE</text><text x="302.4" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">for the agreed</text><text x="302.4" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">purpose</text><line x1="338.6" y1="75.0" x2="348.6" y2="75.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="349.6" y="40" width="70.4" height="70" fill="#FDE3F9" stroke="#231F20" stroke-width="1.5"/><text x="384.8" y="58" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">DELETE</text><text x="384.8" y="76" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">on a</text><text x="384.8" y="89" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">schedule</text><rect x="20" y="128" width="400" height="140" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="148" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">WHO MAY SEE PUPIL DATA?</text><circle cx="40" cy="168" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M36 168l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="172" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Class teacher</text><text x="200" y="172" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">their own classes</text><circle cx="40" cy="192" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M36 192l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="196" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">School office</text><text x="200" y="196" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">contact details</text><circle cx="40" cy="216" r="8" fill="#63DF93" stroke="#231F20" stroke-width="1.2"/><path d="M36 216l3 3.5 5.5-6.5" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="220" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Approved AI tool</text><text x="200" y="220" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">only what its agreement allows</text><circle cx="40" cy="240" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M36.5 236.5l7 7M43.5 236.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="56" y="244" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Unapproved AI app</text><text x="200" y="244" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">nothing</text><text x="220" y="288" font-size="11" font-weight="700" text-anchor="middle" fill="#006A7D">A named person is responsible for each rule.</text></g></svg>