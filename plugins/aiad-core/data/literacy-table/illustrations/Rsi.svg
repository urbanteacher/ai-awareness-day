<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">AI helping to build the next AI</title><desc id="d">Version 1 of a model helps make version 2: writing some of the code, creating training data, grading answers and testing for problems. If version 2 is better at that work, it helps more with version 3. I. J. Good described this loop in 1965. Whether it speeds up or hits limits, such as computing power and people's checks, is debated.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><circle cx="70" cy="100" r="30" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="70" y="104" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">version 1</text><line x1="104" y1="100" x2="180" y2="100" stroke="#6441B8" stroke-width="2.4" marker-end="url(#ar)"/><circle cx="220" cy="100" r="36" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="220" y="104" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">version 2</text><line x1="260" y1="100" x2="324" y2="100" stroke="#6441B8" stroke-width="2.4" marker-end="url(#ar)"/><circle cx="370" cy="100" r="42" fill="#AC91FF" stroke="#231F20" stroke-width="1.5"/><text x="370" y="104" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">version 3</text><text x="145" y="56" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">helps build</text><text x="295" y="56" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">helps more?</text><rect x="20" y="150" width="196" height="104" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="118" y="170" font-size="10" font-weight="800" text-anchor="middle" fill="#176E3B">ALREADY HAPPENING</text><text x="118" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">writes some of the code</text><text x="118" y="205" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">makes training data</text><text x="118" y="220" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">grades answers</text><text x="118" y="235" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">tests for problems</text><rect x="224" y="150" width="196" height="104" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="322" y="170" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">DEBATED</text><text x="322" y="190" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">does it speed up, or</text><text x="322" y="205" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">hit limits: computing</text><text x="322" y="220" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">power, data, people's</text><text x="322" y="235" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">checks?</text><text x="220" y="276" font-size="11" font-weight="700" text-anchor="middle" fill="#5f5a52">First described by I. J. Good in 1965.</text></g></svg>