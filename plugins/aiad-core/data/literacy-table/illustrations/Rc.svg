<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Two ways to recommend</title><desc id="d">Recommendation engines mostly mix two ideas. Content-based: suggest things similar to what you liked, such as more football clips. Collaborative: suggest what people with similar tastes liked, such as a cooking channel. Each click feeds back in, which can narrow what you are shown.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="196" height="170" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="118" y="60" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">LIKE WHAT YOU LIKED</text><text x="118" y="78" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">content-based</text><text x="118" y="104" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">you watched</text><text x="118" y="119" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">football clips</text><line x1="118" y1="124" x2="118" y2="150" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="48" y="152" width="140" height="40" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="118" y="177" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">more football</text><rect x="224" y="40" width="196" height="170" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="322" y="60" font-size="10.5" font-weight="800" text-anchor="middle" fill="#6441B8">LIKED BY PEOPLE LIKE YOU</text><text x="322" y="78" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">collaborative</text><text x="322" y="104" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">others who watch football</text><text x="322" y="118" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">and music also watch…</text><line x1="322" y1="124" x2="322" y2="150" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="252" y="152" width="140" height="40" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="322" y="177" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">a cooking channel</text><rect x="20" y="224" width="400" height="54" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="246" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Every click feeds back in, which can narrow your feed</text><text x="220" y="262" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">unless the system mixes in something new.</text></g></svg>