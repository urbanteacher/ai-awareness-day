<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Two ways into an AI model</title><desc id="d">To work out how an AI model works, you can probe it from outside, sending inputs and studying the outputs, which works even when the model is closed; or, for an open-weight model, look inside at its numbers and test which parts do what, which is the work of interpretability.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="160" y="100" width="120" height="90" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="220" y="130" font-size="11" font-weight="800" text-anchor="middle" fill="#6441B8">AI MODEL</text><circle cx="190" cy="150" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="190" cy="163" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="190" cy="176" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="210" cy="150" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="210" cy="163" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="210" cy="176" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="230" cy="150" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="230" cy="163" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="230" cy="176" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="250" cy="150" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="250" cy="163" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><circle cx="250" cy="176" r="4" fill="#AC91FF" stroke="#231F20" stroke-width=".8"/><rect x="20" y="40" width="120" height="210" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="80" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#A7350B">FROM OUTSIDE</text><text x="80" y="84" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">send inputs,</text><text x="80" y="99" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">study outputs</text><text x="80" y="128" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">input A → ?</text><text x="80" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">input B → ?</text><text x="80" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">input C → ?</text><text x="80" y="212" font-size="10.5" font-weight="700" text-anchor="middle" fill="#A7350B">works on closed</text><text x="80" y="226" font-size="10.5" font-weight="700" text-anchor="middle" fill="#A7350B">models too</text><line x1="142" y1="145" x2="158" y2="145" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="300" y="40" width="120" height="210" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="360" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">FROM INSIDE</text><text x="360" y="84" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">open the weights,</text><text x="360" y="99" font-size="11" font-weight="400" text-anchor="middle" fill="#5f5a52">test the parts</text><text x="360" y="128" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">which numbers</text><text x="360" y="143" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">light up for</text><text x="360" y="158" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">which ideas?</text><text x="360" y="212" font-size="10.5" font-weight="700" text-anchor="middle" fill="#006A7D">needs an open-</text><text x="360" y="226" font-size="10.5" font-weight="700" text-anchor="middle" fill="#006A7D">weight model</text><line x1="298" y1="145" x2="282" y2="145" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="220" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#9b1c14">Probing a closed service may break its terms of use.</text></g></svg>