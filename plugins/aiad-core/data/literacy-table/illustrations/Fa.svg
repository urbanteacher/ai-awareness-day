<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Fair by which measure?</title><desc id="d">An exam-results predictor is checked on two groups. Both get 85% of predictions right overall, but Group B students are wrongly predicted to fail three times as often: 15% against 5%.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">ONE PREDICTOR, TWO GROUPS</text><text x="20" y="42" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">Will this student pass? Checked against real results.</text><text x="250" y="66" font-size="10" font-weight="800" text-anchor="middle" fill="#006A7D">GROUP A</text><text x="360" y="66" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">GROUP B</text><rect x="20" y="78" width="400" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="105" font-size="12" font-weight="400" text-anchor="start" fill="#231F20">Right overall</text><rect x="205" y="90" width="90" height="12" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="205" y="90" width="76.5" height="12" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><text x="250" y="116" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">85%</text><rect x="315" y="90" width="90" height="12" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="315" y="90" width="76.5" height="12" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="360" y="116" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">85%</text><rect x="20" y="130" width="400" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="157" font-size="12" font-weight="400" text-anchor="start" fill="#231F20">Predicted to pass</text><rect x="205" y="142" width="90" height="12" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="205" y="142" width="63.0" height="12" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><text x="250" y="168" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">70%</text><rect x="315" y="142" width="90" height="12" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="315" y="142" width="49.5" height="12" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="360" y="168" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">55%</text><rect x="20" y="182" width="400" height="44" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="32" y="209" font-size="12" font-weight="700" text-anchor="start" fill="#231F20">Wrongly predicted to fail</text><rect x="205" y="194" width="90" height="12" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="205" y="194" width="4.5" height="12" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><text x="250" y="220" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">5%</text><rect x="315" y="194" width="90" height="12" fill="#fff" stroke="#231F20" stroke-width="1"/><rect x="315" y="194" width="13.5" height="12" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="360" y="220" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">15%</text><text x="220" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#9b1c14">Same accuracy, but B's mistakes</text><text x="220" y="270" font-size="12" font-weight="700" text-anchor="middle" fill="#9b1c14">cost them three times as often.</text></g></svg>