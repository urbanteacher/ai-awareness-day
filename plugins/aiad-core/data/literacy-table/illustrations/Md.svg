<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">What a model actually is</title><desc id="d">Training runs an algorithm over data and produces a model: a file of numbers, its parameters. Using the model means feeding in an input, a photo or a question, and letting those numbers turn it into an output. A small model might have thousands of numbers; a large language model has billions.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="30" font-size="10.5" font-weight="800" text-anchor="start" fill="#5f5a52">MAKING IT (TRAINING)</text><rect x="20.0" y="38" width="125.3" height="54" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">DATA</text><text x="82.7" y="74" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">examples</text><line x1="146.3" y1="65.0" x2="156.3" y2="65.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="38" width="125.3" height="54" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">ALGORITHM</text><text x="220.0" y="74" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">learns from them</text><line x1="283.7" y1="65.0" x2="293.7" y2="65.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="38" width="125.3" height="54" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">MODEL</text><text x="357.3" y="74" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">a file of numbers</text><rect x="308" y="104" width="112" height="46" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="364" y="122" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">0.12 −0.80 1.31</text><text x="364" y="135" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">0.07 0.44 …</text><text x="20" y="176" font-size="10.5" font-weight="800" text-anchor="start" fill="#5f5a52">USING IT</text><rect x="20.0" y="184" width="125.3" height="58" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="202" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">INPUT</text><text x="82.7" y="220" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">a photo of a leaf</text><line x1="146.3" y1="213.0" x2="156.3" y2="213.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="184" width="125.3" height="58" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="202" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">MODEL</text><text x="220.0" y="220" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">its numbers do</text><text x="220.0" y="233" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">the sums</text><line x1="283.7" y1="213.0" x2="293.7" y2="213.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="184" width="125.3" height="58" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="202" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">OUTPUT</text><text x="357.3" y="220" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">"oak, 94% sure"</text><text x="220" y="270" font-size="11" font-weight="700" text-anchor="middle" fill="#A7350B">Thousands of numbers in a small model; billions in an LLM.</text></g></svg>