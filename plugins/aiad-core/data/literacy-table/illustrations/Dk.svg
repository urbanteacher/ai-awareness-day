<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Stop, check the source, report</title><desc id="d">Spotting glitches in deepfakes, such as odd hands or blinking, works less and less as tools improve. Better habits: stop before sharing, check who posted it first and whether trusted news reports it, look for a content credentials label, and report it. Creating sexual deepfakes is a crime.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="46" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="54" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5f5a52">Looking for glitches (hands, blinking, lip sync) works less</text><text x="220" y="69" font-size="10.5" font-weight="700" text-anchor="middle" fill="#5f5a52">and less as the tools improve. Check the source instead.</text><rect x="20" y="94" width="128" height="128" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="84" y="114" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">1 · STOP</text><text x="84" y="136" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">before you share</text><text x="84" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">or react</text><text x="84" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">shocking = suspicious</text><line x1="149" y1="158" x2="155" y2="158" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="156" y="94" width="128" height="128" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220" y="114" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">2 · CHECK</text><text x="220" y="136" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">who posted it first?</text><text x="220" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">do trusted news sites</text><text x="220" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">report it too?</text><text x="220" y="181" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">a content credentials</text><text x="220" y="196" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">label?</text><line x1="285" y1="158" x2="291" y2="158" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="292" y="94" width="128" height="128" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="356" y="114" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">3 · REPORT</text><text x="356" y="136" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">to the platform</text><text x="356" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">tell a trusted adult</text><text x="356" y="166" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">Childline</text><text x="356" y="181" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">Report Remove</text><rect x="20" y="234" width="400" height="46" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="252" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">Making a sexual deepfake of someone without consent is a crime</text><text x="220" y="267" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">in England and Wales; of an under-18, it always is.</text></g></svg>