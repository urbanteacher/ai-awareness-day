<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">A message sent the moment something happens</title><desc id="d">When a parent pays for a trip, the payment app sends a short message to a web address the school's system gave it: which event, which pupil, how much. The school system checks the message is genuine, replies "got it", and updates the trip list. No one had to ask.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="120" height="70" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="80" y="66" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PAYMENT APP</text><text x="80" y="84" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">a parent pays</text><rect x="300" y="40" width="120" height="70" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="360" y="66" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">SCHOOL SYSTEM</text><text x="360" y="84" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">trip list updated</text><line x1="142" y1="62" x2="298" y2="62" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="220" y="54" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">sends a message, at once</text><line x1="298" y1="92" x2="142" y2="92" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="220" y="106" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">replies "got it" (200 OK)</text><rect x="60" y="126" width="320" height="92" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="72" y="144" font-size="9" font-weight="800" text-anchor="start" fill="#5f5a52">THE MESSAGE, SENT TO school.example/hooks/pay</text><text x="72" y="166" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">{ "event": "payment.paid",</text><text x="72" y="182" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">  "pupil": "Y8-0412", "amount": 12.50,</text><text x="72" y="198" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">  "signature": "a91f…" }</text><rect x="20" y="230" width="400" height="48" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="249" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Anyone could send to that address, so the school system</text><text x="220" y="265" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">checks the signature before trusting it.</text></g></svg>