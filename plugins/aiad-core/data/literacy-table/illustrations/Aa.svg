<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Agents from different companies working together</title><desc id="d">A school's trip-planning agent needs a coach booked. It reads a booking agent's "agent card", which says what it can do and how to connect, then sends the task. The booking agent, made by another company, replies with progress and the result. MCP connects an agent to tools; A2A connects agents to each other.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="130" height="80" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="85" y="64" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">TRIP AGENT</text><text x="85" y="80" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">company A</text><text x="85" y="96" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">needs a coach</text><rect x="290" y="40" width="130" height="80" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="355" y="64" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">BOOKING AGENT</text><text x="355" y="80" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">company B</text><text x="355" y="96" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">books coaches</text><line x1="152" y1="56" x2="288" y2="56" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="220" y="50" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">1 reads its agent card</text><line x1="152" y1="80" x2="288" y2="80" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="220" y="74" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">2 sends the task</text><line x1="288" y1="104" x2="152" y2="104" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="220" y="98" font-size="9.5" font-weight="700" text-anchor="middle" fill="#5f5a52">3 progress, then result</text><rect x="100" y="132" width="240" height="76" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="112" y="150" font-size="9.5" font-weight="800" text-anchor="start" fill="#5f5a52">AGENT CARD</text><text x="112" y="168" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">name: Coach Booker</text><text x="112" y="183" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">skills: quote, book, cancel</text><text x="112" y="198" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">connect: address + how to sign in</text><rect x="20" y="220" width="400" height="58" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">MCP: an agent uses tools.  A2A: agents work with agents.</text><text x="220" y="257" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Each side still checks who it is talking to.</text></g></svg>