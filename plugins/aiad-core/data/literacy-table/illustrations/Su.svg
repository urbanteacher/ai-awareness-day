<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Learn from answers, then test on new ones</title><desc id="d">In supervised learning, labelled examples are split: most are used to train the model, and some are kept back. The trained model is tested on the kept-back examples it has never seen, and its score there shows how well it will do on new data.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">1,000 LABELLED PHOTOS</text><rect x="20" y="40" width="320" height="34" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><rect x="340" y="40" width="80" height="34" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="180" y="62" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">800 to train on</text><text x="380" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">200 kept back</text><line x1="180" y1="76" x2="180" y2="104" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="110" y="106" width="140" height="56" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="180" y="128" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">learns from photos</text><text x="180" y="143" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">and their answers</text><line x1="252" y1="134" x2="300" y2="134" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="380" y1="76" x2="380" y2="104" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="302" y="106" width="118" height="56" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="361" y="128" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">tested on photos</text><text x="361" y="143" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">it never saw</text><rect x="20" y="190" width="400" height="26" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="208" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Score on training photos</text><text x="408" y="208" font-size="13" font-weight="800" text-anchor="end" fill="#5f5a52">99%</text><rect x="20" y="222" width="400" height="26" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="240" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Score on kept-back photos</text><text x="408" y="240" font-size="13" font-weight="800" text-anchor="end" fill="#176E3B">92%</text><text x="220" y="282" font-size="12" font-weight="700" text-anchor="middle" fill="#006A7D">The kept-back score is the one to trust.</text></g></svg>