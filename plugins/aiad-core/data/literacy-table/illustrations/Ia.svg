<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Bots plus AI that can decide</title><desc id="d">Intelligent automation adds AI to bots. Emails arrive in a school office inbox. An AI model reads each one and picks its topic, with a confidence score: absence, trip, or complaint. A bot then files it in the right place. Anything the AI is unsure about goes to a person.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="100" height="120" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="70" y="60" font-size="10" font-weight="800" text-anchor="middle" fill="#5f5a52">INBOX</text><rect x="34" y="72" width="72" height="14" fill="#D6F4FA" stroke="#231F20" stroke-width=".8"/><rect x="34" y="92" width="72" height="14" fill="#D6F4FA" stroke="#231F20" stroke-width=".8"/><rect x="34" y="112" width="72" height="14" fill="#D6F4FA" stroke="#231F20" stroke-width=".8"/><rect x="34" y="132" width="72" height="14" fill="#D6F4FA" stroke="#231F20" stroke-width=".8"/><line x1="122" y1="100" x2="146" y2="100" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="148" y="40" width="120" height="120" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="208" y="60" font-size="10" font-weight="800" text-anchor="middle" fill="#6441B8">AI READS IT</text><text x="160" y="84" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">absence</text><text x="256" y="84" font-size="10.5" font-weight="800" text-anchor="end" fill="#231F20">96%</text><text x="160" y="104" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">trip</text><text x="256" y="104" font-size="10.5" font-weight="800" text-anchor="end" fill="#231F20">91%</text><text x="160" y="124" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">complaint</text><text x="256" y="124" font-size="10.5" font-weight="800" text-anchor="end" fill="#231F20">88%</text><text x="160" y="144" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">unsure</text><text x="256" y="144" font-size="10.5" font-weight="800" text-anchor="end" fill="#9b1c14">54%</text><line x1="270" y1="100" x2="294" y2="100" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="296" y="40" width="124" height="74" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="358" y="60" font-size="10" font-weight="800" text-anchor="middle" fill="#006A7D">BOT FILES IT</text><text x="358" y="80" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">register, trips folder,</text><text x="358" y="94" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">head of year</text><rect x="296" y="122" width="124" height="38" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="358" y="146" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">unsure → a person</text><rect x="20" y="180" width="400" height="98" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="200" font-size="10" font-weight="800" text-anchor="start" fill="#5f5a52">RPA ON ITS OWN</text><text x="32" y="218" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">follows fixed rules: can't tell what an email is about</text><text x="32" y="244" font-size="10" font-weight="800" text-anchor="start" fill="#6441B8">WITH AI ADDED</text><text x="32" y="262" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">reads, sorts and picks between options, with a confidence score</text></g></svg>