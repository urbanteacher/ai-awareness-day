<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Finding groups no one named</title><desc id="d">Songs are plotted by tempo and energy, with no labels. Unsupervised learning finds three groups by itself. It does not know what they mean: a person looks at each group and names it, such as calm, pop and workout.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">SONGS, NO LABELS</text><path d="M40 44 V234 H270" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="270" y="248" font-size="9.5" font-weight="400" text-anchor="end" fill="#5f5a52">energy →</text><text x="36" y="40" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">tempo ↑</text><circle cx="83" cy="191" r="5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="74" cy="197" r="5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="98" cy="181" r="5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="73" cy="176" r="5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="69" cy="197" r="5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="103" cy="190" r="5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><circle cx="71" cy="186" r="5" fill="#D6F4FA" stroke="#231F20" stroke-width="1"/><ellipse cx="90" cy="190" rx="34" ry="28" fill="none" stroke="#00BEDD" stroke-width="2" stroke-dasharray="5 4"/><circle cx="171" cy="126" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="161" cy="109" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="149" cy="98" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="154" cy="105" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="139" cy="108" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="155" cy="104" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><circle cx="148" cy="111" r="5" fill="#FFE2D5" stroke="#231F20" stroke-width="1"/><ellipse cx="160" cy="110" rx="34" ry="28" fill="none" stroke="#FF7038" stroke-width="2" stroke-dasharray="5 4"/><circle cx="226" cy="75" r="5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="213" cy="73" r="5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="250" cy="76" r="5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="240" cy="67" r="5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="219" cy="67" r="5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="238" cy="69" r="5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><circle cx="213" cy="87" r="5" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><ellipse cx="230" cy="70" rx="34" ry="28" fill="none" stroke="#AC91FF" stroke-width="2" stroke-dasharray="5 4"/><rect x="290" y="44" width="130" height="190" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="355" y="64" font-size="9" font-weight="800" text-anchor="middle" fill="#231F20">A PERSON NAMES THEM</text><rect x="304" y="84" width="102" height="32" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="355" y="105" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">workout</text><rect x="304" y="130" width="102" height="32" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="355" y="151" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">pop</text><rect x="304" y="176" width="102" height="32" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="355" y="197" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">calm</text><text x="220" y="270" font-size="11.5" font-weight="700" text-anchor="middle" fill="#A7350B">The AI finds the groups; people decide what they mean.</text></g></svg>