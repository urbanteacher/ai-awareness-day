<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Why tone is hard to read</title><desc id="d">Simple sentiment analysis counts positive and negative words, which goes wrong with sarcasm ("Great, another Monday"), negation ("not bad") and mixed reviews ("food great, service slow"). Better systems read the whole sentence, and can score each topic separately.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="160" y="30" font-size="10" font-weight="800" text-anchor="middle" fill="#5f5a52">WORD-COUNTING SAYS</text><text x="340" y="30" font-size="10" font-weight="800" text-anchor="middle" fill="#5f5a52">REALLY</text><rect x="20" y="42" width="400" height="58" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="62" font-size="10" font-weight="800" text-anchor="start" fill="#5f5a52">SARCASM</text><text x="32" y="84" font-size="12" font-weight="700" text-anchor="start" fill="#231F20">"Great, another Monday."</text><text x="260" y="84" font-size="11" font-weight="700" text-anchor="middle" fill="#176E3B">positive</text><text x="360" y="84" font-size="11" font-weight="800" text-anchor="middle" fill="#9b1c14">negative</text><rect x="20" y="108" width="400" height="58" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="128" font-size="10" font-weight="800" text-anchor="start" fill="#5f5a52">NEGATION</text><text x="32" y="150" font-size="12" font-weight="700" text-anchor="start" fill="#231F20">"Not bad at all."</text><text x="260" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#9b1c14">negative</text><text x="360" y="150" font-size="11" font-weight="800" text-anchor="middle" fill="#176E3B">positive</text><rect x="20" y="174" width="400" height="58" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="194" font-size="10" font-weight="800" text-anchor="start" fill="#5f5a52">MIXED</text><text x="32" y="216" font-size="12" font-weight="700" text-anchor="start" fill="#231F20">"Food great, service slow."</text><text x="260" y="216" font-size="11" font-weight="700" text-anchor="middle" fill="#176E3B">positive</text><text x="360" y="216" font-size="11" font-weight="800" text-anchor="middle" fill="#A7350B">food + / service −</text><text x="220" y="254" font-size="11.5" font-weight="700" text-anchor="middle" fill="#A7350B">Reading the whole sentence, and scoring each topic,</text><text x="220" y="272" font-size="11.5" font-weight="700" text-anchor="middle" fill="#A7350B">gets much closer to what people mean.</text></g></svg>