<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">How an uncensored model differs from a jailbreak</title><desc id="d">A jailbreak tricks an unchanged model with a cleverly worded prompt, and the company can patch it. An uncensored model is a downloaded copy that someone has altered, by retraining or abliteration, so the change is built into the file and nobody can patch it centrally. Illegal content is illegal from either.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="190" height="190" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="115" y="64" font-size="11" font-weight="800" text-anchor="middle" fill="#A7350B">JAILBREAK</text><text x="38" y="96" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· model unchanged</text><text x="38" y="122" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· a tricky prompt fools it</text><text x="38" y="148" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· company can patch it</text><rect x="230" y="40" width="190" height="190" fill="#FCEBEB" stroke="#231F20" stroke-width="1.5"/><text x="325" y="64" font-size="11" font-weight="800" text-anchor="middle" fill="#9b1c14">UNCENSORED MODEL</text><text x="248" y="96" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· the file itself altered</text><text x="248" y="122" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· by retraining or abliteration</text><text x="248" y="148" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· runs on someone's own</text><text x="248" y="174" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· computer: no patch</text><rect x="20" y="242" width="400" height="38" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="266" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Either way, illegal content is still illegal.</text></g></svg>