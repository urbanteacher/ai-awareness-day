<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">What being open about AI covers</title><desc id="d">Transparency answers four questions about an AI system: Is AI being used? What was it built from? Where does it go wrong? Who is responsible? A model card is one way to write the answers down, and a label tells people when content is AI-generated.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">FOUR QUESTIONS TO ANSWER OPENLY</text><rect x="20" y="40" width="236" height="46" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="59" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Is AI being used?</text><text x="32" y="76" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">Tell people: "This reply was written by AI."</text><rect x="20" y="94" width="236" height="46" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="32" y="113" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">What was it built from?</text><text x="32" y="130" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">The data it learned from, and its date.</text><rect x="20" y="148" width="236" height="46" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="32" y="167" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Where does it go wrong?</text><text x="32" y="184" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">Its known limits and mistakes.</text><rect x="20" y="202" width="236" height="46" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="32" y="221" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">Who is responsible?</text><text x="32" y="238" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">A named person or team to contact.</text><rect x="280" y="40" width="140" height="208" fill="#fff" stroke="#231F20" stroke-width="1.5"/><rect x="280" y="40" width="140" height="26" fill="#231F20"/><text x="350" y="58" font-size="11" font-weight="800" text-anchor="middle" fill="#fff">MODEL CARD</text><rect x="290" y="80" width="8" height="28" fill="#00BEDD" stroke="#231F20" stroke-width="1"/><text x="306" y="92" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Purpose</text><rect x="306" y="98" width="100" height="5" fill="#d8d3c8"/><rect x="290" y="120" width="8" height="28" fill="#AC91FF" stroke="#231F20" stroke-width="1"/><text x="306" y="132" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Training data</text><rect x="306" y="138" width="100" height="5" fill="#d8d3c8"/><rect x="290" y="160" width="8" height="28" fill="#FF7038" stroke="#231F20" stroke-width="1"/><text x="306" y="172" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Limits</text><rect x="306" y="178" width="100" height="5" fill="#d8d3c8"/><rect x="290" y="200" width="8" height="28" fill="#63DF93" stroke="#231F20" stroke-width="1"/><text x="306" y="212" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Contact</text><rect x="306" y="218" width="100" height="5" fill="#d8d3c8"/><rect x="280" y="258" width="140" height="30" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="350" y="278" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">Label: AI-generated</text></g></svg>