<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">From text to a voice</title><desc id="d">Text-to-speech first tidies the text, so "Dr" becomes "doctor" and "29/4" becomes "the 29th of April". It works out the sounds and where the stress and pauses go, then a neural voice model turns them into audio. Some tools can copy a real voice from a short recording, which is why consent matters.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="36" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="59" font-size="13" font-weight="800" text-anchor="middle" fill="#231F20">"Dr Khan's talk is on 29/4."</text><rect x="20" y="84" width="400" height="36" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="99" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">1 · TIDY THE TEXT</text><text x="32" y="114" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">"Doctor Khan's talk is on the 29th of April."</text><rect x="20" y="128" width="400" height="36" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="32" y="143" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">2 · WORK OUT THE SOUNDS</text><text x="32" y="158" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">DOK-tuh KAHN · stress, pauses, rising or falling</text><rect x="20" y="172" width="400" height="36" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="32" y="187" font-size="9.5" font-weight="800" text-anchor="start" fill="#231F20">3 · A VOICE MODEL</text><text x="32" y="202" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">turns the sounds into audio</text><polyline points="40.0,226.0 43.6,228.1 47.2,230.4 50.8,232.2 54.4,232.8 58.0,231.9 61.6,229.4 65.2,225.6 68.8,221.4 72.4,217.6 76.0,215.2 79.6,215.0 83.2,217.2 86.8,221.5 90.4,227.0 94.0,232.7 97.6,237.2 101.2,239.5 104.8,239.1 108.4,235.9 112.0,230.6 115.6,224.3 119.2,218.4 122.8,214.2 126.4,212.4 130.0,213.5 133.6,217.1 137.2,222.3 140.8,228.0 144.4,232.9 148.0,236.0 151.6,236.9 155.2,235.4 158.8,232.3 162.4,228.3 166.0,224.3 169.6,221.3 173.2,219.8 176.8,219.8 180.4,221.1 184.0,223.1 187.6,225.1 191.2,227.2 194.8,229.6 198.4,231.8 202.0,233.1 205.6,232.9 209.2,231.0 212.8,227.6 216.4,223.3 220.0,219.0 223.6,215.7 227.2,214.5 230.8,215.6 234.4,219.1 238.0,224.3 241.6,230.2 245.2,235.4 248.8,238.9 252.4,239.8 256.0,237.8 259.6,233.3 263.2,227.3 266.8,221.1 270.4,216.0 274.0,213.0 277.6,212.8 281.2,215.3 284.8,219.8 288.4,225.4 292.0,230.6 295.6,234.6 299.2,236.4 302.8,236.0 306.4,233.6 310.0,230.0 313.6,226.1 317.2,222.8 320.8,220.7 324.4,220.1 328.0,220.9 331.6,222.5 335.2,224.2 338.8,226.1 342.4,228.7 346.0,231.3 349.6,233.1 353.2,233.7 356.8,232.5 360.4,229.5 364.0,225.3 367.6,220.7 371.2,216.8 374.8,214.5 378.4,214.5 382.0,217.0 385.6,221.6 389.2,227.4 392.8,233.2 396.4,237.7 400.0,239.8" fill="none" stroke="#A7350B" stroke-width="2"/><rect x="20" y="248" width="400" height="34" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="270" font-size="11" font-weight="700" text-anchor="middle" fill="#9b1c14">A voice can be copied from a short sample: ask permission first.</text></g></svg>