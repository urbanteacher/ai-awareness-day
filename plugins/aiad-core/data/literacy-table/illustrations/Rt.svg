<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">The red-team loop</title><desc id="d">Red teamers plan attacks such as trick prompts, misuse and bias probes, attack the model, log every failure, fix it with new guardrails or retraining, and test again. Only when the model passes is it released, and the loop carries on afterwards.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">BREAK IT BEFORE OTHERS DO</text><rect x="50" y="40" width="140" height="68" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="120" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PLAN ATTACKS</text><text x="120" y="80" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">trick prompts</text><text x="120" y="95" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">misuse, bias probes</text><rect x="250" y="40" width="140" height="68" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="320" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">ATTACK</text><text x="320" y="80" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">send them to</text><text x="320" y="95" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">the model</text><rect x="250" y="152" width="140" height="68" fill="#FCEBEB" stroke="#231F20" stroke-width="1.5"/><text x="320" y="174" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">LOG FAILURES</text><text x="320" y="192" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">what got</text><text x="320" y="207" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">through?</text><rect x="50" y="152" width="140" height="68" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="120" y="174" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">FIX</text><text x="120" y="192" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">guardrails,</text><text x="120" y="207" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">retraining</text><line x1="192" y1="74" x2="248" y2="74" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="320" y1="110" x2="320" y2="150" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="248" y1="186" x2="192" y2="186" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="120" y1="150" x2="120" y2="110" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="220" y="135" font-size="11" font-weight="700" text-anchor="middle" fill="#5f5a52">test again</text><rect x="120" y="244" width="200" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="269" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Risks acceptable → release</text><line x1="120" y1="222" x2="160" y2="242" stroke="#231F20" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ar)"/></g></svg>