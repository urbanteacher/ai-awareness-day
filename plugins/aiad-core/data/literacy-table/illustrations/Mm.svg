<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Different inputs, one shared model</title><desc id="d">A multimodal model takes a photo of the inside of a fridge and the question "What can I cook?". Each kind of input is turned into the same kind of numbers, so one model can read them together and answer in text, or in other modes such as speech or an image.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="130" height="50" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="60" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">PHOTO</text><text x="32" y="78" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">inside of a fridge</text><line x1="152" y1="65" x2="188" y2="105" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="102" width="130" height="50" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="32" y="122" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">TEXT</text><text x="32" y="140" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">"What can I cook?"</text><line x1="152" y1="127" x2="188" y2="125" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="164" width="130" height="50" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="32" y="184" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">AUDIO</text><text x="32" y="202" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">or ask out loud</text><line x1="152" y1="189" x2="188" y2="145" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="190" y="70" width="104" height="110" fill="#FFF3C4" stroke="#231F20" stroke-width="2.5"/><text x="242" y="104" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">all turned into</text><text x="242" y="117" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">the same kind</text><text x="242" y="130" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">of numbers:</text><text x="242" y="143" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">one model</text><text x="242" y="156" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">reads them</text><text x="242" y="169" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">together</text><line x1="296" y1="125" x2="316" y2="125" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="318" y="70" width="102" height="110" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="369" y="90" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">ANSWER</text><text x="369" y="112" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">"Omelette:</text><text x="369" y="126" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">you have eggs,</text><text x="369" y="140" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">cheese and</text><text x="369" y="154" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">peppers."</text><rect x="20" y="222" width="400" height="54" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="244" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">It can still misread a picture: check what it says it saw.</text><text x="220" y="260" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Some models can also answer in speech or images.</text></g></svg>