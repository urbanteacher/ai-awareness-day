<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Why a forest of trees differs</title><desc id="d">A random forest trains each tree on a different random sample of the data, and lets each tree look at a random choice of questions. The trees end up different, so their mistakes differ too, and when they vote the mistakes tend to cancel out.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="150" y="36" width="140" height="40" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220" y="61" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">All the data</text><line x1="220" y1="78" x2="80" y2="100" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="102" width="120" height="110" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="80" y="122" font-size="9" font-weight="800" text-anchor="middle" fill="#5f5a52">RANDOM SAMPLE</text><text x="80" y="140" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">rows 1, 3, 3, 7…</text><text x="80" y="158" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">may ask: rain, wind</text><path d="M80 170 l-14 18 h28 z" fill="#63DF93" stroke="#231F20" stroke-width="1"/><rect x="77" y="188" width="6" height="8" fill="#A7350B"/><text x="80" y="208" font-size="10.5" font-weight="800" text-anchor="middle" fill="#176E3B">votes Yes</text><line x1="220" y1="78" x2="220" y2="100" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="160" y="102" width="120" height="110" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="220" y="122" font-size="9" font-weight="800" text-anchor="middle" fill="#5f5a52">RANDOM SAMPLE</text><text x="220" y="140" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">rows 2, 5, 6, 6…</text><text x="220" y="158" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">may ask: cold, wind</text><path d="M220 170 l-14 18 h28 z" fill="#63DF93" stroke="#231F20" stroke-width="1"/><rect x="217" y="188" width="6" height="8" fill="#A7350B"/><text x="220" y="208" font-size="10.5" font-weight="800" text-anchor="middle" fill="#176E3B">votes Yes</text><line x1="220" y1="78" x2="360" y2="100" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="300" y="102" width="120" height="110" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="360" y="122" font-size="9" font-weight="800" text-anchor="middle" fill="#5f5a52">RANDOM SAMPLE</text><text x="360" y="140" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">rows 1, 4, 8, 9…</text><text x="360" y="158" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">may ask: rain, cold</text><path d="M360 170 l-14 18 h28 z" fill="#63DF93" stroke="#231F20" stroke-width="1"/><rect x="357" y="188" width="6" height="8" fill="#A7350B"/><text x="360" y="208" font-size="10.5" font-weight="800" text-anchor="middle" fill="#9b1c14">votes No</text><rect x="100" y="230" width="240" height="44" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Vote: Yes, 2 to 1</text><text x="220" y="263" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">different trees, different mistakes</text></g></svg>