<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Three questions for an "AI-powered" claim</title><desc id="d">To test a product's AI claim, ask: what exactly does the AI do, could it be done without AI, and where is the evidence? In 2024 the US Securities and Exchange Commission fined two investment firms, $225,000 and $175,000, for saying they used AI in ways they did not.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="160" height="80" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="100" y="62" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">THE CLAIM</text><text x="100" y="86" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">"Our AI-powered</text><text x="100" y="102" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">revision planner"</text><rect x="200" y="40" width="220" height="54" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="212" y="62" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">1. What does the AI actually do?</text><text x="212" y="80" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">Name the task, not the buzzword.</text><line x1="182" y1="80" x2="198" y2="67" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="200" y="102" width="220" height="54" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="212" y="124" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">2. Could it be done without AI?</text><text x="212" y="142" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">A timer or a rule isn't AI.</text><line x1="182" y1="80" x2="198" y2="129" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="200" y="164" width="220" height="54" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="212" y="186" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">3. Where's the evidence?</text><text x="212" y="204" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">Tests, results, a model card.</text><line x1="182" y1="80" x2="198" y2="191" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="236" width="400" height="44" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="254" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">Real case: in 2024 the US SEC fined two investment firms</text><text x="32" y="269" font-size="10.5" font-weight="700" text-anchor="start" fill="#231F20">($225,000 and $175,000) for AI claims they couldn't back up.</text></g></svg>