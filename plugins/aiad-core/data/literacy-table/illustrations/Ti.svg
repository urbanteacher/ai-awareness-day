<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">What you asked, and what the tool decided</title><desc id="d">The prompt "a fox reading a book in a library, cartoon style" names four things. Everything else in the picture, such as the fox's size, the lighting, the angle and what the book is, is chosen by the tool from patterns in its training images. Those defaults can carry stereotypes, so describe what matters and check what it filled in.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="61" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">"a fox reading a book in a library, cartoon style"</text><rect x="20" y="88" width="160" height="140" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="100" y="108" font-size="10" font-weight="800" text-anchor="middle" fill="#176E3B">YOU ASKED FOR</text><text x="36" y="132" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">✓  a fox</text><text x="36" y="154" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">✓  a book</text><text x="36" y="176" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">✓  a library</text><text x="36" y="198" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">✓  cartoon style</text><rect x="190" y="88" width="230" height="140" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="305" y="108" font-size="10" font-weight="800" text-anchor="middle" fill="#6441B8">THE TOOL DECIDED</text><text x="206" y="132" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">?  colours and lighting</text><text x="206" y="151" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">?  camera angle</text><text x="206" y="170" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">?  what the book is</text><text x="206" y="189" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">?  glasses? a chair? a cat?</text><text x="206" y="208" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">?  who else is there</text><rect x="20" y="240" width="400" height="40" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="256" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">Defaults come from training pictures and can carry stereotypes:</text><text x="220" y="270" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">describe what matters, then check.</text></g></svg>