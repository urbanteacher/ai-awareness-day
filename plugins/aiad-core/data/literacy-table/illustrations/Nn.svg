<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Inside one node, and how it learns</title><desc id="d">Each node takes in numbers, multiplies each by a weight, the strength of that connection, adds them up and passes on a result. A network is layers of these nodes. Learning means nudging the weights so the network's answers get closer to the right ones.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">ONE NODE</text><circle cx="40" cy="50" r="14" fill="#D6F4FA" stroke="#231F20" stroke-width="1.4"/><text x="40" y="54" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">0.9</text><line x1="54" y1="50" x2="146" y2="90" stroke="#231F20" stroke-width="3.4"/><text x="88" y="44" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">× 0.8</text><circle cx="40" cy="90" r="14" fill="#D6F4FA" stroke="#231F20" stroke-width="1.4"/><text x="40" y="94" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">0.2</text><line x1="54" y1="90" x2="146" y2="90" stroke="#231F20" stroke-width="2.5"/><text x="88" y="82" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">× −0.5</text><circle cx="40" cy="130" r="14" fill="#D6F4FA" stroke="#231F20" stroke-width="1.4"/><text x="40" y="134" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">0.6</text><line x1="54" y1="130" x2="146" y2="90" stroke="#231F20" stroke-width="1.9"/><text x="88" y="132" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">× 0.3</text><circle cx="166" cy="90" r="22" fill="#FFF3C4" stroke="#231F20" stroke-width="1.6"/><text x="166" y="94" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">add up</text><line x1="190" y1="90" x2="218" y2="90" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="224" y="94" font-size="13" font-weight="800" text-anchor="start" fill="#231F20">0.80</text><text x="20" y="172" font-size="10.5" font-weight="700" text-anchor="start" fill="#5f5a52">0.9×0.8 + 0.2×(−0.5) + 0.6×0.3 = 0.80</text><text x="290" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">A NETWORK</text><line x1="290" y1="79.0" x2="350" y2="61.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="79.0" x2="350" y2="97.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="79.0" x2="350" y2="133.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="79.0" x2="350" y2="169.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="115.0" x2="350" y2="61.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="115.0" x2="350" y2="97.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="115.0" x2="350" y2="133.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="115.0" x2="350" y2="169.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="151.0" x2="350" y2="61.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="151.0" x2="350" y2="97.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="151.0" x2="350" y2="133.0" stroke="#5f5a52" stroke-width="1"/><line x1="290" y1="151.0" x2="350" y2="169.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="61.0" x2="410" y2="97.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="61.0" x2="410" y2="133.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="97.0" x2="410" y2="97.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="97.0" x2="410" y2="133.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="133.0" x2="410" y2="97.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="133.0" x2="410" y2="133.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="169.0" x2="410" y2="97.0" stroke="#5f5a52" stroke-width="1"/><line x1="350" y1="169.0" x2="410" y2="133.0" stroke="#5f5a52" stroke-width="1"/><circle cx="290" cy="79.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="290" cy="115.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="290" cy="151.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="350" cy="61.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="350" cy="97.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="350" cy="133.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="350" cy="169.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="410" cy="97.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><circle cx="410" cy="133.0" r="9" fill="#ECE5FF" stroke="#231F20" stroke-width="1.2"/><rect x="20" y="196" width="400" height="82" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="216" font-size="10" font-weight="800" text-anchor="start" fill="#6441B8">LEARNING</text><text x="32" y="236" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">Thick lines are strong weights. Training nudges every weight</text><text x="32" y="252" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">so answers get closer to the right ones. Its "knowledge"</text><text x="32" y="268" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">is just these numbers: billions of them in a big model.</text></g></svg>