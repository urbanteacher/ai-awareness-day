<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Rules in, or rules out</title><desc id="d">In traditional programming, people write the rules, and the computer applies them to data to get answers. In machine learning, people give the computer data and the right answers, and it works out the rules, a model, which it can then apply to new data.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="34" font-size="10.5" font-weight="800" text-anchor="start" fill="#006A7D">TRADITIONAL PROGRAMMING</text><rect x="20" y="44" width="160" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="100" y="64" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">rules (written by people)</text><line x1="182" y1="59" x2="216" y2="80" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="82" width="160" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="100" y="102" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">data</text><line x1="182" y1="97" x2="216" y2="80" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="218" y="58" width="70" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="253" y="84" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">computer</text><line x1="290" y1="80" x2="316" y2="80" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="318" y="58" width="102" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="369" y="84" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">answers</text><text x="20" y="144" font-size="10.5" font-weight="800" text-anchor="start" fill="#6441B8">MACHINE LEARNING</text><rect x="20" y="154" width="160" height="30" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="100" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">data</text><line x1="182" y1="169" x2="216" y2="190" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="192" width="160" height="30" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="100" y="212" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">the right answers</text><line x1="182" y1="207" x2="216" y2="190" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="218" y="168" width="70" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="253" y="194" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">computer</text><line x1="290" y1="190" x2="316" y2="190" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="318" y="168" width="102" height="44" fill="#FFF3C4" stroke="#231F20" stroke-width="2.5"/><text x="369" y="194" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">rules: a model</text><text x="220" y="268" font-size="11.5" font-weight="700" text-anchor="middle" fill="#6441B8">The learned rules are only as good as the examples.</text></g></svg>