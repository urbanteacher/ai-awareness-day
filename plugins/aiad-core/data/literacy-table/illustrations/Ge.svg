<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">How an AI answer chooses its sources</title><desc id="d">When you ask an AI search tool a question, it searches the web, reads some pages and writes an answer that cites a few of them. Generative engine optimisation tries to make a page more likely to be cited, for example with clear answers, sources and statistics. In one 2024 study this raised visibility by up to about 40%.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20.0" y="36" width="125.3" height="70" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">YOUR QUESTION</text><text x="82.7" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">"best bike lights</text><text x="82.7" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">for winter?"</text><line x1="146.3" y1="71.0" x2="156.3" y2="71.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="36" width="125.3" height="70" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">AI SEARCHES</text><text x="220.0" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">and reads</text><text x="220.0" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">some pages</text><line x1="283.7" y1="71.0" x2="293.7" y2="71.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="36" width="125.3" height="70" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">WRITES AN ANSWER</text><text x="357.3" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">citing a</text><text x="357.3" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">few of them</text><rect x="20" y="124" width="400" height="104" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="144" font-size="10" font-weight="800" text-anchor="start" fill="#A7350B">WHAT HELPED A PAGE GET CITED, IN ONE STUDY</text><text x="32" y="166" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· quotations from trusted sources</text><text x="32" y="183" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· citing its own sources</text><text x="32" y="200" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· relevant statistics</text><text x="32" y="217" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· clear, direct answers</text><rect x="20" y="238" width="400" height="44" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220" y="256" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">Up to about 40% more visible in that study; results vary.</text><text x="220" y="271" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">Added statistics still have to be true.</text></g></svg>