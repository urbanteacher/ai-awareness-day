<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">AI suggests, the designer decides</title><desc id="d">A 2D design brief, a logo for a school robotics club, goes to an AI tool, which suggests several options. The designer picks one, edits it and turns it into vector paths: clean lines a laser cutter or printer can follow, unlike a pixel image.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="34" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="58" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Brief: a logo for the school robotics club</text><rect x="20" y="84" width="94" height="80" fill="#fff" stroke="#231F20" stroke-width="1.5"/><rect x="49" y="102" width="36" height="30" rx="6" fill="#D6F4FA" stroke="#231F20" stroke-width="1.4"/><circle cx="59" cy="116" r="4" fill="#231F20"/><circle cx="75" cy="116" r="4" fill="#231F20"/><text x="67" y="156" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">option 1</text><rect x="122" y="84" width="94" height="80" fill="#fff" stroke="#231F20" stroke-width="1.5"/><path d="M169 98 l20 34 h-40z" fill="#FFE2D5" stroke="#231F20" stroke-width="1.4"/><text x="169" y="156" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">option 2</text><rect x="224" y="84" width="94" height="80" fill="#DDF8E7" stroke="#231F20" stroke-width="2.5"/><circle cx="271" cy="118" r="20" fill="#ECE5FF" stroke="#231F20" stroke-width="1.4"/><path d="M262 112 h18 M271 112 v16 M259 128 h24" stroke="#231F20" stroke-width="2"/><text x="271" y="156" font-size="9.5" font-weight="800" text-anchor="middle" fill="#176E3B">picked</text><rect x="326" y="84" width="94" height="80" fill="#fff" stroke="#231F20" stroke-width="1.5"/><path d="M353 130 q20 -40 40 0" fill="none" stroke="#231F20" stroke-width="2"/><circle cx="373" cy="108" r="6" fill="#FF7038" stroke="#231F20"/><text x="373" y="156" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">option 4</text><text x="20" y="182" font-size="9.5" font-weight="800" text-anchor="start" fill="#5f5a52">AI SUGGESTS OPTIONS</text><rect x="20.0" y="196" width="125.3" height="54" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="214" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">DESIGNER EDITS</text><text x="82.7" y="232" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">fixes the details</text><line x1="146.3" y1="223.0" x2="156.3" y2="223.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="196" width="125.3" height="54" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="214" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">VECTOR PATHS</text><text x="220.0" y="232" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">clean lines, any size</text><line x1="283.7" y1="223.0" x2="293.7" y2="223.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="196" width="125.3" height="54" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="214" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">LASER CUT</text><text x="357.3" y="232" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">or print</text><text x="220" y="272" font-size="11" font-weight="700" text-anchor="middle" fill="#006A7D">A laser cutter follows paths, not pixels.</text></g></svg>