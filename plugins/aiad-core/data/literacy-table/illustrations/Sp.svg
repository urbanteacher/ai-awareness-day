<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Cheap to make, costly to sort through</title><desc id="d">AI slop is cheap to make: one account can post a hundred AI images or articles an hour, aiming for clicks rather than truth. Signs include generic text, odd details, no named source and accounts posting non-stop. Not sharing it, and choosing trusted sources, stops it spreading.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">ONE ACCOUNT, ONE HOUR</text><rect x="20" y="38" width="10" height="13" fill="#FF7038" stroke="#231F20" stroke-width=".7"/><rect x="32" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="44" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="56" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="68" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="80" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="92" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="104" y="38" width="10" height="13" fill="#FF7038" stroke="#231F20" stroke-width=".7"/><rect x="116" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="128" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="140" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="152" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x="164" y="38" width="10" height="13" fill="#FFE2D5" stroke="#231F20" stroke-width=".7"/><rect x