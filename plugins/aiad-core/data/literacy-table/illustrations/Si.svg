<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Narrow, general, beyond</title><desc id="d">Today's AI is narrow: it can beat every human at chess but cannot do most other jobs. Artificial general intelligence would match people across almost every task. Superintelligence would go far beyond the best people in almost every field. Both are hypothetical; experts disagree on whether, or when, they could arrive, and how to keep them under control.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><line x1="40" y1="44" x2="404" y2="44" stroke="#5f5a52" stroke-width="1.8" marker-end="url(#ar)"/><text x="222" y="36" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">more capable</text><rect x="40" y="150" width="124" height="66" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="102" y="170" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">NARROW AI</text><text x="102" y="188" font-size="9.5" font-weight="700" text-anchor="middle" fill="#231F20">today: superhuman at</text><text x="102" y="201" font-size="9.5" font-weight="700" text-anchor="middle" fill="#231F20">one thing, e.g. chess</text><rect x="160" y="112" width="124" height="66" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="222" y="132" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">GENERAL AI</text><text x="222" y="150" font-size="9.5" font-weight="700" text-anchor="middle" fill="#231F20">would match people</text><text x="222" y="163" font-size="9.5" font-weight="700" text-anchor="middle" fill="#231F20">at almost every task</text><rect x="280" y="74" width="124" height="66" fill="#FDE3F9" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="342" y="94" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">SUPERINTELLIGENCE</text><text x="342" y="112" font-size="9.5" font-weight="700" text-anchor="middle" fill="#231F20">far beyond the best</text><text x="342" y="125" font-size="9.5" font-weight="700" text-anchor="middle" fill="#231F20">people at almost all</text><text x="102" y="232" font-size="10.5" font-weight="800" text-anchor="middle" fill="#176E3B">exists</text><text x="282" y="200" font-size="10.5" font-weight="800" text-anchor="middle" fill="#5f5a52">hypothetical: dashed</text><rect x="20" y="244" width="400" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="260" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">Experts disagree on whether and when; keeping control</text><text x="220" y="275" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">of a far more capable system is an open question.</text></g></svg>