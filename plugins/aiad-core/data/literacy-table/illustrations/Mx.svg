<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Copying a model through its answers</title><desc id="d">An attacker sends a closed model thousands of chosen questions, saves the answers, and trains their own model to match them. The copy can agree with the original most of the time without ever seeing its files. Defences include limiting how many questions one user can ask, giving less detail in answers, and watermarking outputs.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="160" y="40" width="120" height="90" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220" y="64" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">CLOSED MODEL</text><rect x="206" y="88" width="28" height="20" fill="#fff" stroke="#231F20" stroke-width="1.4"/><path d="M211 88v-6a9 9 0 0 1 18 0v6" fill="none" stroke="#231F20" stroke-width="1.4"/><text x="220" y="123" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">files locked</text><rect x="20" y="50" width="110" height="70" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="75" y="74" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">10,000</text><text x="75" y="89" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">chosen</text><text x="75" y="104" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">questions</text><line x1="132" y1="75" x2="158" y2="75" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="282" y1="95" x2="308" y2="95" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="310" y="50" width="110" height="70" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="365" y="78" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">answers</text><text x="365" y="93" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">saved</text><line x1="365" y1="122" x2="365" y2="148" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="290" y="150" width="130" height="60" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="355" y="172" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">copy trained to</text><text x="355" y="186" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">match the answers</text><rect x="20" y="150" width="250" height="100" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="32" y="170" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">DEFENCES</text><text x="32" y="192" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· limit questions per user</text><text x="32" y="208" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· give less detail in answers</text><text x="32" y="224" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· watermark outputs</text><text x="32" y="240" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">· terms of use, and the law</text><text x="220" y="278" font-size="11.5" font-weight="700" text-anchor="middle" fill="#9b1c14">It copies behaviour, not files.</text></g></svg>