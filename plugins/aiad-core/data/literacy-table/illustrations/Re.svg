<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Same AI, different rules, depending on use</title><desc id="d">Under the EU AI Act, the rules depend on what an AI system is used for. In a school: a homework chatbot is limited risk, so users must be told it is AI; AI used to mark exams or decide admissions is high risk, with checks and human oversight; AI that reads pupils' emotions in class is banned.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">EU AI ACT: IN A SCHOOL</text><rect x="20" y="40" width="400" height="50" fill="#F7C1C1" stroke="#231F20" stroke-width="1.5"/><text x="32" y="60" font-size="10.5" font-weight="800" text-anchor="start" fill="#9b1c14">BANNED</text><text x="150" y="60" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Reading pupils' emotions in class</text><text x="150" y="78" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">not allowed (since Feb 2025)</text><rect x="20" y="98" width="400" height="50" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="32" y="118" font-size="10.5" font-weight="800" text-anchor="start" fill="#A7350B">HIGH RISK</text><text x="150" y="118" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">Marking exams, deciding admissions</text><text x="150" y="136" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">checks, records, a human overseeing</text><rect x="20" y="156" width="400" height="50" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="176" font-size="10.5" font-weight="800" text-anchor="start" fill="#006A7D">LIMITED RISK</text><text x="150" y="176" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">A homework help chatbot</text><text x="150" y="194" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">tell users it's AI (since Aug 2026)</text><rect x="20" y="214" width="400" height="50" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="32" y="234" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">MINIMAL RISK</text><text x="150" y="234" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">A spam filter on school email</text><text x="150" y="252" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">no extra rules</text><text x="220" y="288" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">The same model can sit in different rows.</text></g></svg>