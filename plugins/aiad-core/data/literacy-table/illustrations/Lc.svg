<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Build it from blocks</title><desc id="d">A low-code or no-code tool lets you build an automation by dragging blocks: when a form is submitted, if the pupil is in Year 7, send an email to their tutor and add a row to a sheet. It is quick and needs no programming, but someone still has to own it, keep data safe and fix it.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="230" height="32" rx="6" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="57" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">WHEN</text><text x="82" y="57" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">a form is submitted</text><rect x="20" y="76" width="230" height="32" rx="6" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="32" y="97" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">IF</text><text x="82" y="97" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">year group = 7</text><rect x="44" y="116" width="230" height="32" rx="6" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="56" y="137" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">THEN</text><text x="106" y="137" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">email the tutor</text><rect x="44" y="156" width="230" height="32" rx="6" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="56" y="177" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">AND</text><text x="106" y="177" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">add a row to the sheet</text><text x="20" y="210" font-size="10.5" font-weight="700" text-anchor="start" fill="#5f5a52">drag, drop, done: no code</text><rect x="290" y="36" width="130" height="72" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="355" y="56" font-size="10" font-weight="800" text-anchor="middle" fill="#176E3B">GOOD FOR</text><text x="355" y="76" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">quick tools</text><text x="355" y="89" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">made by those</text><text x="355" y="102" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">who use them</text><rect x="290" y="116" width="130" height="86" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="355" y="136" font-size="10" font-weight="800" text-anchor="middle" fill="#A7350B">STILL ASK</text><text x="355" y="156" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">whose data?</text><text x="355" y="170" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">who fixes it?</text><text x="355" y="184" font-size="10" font-weight="700" text-anchor="middle" fill="#231F20">what if it breaks?</text><rect x="20" y="228" width="400" height="50" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Fewer lines of code, same responsibilities:</text><text x="220" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">someone owns it, protects the data and fixes it.</text></g></svg>