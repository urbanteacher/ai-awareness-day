<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">The loop that skips the checks</title><desc id="d">Vibe coding: describe what you want, let the AI write the code, run it, and if it seems to work, ship it. The steps it skips are reading the code, testing the edge cases and checking security. In one 2025 test of over 100 models, 45% of AI-written code samples had a security flaw.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="30" y="38" width="120" height="36" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="90" y="61" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">describe it</text><rect x="170" y="38" width="120" height="36" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="230" y="61" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">AI writes code</text><rect x="170" y="112" width="120" height="36" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="230" y="135" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">run it</text><rect x="30" y="112" width="120" height="36" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="90" y="135" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">"it works!"</text><line x1="152" y1="56" x2="168" y2="56" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="230" y1="76" x2="230" y2="110" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="168" y1="130" x2="152" y2="130" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="90" y1="110" x2="90" y2="76" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="292" y1="130" x2="316" y2="130" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="318" y="112" width="102" height="36" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="369" y="135" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">ship it</text><rect x="20" y="170" width="400" height="64" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="190" font-size="10" font-weight="800" text-anchor="start" fill="#9b1c14">WHAT GETS SKIPPED</text><circle cx="48" cy="214" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M44.5 210.5l7 7M51.5 210.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="62" y="219" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">reading the code</text><circle cx="180" cy="214" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M176.5 210.5l7 7M183.5 210.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="194" y="219" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">testing odd cases</text><circle cx="312" cy="214" r="8" fill="#F7C1C1" stroke="#231F20" stroke-width="1.2"/><path d="M308.5 210.5l7 7M315.5 210.5l-7 7" fill="none" stroke="#231F20" stroke-width="2"/><text x="326" y="219" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">security checks</text><rect x="20" y="244" width="400" height="38" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220" y="268" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">45% of AI-written code samples had a security flaw (Veracode, 2025)</text></g></svg>