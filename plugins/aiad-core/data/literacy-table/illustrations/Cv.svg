<svg viewBox="0 0 440 280" role="img" aria-labelledby="t d"><title id="t">What a computer sees in a picture</title><desc id="d">To a computer an image is a grid of numbers, one per pixel. A vision model passes it through layers: early ones pick out edges, later ones combine them into shapes, and the last ones recognise objects, here a crack in a bottle.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="70" y="30" font-size="9.5" font-weight="800" text-anchor="middle" fill="#231F20">PIXELS = NUMBERS</text><rect x="20" y="40" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="32.5" y="56" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">12</text><rect x="45" y="40" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="57.5" y="56" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">14</text><rect x="70" y="40" width="25" height="25" fill="#888" stroke="#fff" stroke-width="1"/><text x="82.5" y="56" font-size="8.5" font-weight="700" text-anchor="middle" fill="#fff">200</text><rect x="95" y="40" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="107.5" y="56" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">13</text><rect x="20" y="65" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="32.5" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">11</text><rect x="45" y="65" width="25" height="25" fill="#888" stroke="#fff" stroke-width="1"/><text x="57.5" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#fff">210</text><rect x="70" y="65" width="25" height="25" fill="#888" stroke="#fff" stroke-width="1"/><text x="82.5" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#fff">205</text><rect x="95" y="65" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="107.5" y="81" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">12</text><rect x="20" y="90" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="32.5" y="106" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">14</text><rect x="45" y="90" width="25" height="25" fill="#888" stroke="#fff" stroke-width="1"/><text x="57.5" y="106" font-size="8.5" font-weight="700" text-anchor="middle" fill="#fff">198</text><rect x="70" y="90" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="82.5" y="106" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">15</text><rect x="95" y="90" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="107.5" y="106" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">10</text><rect x="20" y="115" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="32.5" y="131" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">13</text><rect x="45" y="115" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="57.5" y="131" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">12</text><rect x="70" y="115" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="82.5" y="131" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">11</text><rect x="95" y="115" width="25" height="25" fill="#eee" stroke="#fff" stroke-width="1"/><text x="107.5" y="131" font-size="8.5" font-weight="700" text-anchor="middle" fill="#231F20">14</text><line x1="124" y1="90" x2="136" y2="90" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="140" y="50" width="80" height="80" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="180" y="70" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">EDGES</text><path d="M156 110 l16 -24 M180 112 l12 -26 M196 92 h14" stroke="#231F20" stroke-width="2"/><line x1="216" y1="90" x2="228" y2="90" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="232" y="50" width="80" height="80" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="272" y="70" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">SHAPES</text><path d="M254 118 v-28 a18 18 0 0 1 36 0 v28 z" fill="none" stroke="#231F20" stroke-width="2"/><line x1="308" y1="90" x2="320" y2="90" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="324" y="50" width="80" height="80" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="364" y="70" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">OBJECTS</text><path d="M354 120 v-30 l6 -10 h8 l6 10 v30 z" fill="#fff" stroke="#231F20" stroke-width="1.5"/><path d="M362 96 l4 8 l-4 6 l3 8" stroke="#9b1c14" stroke-width="2" fill="none"/><rect x="140" y="150" width="264" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="272" y="175" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Answer: bottle, crack found</text><rect x="20" y="210" width="400" height="52" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="220" y="230" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Early layers see edges; later layers see objects.</text><text x="220" y="246" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Unusual lighting or angles can fool it.</text></g></svg>