<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">How a text watermark can work</title><desc id="d">One research method: before each word, a secret key splits the possible next words into a green half and a red half, and the model is nudged towards green, too subtly for readers to notice. A detector with the key counts green words: ordinary text is about half green, watermarked text far more. Heavy rewording weakens the signal.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">A HIDDEN PATTERN IN WORD CHOICE</text><text x="420" y="52" font-size="10" font-weight="400" text-anchor="end" fill="#5f5a52">green = on the secret key's list</text><text x="20" y="52" font-size="10.5" font-weight="800" text-anchor="start" fill="#231F20">ORDINARY TEXT</text><rect x="20" y="62" width="35.6" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="37.8" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">The</text><rect x="59.6" y="62" width="35.6" height="26" fill="#fff" stroke="#231F20" stroke-width="1.2"/><text x="77.4" y="80" font-size="12" font-weight="400" text-anchor="middle" fill="#231F20">cat</text><rect x="99.2" y="62" width="35.6" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="117.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">sat</text><rect x="138.8" y="62" width="42.8" height="26" fill="#fff" stroke="#231F20" stroke-width="1.2"/><text x="160.20000000000002" y="80" font-size="12" font-weight="400" text-anchor="middle" fill="#231F20">down</text><rect x="185.60000000000002" y="62" width="28.4" height="26" fill="#fff" stroke="#231F20" stroke-width="1.2"/><text x="199.8" y="80" font-size="12" font-weight="400" text-anchor="middle" fill="#231F20">by</text><rect x="218.00000000000003" y="62" width="35.6" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="235.80000000000004" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">the</text><rect x="257.6" y="62" width="42.8" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="279.0" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">warm</text><rect x="304.40000000000003" y="62" width="42.8" height="26" fill="#fff" stroke="#231F20" stroke-width="1.2"/><text x="325.8" y="80" font-size="12" font-weight="400" text-anchor="middle" fill="#231F20">fire</text><text x="20" y="110" font-size="12" font-weight="800" text-anchor="start" fill="#231F20">4 of 8 green: 50%</text><text x="20" y="144" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">WATERMARKED</text><rect x="20" y="154" width="35.6" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="37.8" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">The</text><rect x="59.6" y="154" width="35.6" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="77.4" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">cat</text><rect x="99.2" y="154" width="57.2" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="127.80000000000001" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">rested</text><rect x="160.4" y="154" width="42.8" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="181.8" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">near</text><rect x="207.2" y="154" width="35.6" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="225.0" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">the</text><rect x="246.79999999999998" y="154" width="42.8" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="268.2" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">warm</text><rect x="293.59999999999997" y="154" width="50.0" height="26" fill="#fff" stroke="#231F20" stroke-width="1.2"/><text x="318.59999999999997" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#231F20">stove</text><rect x="347.59999999999997" y="154" width="50.0" height="26" fill="#DDF8E7" stroke="#231F20" stroke-width="1.2"/><text x="372.59999999999997" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">today</text><text x="20" y="202" font-size="12" font-weight="800" text-anchor="start" fill="#176E3B">7 of 8 green: 88%</text><rect x="250" y="222" width="170" height="62" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="335" y="244" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Detector has the key:</text><text x="335" y="259" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">many green → likely AI</text><rect x="20" y="222" width="210" height="62" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="125" y="244" font-size="11" font-weight="700" text-anchor="middle" fill="#9b1c14">Heavy rewording pulls the</text><text x="125" y="259" font-size="11" font-weight="700" text-anchor="middle" fill="#9b1c14">green share back towards half.</text></g></svg>