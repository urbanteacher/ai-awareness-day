<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">From words to an action</title><desc id="d">A voice assistant turns "Set a timer for ten minutes" into an action in steps: speech becomes text, the text is split into tokens, the system finds the intent (set a timer) and the details (10 minutes), then the app acts. Modern large language models do several of these steps at once.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="40" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="61" font-size="14" font-weight="800" text-anchor="middle" fill="#231F20">"Set a timer for ten minutes"</text><rect x="20" y="90" width="400" height="32" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="111" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">SPEECH → TEXT</text><text x="150" y="111" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">set a timer for ten minutes</text><rect x="20" y="130" width="400" height="32" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="32" y="151" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">TOKENS</text><text x="150" y="151" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">set · a · timer · for · ten · minutes</text><rect x="20" y="170" width="400" height="32" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="32" y="191" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">INTENT</text><text x="150" y="191" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">start a timer</text><rect x="20" y="210" width="400" height="32" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="32" y="231" font-size="10" font-weight="800" text-anchor="start" fill="#231F20">DETAILS</text><text x="150" y="231" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">length = 10 minutes</text><text x="220" y="268" font-size="11" font-weight="700" text-anchor="middle" fill="#A7350B">Large language models now do several steps in one go.</text></g></svg>