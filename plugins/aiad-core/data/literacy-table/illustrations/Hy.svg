<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Many tools, one process</title><desc id="d">Hyperautomation looks at a whole process, such as a school trip, and hands each step to the best tool: a form and a trigger for sign-up, document AI for consent forms, a rules engine for payment reminders, a bot to update the register. People keep the decisions that need judgement.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">A SCHOOL TRIP, STEP BY STEP</text><rect x="20" y="38" width="210" height="30" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="58" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">sign-up form</text><line x1="232" y1="53" x2="256" y2="53" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="258" y="38" width="162" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="339" y="58" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">trigger</text><rect x="20" y="74" width="210" height="30" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="94" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">consent forms read</text><line x1="232" y1="89" x2="256" y2="89" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="258" y="74" width="162" height="30" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="339" y="94" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">document AI</text><rect x="20" y="110" width="210" height="30" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="130" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">payment reminders</text><line x1="232" y1="125" x2="256" y2="125" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="258" y="110" width="162" height="30" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="339" y="130" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">rules engine</text><rect x="20" y="146" width="210" height="30" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="166" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">register updated</text><line x1="232" y1="161" x2="256" y2="161" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="258" y="146" width="162" height="30" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="339" y="166" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">bot (RPA)</text><rect x="20" y="182" width="210" height="30" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="202" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">who can go if full?</text><line x1="232" y1="197" x2="256" y2="197" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="258" y="182" width="162" height="30" fill="#63DF93" stroke="#231F20" stroke-width="1.5"/><text x="339" y="202" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">a person decides</text><rect x="20" y="228" width="400" height="50" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Each step gets the right tool, not one tool for everything.</text><text x="220" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">People keep the judgement calls.</text></g></svg>