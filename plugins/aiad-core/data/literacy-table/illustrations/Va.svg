<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">From "Hey…" to a reminder</title><desc id="d">A virtual assistant listens for its wake word on the device, then sends what you say to be turned into text. It works out the intent (set a reminder) and the details (6pm, PE kit), carries out the action through an app, and answers out loud.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="36" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="59" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">"Hey, remind me to pack my PE kit at 6pm"</text><rect x="20.0" y="84" width="92.5" height="66" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="66.2" y="102" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">WAKE WORD</text><text x="66.2" y="120" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">heard on</text><text x="66.2" y="133" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">the device</text><line x1="113.5" y1="117.0" x2="121.5" y2="117.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="122.5" y="84" width="92.5" height="66" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="168.8" y="102" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">SPEECH → TEXT</text><text x="168.8" y="120" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">what you said</text><line x1="216.0" y1="117.0" x2="224.0" y2="117.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="225.0" y="84" width="92.5" height="66" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="271.2" y="102" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">INTENT</text><text x="271.2" y="120" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">reminder, 6pm,</text><text x="271.2" y="133" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">PE kit</text><line x1="318.5" y1="117.0" x2="326.5" y2="117.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="327.5" y="84" width="92.5" height="66" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="373.8" y="102" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">ACT + REPLY</text><text x="373.8" y="120" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">"Done. 6pm."</text><rect x="20" y="166" width="400" height="112" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="190" font-size="11.5" font-weight="800" text-anchor="start" fill="#A7350B">Virtual assistant</text><text x="156" y="190" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">does tasks for you: reminders, music, searches</text><text x="32" y="220" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">Chatbot</text><text x="156" y="220" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">mainly conversation</text><text x="32" y="250" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">Copilot</text><text x="156" y="250" font-size="11" font-weight="400" text-anchor="start" fill="#5f5a52">built into one app, suggests as you work</text></g></svg>