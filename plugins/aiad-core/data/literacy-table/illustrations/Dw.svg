<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">What is inside a "digital worker"</title><desc id="d">A seller may present a "digital worker" with a name and a face, as if it were a member of staff. Inside it is software: bots that follow set steps, an AI model, some rules and the logins it has been given. It cannot take responsibility, so a named person must own what it does.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="170" height="170" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="105" y="56" font-size="10" font-weight="800" text-anchor="middle" fill="#6441B8">THE SALES PAGE</text><circle cx="105" cy="100" r="26" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><circle cx="96" cy="96" r="3" fill="#231F20"/><circle cx="114" cy="96" r="3" fill="#231F20"/><path d="M94 108 q11 9 22 0" fill="none" stroke="#231F20" stroke-width="2"/><text x="105" y="148" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">"Meet Ava, your</text><text x="105" y="164" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">new team member"</text><line x1="192" y1="120" x2="222" y2="120" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="224" y="36" width="196" height="170" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="322" y="56" font-size="10" font-weight="800" text-anchor="middle" fill="#231F20">WHAT IS INSIDE</text><rect x="238" y="68" width="168" height="26" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="322" y="86" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">bots: set steps</text><rect x="238" y="101" width="168" height="26" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="322" y="119" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">an AI model</text><rect x="238" y="134" width="168" height="26" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="322" y="152" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">rules</text><rect x="238" y="167" width="168" height="26" fill="#FDE3F9" stroke="#231F20" stroke-width="1.5"/><text x="322" y="185" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">logins it was given</text><rect x="20" y="220" width="400" height="58" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Software, not staff: it can't take responsibility.</text><text x="220" y="258" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">A named person owns its work, access and mistakes.</text></g></svg>