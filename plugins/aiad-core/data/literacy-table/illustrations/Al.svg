<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">One algorithm, different data, different models</title><desc id="d">An algorithm is a list of steps. A learning algorithm's steps are: guess, measure the error, adjust, repeat. Run the same algorithm on photos of cats and it produces a cat detector; run it on photos of rashes and it produces a rash checker. The algorithm is the recipe; the model is what it bakes.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="170" height="150" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="105" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">THE ALGORITHM</text><text x="36" y="82" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">1  guess</text><text x="36" y="106" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">2  measure the error</text><text x="36" y="130" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">3  adjust</text><text x="36" y="154" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">4  repeat</text><text x="105" y="176" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">the recipe</text><line x1="192" y1="110" x2="214" y2="70" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="216" y="40" width="90" height="60" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="261" y="74" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">+ cat photos</text><line x1="308" y1="70" x2="324" y2="70" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="326" y="40" width="94" height="60" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="373" y="66" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">model:</text><text x="373" y="81" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">a cat detector</text><line x1="192" y1="110" x2="214" y2="146" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="216" y="116" width="90" height="60" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="261" y="150" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">+ rash photos</text><line x1="308" y1="146" x2="324" y2="146" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="326" y="116" width="94" height="60" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="373" y="142" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">model:</text><text x="373" y="157" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">a rash checker</text><rect x="20" y="204" width="400" height="72" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="226" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Same recipe, different ingredients, different results.</text><text x="220" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">The algorithm is the method;</text><text x="220" y="258" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">the model is what it produces.</text></g></svg>