<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Rules people write, applied the same way every time</title><desc id="d">A rules engine checks each case against rules people wrote, in order. A book 3 days late: no action. 9 days late: a reminder. 25 days late: a letter home. The same case always gets the same decision, and anyone can read why. To change the decision, people change the rule.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="102" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="56" font-size="10" font-weight="800" text-anchor="start" fill="#006A7D">THE RULES, WRITTEN BY STAFF</text><text x="32" y="78" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">if 21 or more days late</text><text x="300" y="78" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">→ letter home</text><text x="32" y="100" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">if 7 or more days late</text><text x="300" y="100" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">→ send a reminder</text><text x="32" y="122" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">otherwise</text><text x="300" y="122" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">→ no action</text><rect x="20" y="152" width="128" height="60" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="84" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#5f5a52">3 days late</text><text x="84" y="196" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">no action</text><rect x="156" y="152" width="128" height="60" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#5f5a52">9 days late</text><text x="220" y="196" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">reminder</text><rect x="292" y="152" width="128" height="60" fill="#F7C1C1" stroke="#231F20" stroke-width="1.5"/><text x="356" y="174" font-size="11" font-weight="700" text-anchor="middle" fill="#5f5a52">25 days late</text><text x="356" y="196" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">letter home</text><rect x="20" y="224" width="400" height="54" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="246" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Same case, same decision, and you can see why.</text><text x="220" y="262" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">It only knows cases someone thought of.</text></g></svg>