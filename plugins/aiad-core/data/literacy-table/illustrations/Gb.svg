<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Each model learns what is left over</title><desc id="d">Gradient boosting starts with a rough guess for every example, works out how far off each guess is, and trains a small model to predict those leftover errors. Adding its corrections shrinks the error; the next model learns what is left over again. Small steps each round help avoid overfitting.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">TOTAL ERROR AFTER EACH MODEL</text><rect x="40" y="50.0" width="40" height="150.0" fill="#FF7038" stroke="#231F20" stroke-width="1.2"/><text x="60" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">start</text><text x="60" y="44.0" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">100</text><rect x="102" y="117.5" width="40" height="82.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1.2"/><text x="122" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">+1</text><text x="122" y="111.5" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">55</text><rect x="164" y="152.0" width="40" height="48.0" fill="#FFE2D5" stroke="#231F20" stroke-width="1.2"/><text x="184" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">+2</text><text x="184" y="146.0" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">32</text><rect x="226" y="170.0" width="40" height="30.0" fill="#FFE2D5" stroke="#231F20" stroke-width="1.2"/><text x="246" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">+3</text><text x="246" y="164.0" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">20</text><rect x="288" y="180.5" width="40" height="19.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1.2"/><text x="308" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">+4</text><text x="308" y="174.5" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">13</text><rect x="350" y="186.5" width="40" height="13.5" fill="#FFE2D5" stroke="#231F20" stroke-width="1.2"/><text x="370" y="216" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">+5</text><text x="370" y="180.5" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">9</text><line x1="30" y1="200" x2="410" y2="200" stroke="#231F20" stroke-width="1.4"/><text x="220" y="236" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">models added →</text><rect x="20" y="248" width="400" height="34" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220" y="270" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">Each new model is trained only on the errors still left.</text></g></svg>