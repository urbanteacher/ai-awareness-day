<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Everything the model reads, not just your question</title><desc id="d">Context engineering plans everything that goes into the model's context window: rules and role, background documents, worked examples, tool results, the conversation so far, and finally the question. A clever question alone is a small part of it. Too much, or the wrong things, crowds out what matters.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">WHAT FILLS THE CONTEXT WINDOW</text><rect x="20" y="38" width="250" height="44" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="32" y="58" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">rules and role</text><text x="32" y="72" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">mark like a Year 9 science teacher</text><rect x="20" y="82" width="250" height="70" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="32" y="102" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">background documents</text><text x="32" y="116" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">the mark scheme, the topic notes</text><rect x="20" y="152" width="250" height="40" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="32" y="172" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">worked examples</text><text x="32" y="186" font-size="10" font-weight="400" text-anchor="start" fill="#5f5a52">two marked answers</text><rect x="20" y="192" width="250" height="30" fill="#FDE3F9" stroke="#231F20" stroke-width="1.5"/><text x="32" y="211.0" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">tool results and memory</text><rect x="20" y="222" width="250" height="22" fill="#63DF93" stroke="#231F20" stroke-width="1.5"/><text x="32" y="237.0" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">the question</text><path d="M278 38 h8 v206 h-8" fill="none" stroke="#231F20" stroke-width="1.5"/><text x="294" y="110" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">one context</text><text x="294" y="125" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">window,</text><text x="294" y="140" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">with a limit</text><path d="M278 222 h8 v22 h-8" fill="none" stroke="#9b1c14" stroke-width="1.5"/><text x="294" y="230" font-size="10" font-weight="700" text-anchor="start" fill="#9b1c14">your prompt is</text><text x="294" y="242" font-size="10" font-weight="700" text-anchor="start" fill="#9b1c14">only this bit</text><rect x="20" y="254" width="400" height="30" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="274" font-size="11.5" font-weight="700" text-anchor="middle" fill="#231F20">Choose what goes in, and what stays out.</text></g></svg>