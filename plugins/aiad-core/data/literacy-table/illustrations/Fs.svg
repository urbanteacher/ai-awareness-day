<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Examples in the prompt, not new training</title><desc id="d">Few-shot learning puts a handful of worked examples in the prompt: "happy → positive", "awful → negative", "fine → neutral". The model spots the pattern and answers the new one the same way. Nothing in the model changes: the examples only last for that conversation.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="250" height="170" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="56" font-size="10" font-weight="800" text-anchor="start" fill="#5f5a52">THE PROMPT</text><rect x="30" y="64" width="230" height="22" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="40" y="80" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">"I loved it"</text><text x="250" y="80" font-size="11" font-weight="800" text-anchor="end" fill="#6441B8">→ positive</text><rect x="30" y="90" width="230" height="22" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="40" y="106" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">"Total waste of time"</text><text x="250" y="106" font-size="11" font-weight="800" text-anchor="end" fill="#6441B8">→ negative</text><rect x="30" y="116" width="230" height="22" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="40" y="132" font-size="11" font-weight="700" text-anchor="start" fill="#231F20">"It was OK"</text><text x="250" y="132" font-size="11" font-weight="800" text-anchor="end" fill="#6441B8">→ neutral</text><text x="40" y="172" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">"Best trip ever"</text><text x="250" y="172" font-size="11.5" font-weight="800" text-anchor="end" fill="#231F20">→ ?</text><text x="145" y="196" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">three examples, then the new one</text><line x1="272" y1="166" x2="300" y2="166" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="302" y="140" width="118" height="52" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="361" y="162" font-size="13" font-weight="800" text-anchor="middle" fill="#176E3B">positive</text><text x="361" y="180" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">pattern copied</text><text x="304" y="52" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">zero-shot</text><text x="304" y="66" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">no examples</text><text x="304" y="78" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">one-shot</text><text x="304" y="92" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">one example</text><text x="304" y="104" font-size="11" font-weight="800" text-anchor="start" fill="#231F20">few-shot</text><text x="304" y="118" font-size="9.5" font-weight="400" text-anchor="start" fill="#5f5a52">a handful</text><rect x="20" y="220" width="400" height="56" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Nothing inside the model changes:</text><text x="220" y="258" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">the examples only last for this conversation.</text></g></svg>