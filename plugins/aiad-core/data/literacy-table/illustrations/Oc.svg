<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">From pixels to letters</title><desc id="d">OCR finds the lines of text in an image, splits them into characters and recognises each one, with a confidence score. Similar shapes cause mistakes: 0 and O, 1 and l, rn and m. Clean print is read almost perfectly; handwriting, blur and tilted photos are much harder.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="180" height="70" fill="#efece4" stroke="#231F20" stroke-width="1.5"/><g transform="rotate(-3 110 71)"><text x="110" y="80" font-family="Georgia,serif" font-size="24" text-anchor="middle" fill="#3a3633">Room 10l</text></g><text x="110" y="124" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">a photo of a door sign</text><line x1="202" y1="71" x2="234" y2="71" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="236" y="36" width="184" height="70" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="248" y="56" font-size="10" font-weight="800" text-anchor="start" fill="#006A7D">READ AS</text><text x="248" y="86" font-size="18" font-weight="800" text-anchor="start" fill="#231F20">"Room 10l"</text><text x="20" y="152" font-size="10.5" font-weight="800" text-anchor="start" fill="#9b1c14">LOOK-ALIKES THAT TRIP IT UP</text><rect x="20" y="162" width="94" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="67" y="191" font-size="16" font-weight="800" text-anchor="middle" fill="#231F20">0  ·  O</text><rect x="122" y="162" width="94" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="169" y="191" font-size="16" font-weight="800" text-anchor="middle" fill="#231F20">1  ·  l</text><rect x="224" y="162" width="94" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="271" y="191" font-size="16" font-weight="800" text-anchor="middle" fill="#231F20">rn  ·  m</text><rect x="326" y="162" width="94" height="44" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="373" y="191" font-size="16" font-weight="800" text-anchor="middle" fill="#231F20">5  ·  S</text><rect x="20" y="220" width="400" height="58" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Was it "101" or "10l"? Clear print: very accurate.</text><text x="220" y="258" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Handwriting, blur and tilt: check important numbers.</text></g></svg>