<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">From a pile of paper to checked data</title><desc id="d">Intelligent document processing takes in scanned documents, reads the text, works out what each one is (a consent form, an invoice, a letter), pulls out the key details with a confidence score for each, checks them against rules, and sends anything uncertain to a person.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20.0" y="36" width="125.3" height="62" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">READ</text><text x="82.7" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">scan + OCR</text><line x1="146.3" y1="67.0" x2="156.3" y2="67.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="36" width="125.3" height="62" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">SORT</text><text x="220.0" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">consent form?</text><text x="220.0" y="85" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">invoice? letter?</text><line x1="283.7" y1="67.0" x2="293.7" y2="67.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="36" width="125.3" height="62" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="54" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">EXTRACT</text><text x="357.3" y="72" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">the key details</text><rect x="20" y="112" width="400" height="120" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="132" font-size="10" font-weight="800" text-anchor="start" fill="#5f5a52">CONSENT FORM, DETAILS FOUND</text><text x="32" y="152" font-size="11" font-weight="700" text-anchor="start" fill="#5f5a52">Pupil</text><text x="150" y="152" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">Amira Khan</text><text x="300" y="152" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">98% sure</text><text x="32" y="172" font-size="11" font-weight="700" text-anchor="start" fill="#5f5a52">Date of trip</text><text x="150" y="172" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">12 March</text><text x="300" y="172" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">95% sure</text><text x="32" y="192" font-size="11" font-weight="700" text-anchor="start" fill="#5f5a52">Allergies</text><text x="150" y="192" font-size="11.5" font-weight="800" text-anchor="start" fill="#9b1c14">nuts (?)</text><text x="300" y="192" font-size="10.5" font-weight="800" text-anchor="start" fill="#9b1c14">61% sure</text><text x="32" y="212" font-size="11" font-weight="700" text-anchor="start" fill="#5f5a52">Signed</text><text x="150" y="212" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">yes</text><text x="300" y="212" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">97% sure</text><rect x="20" y="242" width="400" height="38" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="266" font-size="11.5" font-weight="800" text-anchor="middle" fill="#231F20">Low confidence (allergies, 61%) → a person checks it</text></g></svg>