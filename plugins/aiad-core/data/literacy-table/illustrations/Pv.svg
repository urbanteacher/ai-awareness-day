<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Where your words go, and what to ask</title><desc id="d">A message travels from you, to the app, to the AI company's servers, and may be stored or used to train future models. At each step there is a privacy question: is only what is needed collected, who can see it, how long is it kept, and is it used for training, with a way to opt out.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="24" font-size="13" font-weight="800" text-anchor="start" fill="#231F20" letter-spacing=".08em">YOUR MESSAGE'S JOURNEY</text><rect x="20" y="44" width="88" height="54" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="64" y="66" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">You</text><text x="64" y="84" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">type a question</text><line x1="110" y1="71" x2="124" y2="71" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="126" y="44" width="88" height="54" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="170" y="66" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">The app</text><text x="170" y="84" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">sends it on</text><line x1="216" y1="71" x2="230" y2="71" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="232" y="44" width="88" height="54" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="276" y="66" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">AI servers</text><text x="276" y="84" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">write a reply</text><line x1="322" y1="71" x2="336" y2="71" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="338" y="44" width="88" height="54" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="382" y="66" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">Storage</text><text x="382" y="84" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">kept for later</text><line x1="64" y1="100" x2="64" y2="118" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="20" y="120" width="88" height="118" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="64" y="136" font-size="16" font-weight="800" text-anchor="middle" fill="#BE123C">?</text><text x="64" y="156" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">Only what's</text><text x="64" y="171" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">needed?</text><text x="64" y="190" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">Leave out names,</text><text x="64" y="203" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">addresses,</text><text x="64" y="216" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">health.</text><line x1="170" y1="100" x2="170" y2="118" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="126" y="120" width="88" height="118" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="170" y="136" font-size="16" font-weight="800" text-anchor="middle" fill="#BE123C">?</text><text x="170" y="156" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">Who can see</text><text x="170" y="171" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">it?</text><text x="170" y="190" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">The company, its</text><text x="170" y="203" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">staff, partners?</text><line x1="276" y1="100" x2="276" y2="118" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="232" y="120" width="88" height="118" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="276" y="136" font-size="16" font-weight="800" text-anchor="middle" fill="#BE123C">?</text><text x="276" y="156" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">How long is</text><text x="276" y="171" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">it kept?</text><text x="276" y="190" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">Days, years,</text><text x="276" y="203" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">until you delete</text><text x="276" y="216" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">it?</text><line x1="382" y1="100" x2="382" y2="118" stroke="#231F20" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="338" y="120" width="88" height="118" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="382" y="136" font-size="16" font-weight="800" text-anchor="middle" fill="#BE123C">?</text><text x="382" y="156" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">Used for</text><text x="382" y="171" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">training?</text><text x="382" y="190" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">Is there a way</text><text x="382" y="203" font-size="9.5" font-weight="400" text-anchor="middle" fill="#5f5a52">to opt out?</text><text x="220" y="266" font-size="11" font-weight="700" text-anchor="middle" fill="#006A7D">UK GDPR: collect what's needed, keep it safe,</text><text x="220" y="281" font-size="11" font-weight="700" text-anchor="middle" fill="#006A7D">keep it no longer than necessary, explain how it's used.</text></g></svg>