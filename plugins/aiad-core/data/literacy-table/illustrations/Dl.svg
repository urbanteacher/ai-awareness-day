<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Many layers that find their own features</title><desc id="d">Older machine learning needed people to pick the features, such as "has whiskers". Deep learning feeds in raw data, like pixels, and passes it through many layers; each layer learns its own features, simple ones first, then complex ones. It needs lots of data and computing, and it powered the jumps in images (2012), the transformer (2017) and chatbots (2022).</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><text x="20" y="30" font-size="10.5" font-weight="800" text-anchor="start" fill="#5f5a52">OLDER MACHINE LEARNING</text><rect x="20.0" y="38" width="125.3" height="50" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="82.7" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PHOTO</text><text x="82.7" y="74" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">raw pixels</text><line x1="146.3" y1="63.0" x2="156.3" y2="63.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="157.3" y="38" width="125.3" height="50" fill="#FFE2D5" stroke="#231F20" stroke-width="1.5"/><text x="220.0" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">PEOPLE PICK FEATURES</text><text x="220.0" y="74" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">whiskers? ears?</text><line x1="283.7" y1="63.0" x2="293.7" y2="63.0" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="294.7" y="38" width="125.3" height="50" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="357.3" y="56" font-size="10.5" font-weight="800" text-anchor="middle" fill="#231F20">SMALL MODEL</text><text x="357.3" y="74" font-size="10" font-weight="400" text-anchor="middle" fill="#5f5a52">cat or dog</text><text x="20" y="112" font-size="10.5" font-weight="800" text-anchor="start" fill="#6441B8">DEEP LEARNING</text><rect x="20" y="120" width="80" height="64" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="60" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">raw</text><text x="60" y="162" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">pixels</text><rect x="116" y="124" width="24" height="56" fill="#AC91FF" stroke="#231F20" stroke-width="1"/><rect x="150" y="124" width="24" height="56" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><rect x="184" y="124" width="24" height="56" fill="#AC91FF" stroke="#231F20" stroke-width="1"/><rect x="218" y="124" width="24" height="56" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><rect x="252" y="124" width="24" height="56" fill="#AC91FF" stroke="#231F20" stroke-width="1"/><rect x="286" y="124" width="24" height="56" fill="#ECE5FF" stroke="#231F20" stroke-width="1"/><line x1="102" y1="152" x2="114" y2="152" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><line x1="322" y1="152" x2="338" y2="152" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="218" y="196" font-size="10" font-weight="700" text-anchor="middle" fill="#6441B8">many layers learn their own features</text><rect x="340" y="120" width="80" height="64" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="380" y="156" font-size="13" font-weight="800" text-anchor="middle" fill="#231F20">cat</text><rect x="20" y="214" width="128" height="40" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="84" y="232" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">2012</text><text x="84" y="247" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">images</text><rect x="156" y="214" width="128" height="40" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="220" y="232" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">2017</text><text x="220" y="247" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">transformer</text><rect x="292" y="214" width="128" height="40" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="356" y="232" font-size="12" font-weight="800" text-anchor="middle" fill="#231F20">2022</text><text x="356" y="247" font-size="10" font-weight="700" text-anchor="middle" fill="#5f5a52">chatbots</text><text x="220" y="276" font-size="11" font-weight="700" text-anchor="middle" fill="#A7350B">Needs lots of data and computing power.</text></g></svg>