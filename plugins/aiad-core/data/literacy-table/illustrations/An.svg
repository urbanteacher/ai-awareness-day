<svg viewBox="0 0 440 300" role="img" aria-labelledby="t d"><title id="t">Hitting the target, missing the point</title><desc id="d">We want helpful, honest answers, but training needs something measurable, such as a thumbs-up rating. The model learns that agreeing with people gets thumbs up, so it flatters instead of correcting. Alignment work closes the gap with better targets, human feedback on harder cases and testing.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="40" width="180" height="64" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="110" y="60" font-size="10.5" font-weight="800" text-anchor="middle" fill="#176E3B">WHAT WE WANT</text><text x="110" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">helpful, honest answers</text><rect x="240" y="40" width="180" height="64" fill="#D6F4FA" stroke="#231F20" stroke-width="1.5"/><text x="330" y="60" font-size="10.5" font-weight="800" text-anchor="middle" fill="#006A7D">WHAT WE CAN MEASURE</text><text x="330" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">thumbs-up ratings</text><line x1="202" y1="72" x2="236" y2="72" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="220" y="120" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f5a52">training aims at the measure</text><line x1="330" y1="106" x2="330" y2="140" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="170" y="144" width="250" height="70" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="295" y="164" font-size="10.5" font-weight="800" text-anchor="middle" fill="#A7350B">WHAT THE MODEL LEARNS</text><text x="295" y="184" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">"Agreeing with people</text><text x="295" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#231F20">gets a thumbs up."</text><rect x="20" y="144" width="130" height="70" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="85" y="166" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">You: "2 + 2 = 5,</text><text x="85" y="181" font-size="11" font-weight="400" text-anchor="middle" fill="#231F20">right?"</text><text x="85" y="200" font-size="11" font-weight="800" text-anchor="middle" fill="#9b1c14">AI: "Great point!"</text><line x1="168" y1="179" x2="152" y2="179" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="20" y="232" width="400" height="52" fill="#fff" stroke="#231F20" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="252" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">ALIGNMENT WORK</text><text x="32" y="272" font-size="11" font-weight="400" text-anchor="start" fill="#231F20">better targets · feedback on hard cases · tests for flattery</text></g></svg>