<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">Useful extra data, with a catch</title><desc id="d">When real examples are rare, such as photos of a rare skin condition, a generator can make more, so a model sees enough to learn. But if models are trained on generated data generation after generation, the rare cases fade and the output drifts from reality: "model collapse". Real data has to stay in the mix.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="20" y="36" width="400" height="84" fill="#DDF8E7" stroke="#231F20" stroke-width="1.5"/><text x="32" y="56" font-size="10.5" font-weight="800" text-anchor="start" fill="#176E3B">THE USE</text><text x="32" y="78" font-size="11.5" font-weight="700" text-anchor="start" fill="#231F20">50 real photos of a rare condition</text><line x1="262" y1="74" x2="290" y2="74" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="296" y="78" font-size="11.5" font-weight="800" text-anchor="start" fill="#231F20">+ 950 generated</text><text x="32" y="102" font-size="10.5" font-weight="400" text-anchor="start" fill="#5f5a52">enough to train on, with no extra patient photos needed</text><rect x="20" y="130" width="400" height="148" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="32" y="150" font-size="10.5" font-weight="800" text-anchor="start" fill="#9b1c14">THE CATCH: TRAINED ON ITS OWN OUTPUT, AGAIN AND AGAIN</text><polyline points="40,235.7 41,235.6 42,235.5 43,235.4 44,235.3 45,235.1 46,235.0 47,234.8 48,234.5 49,234.3 50,233.9 51,233.6 52,233.2 53,232.7 54,232.2 55,231.5 56,230.9 57,230.1 58,229.2 59,228.3 60,227.3 61,226.1 62,224.9 63,223.6 64,222.1 65,220.6 66,219.0 67,217.2 68,215.4 69,213.5 70,211.5 71,209.4 72,207.3 73,205.2 74,203.0 75,200.8 76,198.6 77,196.5 78,194.4 79,192.4 80,190.5 81,188.6 82,186.9 8