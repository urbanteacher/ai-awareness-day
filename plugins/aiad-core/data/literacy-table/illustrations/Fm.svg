<svg viewBox="0 0 440 290" role="img" aria-labelledby="t d"><title id="t">One big model, many jobs</title><desc id="d">A foundation model is trained once, at great cost, on broad data such as text, code and images. Many different tools are then built on it, by prompting or fine-tuning: a homework helper, a coding assistant, a translator, a medical note writer. Its strengths, and its flaws and biases, pass into all of them.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#231F20"/></marker></defs><g font-family="'AIAD Sans',Arial,sans-serif"><rect x="120" y="150" width="200" height="60" fill="#D6F4FA" stroke="#231F20" stroke-width="2.5"/><text x="220" y="172" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">FOUNDATION MODEL</text><text x="220" y="190" font-size="11" font-weight="800" text-anchor="middle" fill="#231F20">trained once on broad data</text><rect x="20" y="50" width="92" height="44" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="66" y="70" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">homework</text><text x="66" y="83" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">helper</text><line x1="220" y1="148" x2="66" y2="96" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="126" y="50" width="92" height="44" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="172" y="70" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">coding</text><text x="172" y="83" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">assistant</text><line x1="220" y1="148" x2="172" y2="96" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="232" y="50" width="92" height="44" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="278" y="70" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">translator</text><line x1="220" y1="148" x2="278" y2="96" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><rect x="330" y="50" width="90" height="44" fill="#ECE5FF" stroke="#231F20" stroke-width="1.5"/><text x="376" y="70" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">medical</text><text x="376" y="83" font-size="10.5" font-weight="700" text-anchor="middle" fill="#231F20">notes</text><line x1="220" y1="148" x2="376" y2="96" stroke="#231F20" stroke-width="1.8" marker-end="url(#ar)"/><text x="220" y="36" font-size="10" font-weight="800" text-anchor="middle" fill="#6441B8">BUILT ON IT, BY PROMPTING OR FINE-TUNING</text><rect x="20" y="226" width="400" height="54" fill="#FFF3C4" stroke="#231F20" stroke-width="1.5"/><text x="220" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">Strengths are shared, and so are flaws:</text><text x="220" y="264" font-size="11" font-weight="700" text-anchor="middle" fill="#231F20">a bias in the base can show up in every tool.</text></g></svg>