  <rect class="i-bg" width="300" height="330"/>
  <g class="alpt-arrows"><path class="i-line" d="M200 108 C223.1 108 242 131.4 242 160 L242 176" marker-end="url(#alpt-arr-lp)"/><path class="i-line" d="M260 224 C260 261.4 250 292 216 292 L200 292" marker-end="url(#alpt-arr-lp)"/><path class="i-line" d="M100 292 C90.8 292 83.2 268.6 83.2 240 L83.2 224" marker-end="url(#alpt-arr-lp)"/><path class="i-line" d="M40 176 C40 138.6 50 108 84 108 L100 108" marker-end="url(#alpt-arr-lp)"/><path class="i-line" d="M32.8 224 L32.8 264" marker-end="url(#alpt-arr-lp)"/></g>
  <rect class="i-paper" x="108" y="92" width="84" height="32" rx="16"/><rect class="i-line" x="108" y="92" width="84" height="32" rx="16"/>
  <text class="t-s" x="150" y="114" text-anchor="middle">Observe</text>
  <rect class="i-paper" x="200" y="184" width="84" height="32" rx="16"/><rect class="i-line" x="200" y="184" width="84" height="32" rx="16"/>
  <text class="t-s" x="242" y="206" text-anchor="middle">Think</text>
  <rect class="i-deep" x="108" y="276" width="84" height="32" rx="16"/>
  <text class="t-s t-w" x="150" y="298" text-anchor="middle">Act</text>
  <rect class="i-paper" x="16" y="184" width="84" height="32" rx="16"/><rect class="i-line" x="16" y="184" width="84" height="32" rx="16"/>
  <text class="t-s" x="58" y="206" text-anchor="middle">Check</text>
  <path class="i-deep" d="M128 180 H162 L174 192 V222 H128 Z"/>
  <rect class="i-paper" x="135" y="189" width="30" height="20" rx="4"/>
  <circle class="i-ink" cx="145" cy="199" r="3"/><circle class="i-ink" cx="155" cy="199" r="3"/>
  <rect class="i-accent" x="8" y="272" width="64" height="32" rx="16"/>
