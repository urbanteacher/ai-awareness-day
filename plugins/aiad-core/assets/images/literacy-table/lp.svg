<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Agent Loop: observe, think, act, check, and round again until the goal is met. Top-left 80x80 stays clear for the symbol badge. -->
