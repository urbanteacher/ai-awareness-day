<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Anomaly Detection: a list of small card payments with one huge 3am payment flagged as unusual. Top-left stays clear for the symbol badge. -->
  <rect class="i-bg" width="300" height="330"/>
  <text class="t-s" x="180" y="46" text-anchor="middle">Card payments</text>
  <rect class="i-paper" x="34" y="92" width="232" height="226" rx="16"/><rect class="i-line" x="34" y="92" width="232" height="226" rx="16"/>
  <path class="i-line" d="M50 150 H250 M50 196 H250 M50 260 H250" stroke-opacity=".3"/>
  <circle class="i-cream" cx="66" cy="126" r="11"/><circle class="i-line" cx="66" cy="126" r="11"/>
  <path class="i-line" d="M86 126 H150" stroke-opacity=".35"/><text class="t-s" x="246" y="132" text-anchor="end">£4</text>
  <circle class="i-cream" cx="66" cy="173" r="11"/><circle class="i-line" cx="66" cy="173" r="11"/>
  <path class="i-line" d="M86 173 H140" stroke-opacity=".35"/><text class="t-s" x="246" y="179" text-anchor="end">£2</text>
  <rect class="i-deep" x="44" y="204" width="212" height="48" rx="8"/>
  <text class="t-m t-w" x="58" y="236">£950</text>
  <text class="t-xs t-w" x="246" y="234" text-anchor="end">abroad, 3am</text>
  <circle class="i-cream" cx="66" cy="288" r="11"/><circle class="i-line" cx="66" cy="288" r="11"/>
  <path class="i-line" d="M86 288 H156" stroke-opacity=".35"/><text class="t-s" x="246" y="294" text-anchor="end">£3</text>
  <g transform="rotate(-6 175 258)">
    <rect class="i-accent" x="120" y="243" width="110" height="30" rx="4"/><rect class="i-line" x="120" y="243" width="110" height="30" rx="4"/>
    <text class="t-s" x="175" y="264" text-anchor="middle" letter-spacing="1">UNUSUAL!</text>
  </g>
</svg>
