<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Feature Engineering: raw facts about a reader are turned into useful inputs, and an unhelpful one is left out. -->
  <defs><marker id="alpt-arr-fe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="i-head" d="M1 1 9 5 1 9"/></marker><marker id="alpt-x-fe" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="i-head" d="M2.5 2.5 7.5 7.5 M7.5 2.5 2.5 7.5"/></marker></defs>
  <rect class="i-bg" width="300" height="330"/>
  <text class="t-s" x="84" y="104" text-anchor="middle">Raw data</text>
  <text class="t-s t-d" x="235" y="104" text-anchor="middle">Features</text>
  <rect class="i-paper" x="18" y="118" width="132" height="52" rx="6"/><rect class="i-line" x="18" y="118" width="132" height="52" rx="6"/>
  <text class="t-s" x="84" y="149" text-anchor="middle">Born 2012</text>
  <g class="alpt-arrows"><path class="i-line" d="M158 144 L180 144" marker-end="url(#alpt-arr-fe)"/><path class="i-line" d="M158 210 L180 210" marker-end="url(#alpt-arr-fe)"/><path class="i-line i-dash" d="M158 276 L180 276" marker-end="url(#alpt-x-fe)"/></g>
  <rect class="i-deep" x="188" y="118" width="94" height="52" rx="6"/>
  <text class="t-m t-w" x="235" y="152" text-anchor="middle">Age 14</text>
  <rect class="i-paper" x="18" y="184" width="132" height="52" rx="6"/><rect class="i-line" x="18" y="184" width="132" height="52" rx="6"/>
  <text class="t-s" x="84" y="206" text-anchor="middle">36 books</text>
  <text class="t-s" x="84" y="226" text-anchor="middle">in 3 years</text>
  <rect class="i-deep" x="188" y="184" width="94" height="52" rx="6"/>
  <text class="t-s t-w" x="235" y="206" text-anchor="middle">12 books</text>
  <text class="t-s t-w" x="235" y="226" text-anchor="middle">a year</text>
  <rect class="i-paper" x="18" y="250" width="132" height="52" rx="6"/><rect class="i-line" x="18" y="250" width="132" height="52" rx="6"/>
  <text class="t-s" x="84" y="281" text-anchor="middle">Name: Sam</text>
  <path class="i-line" d="M34 276 H134" stroke-width="3"/>
  <rect class="i-line i-dash" x="188" y="250" width="94" height="52" rx="6"/>
  <text class="t-xs" x="235" y="281" text-anchor="middle">left out</text>
</svg>
