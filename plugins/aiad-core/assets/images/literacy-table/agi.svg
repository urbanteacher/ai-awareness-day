  <text class="t-s" x="219" y="108" text-anchor="middle">General AI?</text>
  <g transform="translate(196 118) scale(0.8)"><path class="i-deep" d="M0 0 H44 L58 14 V52 H0 Z"/><rect class="i-paper" x="12" y="16" width="32" height="22" rx="5"/><circle class="i-ink" cx="22" cy="27" r="3.5"/><circle class="i-ink" cx="34" cy="27" r="3.5"/></g>
  <rect class="i-paper" x="156" y="170" width="36" height="36" rx="5"/><rect class="i-deepline" x="156" y="170" width="36" height="36" rx="5" style="stroke-width:4"/><text class="t-m" x="174" y="196" text-anchor="middle">+</text>
