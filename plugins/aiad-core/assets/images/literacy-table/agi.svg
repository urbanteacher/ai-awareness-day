<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Artificial General Intelligence: a narrow AI can do just one of six tasks, while a hypothetical general AI, drawn dashed, can do almost all of them. -->
