  <rect class="i-paper" x="19" y="212" width="36" height="36" rx="5"/><rect class="i-deepline" x="19" y="212" width="36" height="36" rx="5" style="stroke-width:4"/><rect class="i-line" x="28" y="221" width="18" height="18" style="stroke-width:2"/><rect class="i-ink" x="28" y="221" width="9" height="9"/><rect class="i-ink" x="37" y="230" width="9" height="9"/>
  <rect class="i-paper" x="61" y="212" width="36" height="36" rx="5"/><rect class="i-line" x="61" y="212" width="36" height="36" rx="5"/><g class="i-faint"><path class="i-line" d="M70 223 H88 M70 230 H88 M70 237 H82" style="stroke-width:2"/></g>
