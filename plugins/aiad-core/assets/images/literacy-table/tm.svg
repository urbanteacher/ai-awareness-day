  <path class="i-line" d="M155 104 V280" stroke-dasharray="3 5" stroke-opacity=".4"/>
  <path class="i-line" d="M30 248 L282 168" stroke-dasharray="4 5"/>
  <path class="i-deepline" stroke-width="5" d="M30 262 C62 262 70 178 92 178 C114 178 124 238 155 238 C186 238 195 126 217 126 C239 126 250 212 282 212"/>
  <circle class="i-accent" cx="92" cy="178" r="7"/><circle class="i-accent" cx="217" cy="126" r="7"/>
