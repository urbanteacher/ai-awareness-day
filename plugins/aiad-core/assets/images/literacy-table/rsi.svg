  <rect class="i-bg" width="300" height="330"/>
  <path class="i-line" d="M16 268 H98 V222 H172 V164 H284"/>
  <g transform="translate(30 232) scale(0.7)"><path class="i-deep" d="M0 0 H44 L58 14 V52 H0 Z"/><rect class="i-paper" x="12" y="16" width="32" height="22" rx="5"/><circle class="i-ink" cx="22" cy="27" r="3.5"/><circle class="i-ink" cx="34" cy="27" r="3.5"/></g>
  <g transform="translate(108 170) scale(1)"><path class="i-deep" d="M0 0 H44 L58 14 V52 H0 Z"/><rect class="i-paper" x="12" y="16" width="32" height="22" rx="5"/><circle class="i-ink" cx="22" cy="27" r="3.5"/><circle class="i-ink" cx="34" cy="27" r="3.5"/></g>
  <g transform="translate(178 94) scale(1.3)"><path class="i-deep" d="M0 0 H44 L58 14 V52 H0 Z"/><rect class="i-paper" x="12" y="16" width="32" height="22" rx="5"/><circle class="i-ink" cx="22" cy="27" r="3.5"/><circle class="i-ink" cx="34" cy="27" r="3.5"/></g>
  <text class="t-s" x="50" y="292" text-anchor="middle">v1</text><text class="t-s" x="137" y="246" text-anchor="middle">v2</text><text class="t-s" x="216" y="190" text-anchor="middle">v3</text>
  <g class="alpt-arrows"><path class="i-line" d="M40 224 C40 208.6 59.8 196 84 196 L100 196" marker-end="url(#alpt-arr-rsi)"/><path class="i-line i-main" d="M118 162 C118 143.3 134.2 128 154 128 L170 128" marker-end="url(#alpt-arr-rsi-d)"/></g>
