  <path class="i-line" d="M230 262 C230 240 274 240 274 262"/>
  <rect class="i-accent" x="104" y="276" width="124" height="36" rx="12"/><path class="i-accent" d="M206 278 L236 262 L222 278 Z"/>
  <path class="i-line" d="M222 276 L236 262 L206 276 M116 276 H206 M222 276 H216 A12 12 0 0 1 228 288 V300 A12 12 0 0 1 216 312 H116 A12 12 0 0 1 104 300 V288 A12 12 0 0 1 116 276"/>
  <text class="t-s" x="166" y="299" text-anchor="middle">Who checks?</text>
</svg>
