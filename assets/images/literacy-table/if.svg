  <path class="i-line" d="M184 130 H202" marker-end="url(#alpt-arr-if)"/>
  <rect class="i-paper" x="208" y="104" width="76" height="52" rx="12"/><rect class="i-line" x="208" y="104" width="76" height="52" rx="12"/><text class="t-s" x="246" y="127" text-anchor="middle">Bird</text><text class="t-xs t-d" x="246" y="146" text-anchor="middle">92%</text>
  <path class="i-accent" d="M88 104 L70 134 H84 L78 160 L100 126 H86 Z"/><path class="i-line" d="M88 104 L70 134 H84 L78 160 L100 126 H86 Z" style="stroke-width:2"/>
