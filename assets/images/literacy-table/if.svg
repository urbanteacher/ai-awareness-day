  <rect class="i-bg" width="300" height="330"/>
  <rect class="i-paper" x="120" y="20" width="60" height="52" rx="4"/><rect class="i-line" x="120" y="20" width="60" height="52" rx="4"/>
  <ellipse class="i-deep" cx="146" cy="50" rx="16" ry="10"/><circle class="i-deep" cx="162" cy="38" r="7"/><path class="i-ink" d="M168 36 L176 39 L168 42 Z"/><path class="i-line" d="M140 60 V66 M150 60 V66" style="stroke-width:2"/>
