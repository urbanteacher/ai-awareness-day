  <rect class="i-cream" x="220" y="226" width="28" height="64" rx="3"/><rect class="i-line" x="220" y="226" width="28" height="64" rx="3"/><rect class="i-paper" x="252" y="98" width="28" height="192" rx="3"/><rect class="i-deepline i-dash" x="252" y="98" width="28" height="192" rx="3"/><text class="t-m t-d" x="266" y="186" text-anchor="middle">?</text><text class="t-s" x="250" y="314" text-anchor="middle">Art</text>
