<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Webhook: the moment a payment is made in the shop app, it sends a message to the delivery app, which starts packing. -->
  <rect class="i-bg" width="300" height="330"/>
  <text class="t-xs" x="232" y="72" text-anchor="middle">Shop app</text>
  <rect class="i-paper" x="196" y="82" width="72" height="116" rx="12"/><rect class="i-line" x="196" y="82" width="72" height="116" rx="12"/>
  <path class="i-line" d="M222 92 H242"/>
  <rect class="i-deep" x="204" y="124" width="56" height="30" rx="15"/>
  <text class="t-xs t-w" x="232" y="144" text-anchor="middle">Paid ✓</text>
  <circle class="i-deepline" cx="232" cy="139" r="34" stroke-opacity=".4"/>
  <path class="i-line i-dash" d="M190 150 C150 140 120 170 100 218"/>
  <path class="i-line" d="M176 120 L190 116 M178 134 L194 132"/>
  <g transform="rotate(-24 140 148)">
    <rect class="i-accent" x="116" y="132" width="48" height="32" rx="3"/><rect class="i-line" x="116" y="132" width="48" height="32" rx="3"/>
    <path class="i-line" d="M116 134 L140 152 L164 134"/>
  </g>
  <text class="t-s" x="20" y="132">Instantly</text>
  <rect class="i-paper" x="16" y="226" width="200" height="90" rx="8"/><rect class="i-line" x="16" y="226" width="200" height="90" rx="8"/>
  <path class="i-deep" d="M16 234 Q16 226 24 226 H208 Q216 226 216 234 V252 H16 Z"/>
  <text class="t-xs t-w" x="28" y="244">Delivery app</text>
  <path class="i-deep" d="M28 266 H60 L70 276 V302 H28 Z"/>
  <rect class="i-paper" x="34" y="274" width="28" height="16" rx="4"/>
  <circle class="i-ink" cx="43" cy="282" r="2.5"/><circle class="i-ink" cx="53" cy="282" r="2.5"/>
  <text class="t-s" x="84" y="290">Start packing</text>
</svg>
