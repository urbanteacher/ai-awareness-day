<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Prescriptive Analytics: a rain forecast leads to the recommended best plan for sports day. Top-left stays clear for the symbol badge. -->
  <defs><marker id="alpt-arr-ps" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="i-head" d="M1 1 9 5 1 9"/></marker></defs>
  <rect class="i-bg" width="300" height="330"/>
  <rect class="i-paper" x="100" y="22" width="136" height="66" rx="12"/><rect class="i-line" x="100" y="22" width="136" height="66" rx="12"/>
  <path class="i-cream" d="M118 58 a10 10 0 0 1 8 -16 a13 13 0 0 1 24 4 a9 9 0 0 1 2 18 h-30 a8 8 0 0 1 -4 -6 z"/>
  <path class="i-line" d="M118 58 a10 10 0 0 1 8 -16 a13 13 0 0 1 24 4 a9 9 0 0 1 2 18 h-30 a8 8 0 0 1 -4 -6 z"/>
  <path class="i-deepline" d="M126 70 l-3 8 M138 70 l-3 8 M150 70 l-3 8"/>
  <text class="t-s" x="164" y="50">Rain</text>
  <text class="t-s" x="164" y="72">at 2pm</text>
  <g class="alpt-arrows"><path class="i-line" d="M168 96 L168 118" marker-end="url(#alpt-arr-ps)"/></g>
  <g class="i-faint">
    <rect class="i-paper" x="24" y="126" width="252" height="46" rx="10"/><rect class="i-line" x="24" y="126" width="252" height="46" rx="10"/>
    <text class="t-s" x="42" y="155">Go ahead at 2pm</text>
  </g>
  <rect class="i-deep" x="24" y="186" width="252" height="52" rx="10"/>
  <text class="t-s t-w" x="42" y="218">Start at 10am ✓</text>
  <rect class="i-accent" x="194" y="198" width="68" height="28" rx="14"/>
  <text class="t-xs" x="228" y="217" text-anchor="middle" letter-spacing="1">BEST</text>
  <g class="i-faint">
    <rect class="i-paper" x="24" y="252" width="252" height="46" rx="10"/><rect class="i-line" x="24" y="252" width="252" height="46" rx="10"/>
    <text class="t-s" x="42" y="281">Cancel it</text>
  </g>
</svg>
