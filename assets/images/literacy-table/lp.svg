<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Agent Loop: observe, think, act, check, and round again until the goal is met. Top-left 80x80 stays clear for the symbol badge. -->
  <defs><marker id="alpt-arr-lp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="i-bg" width="300" height="330"/>
  <path class="i-line" d="M199 122 A92 92 0 0 1 238 175" marker-end="url(#alpt-arr-lp)"/>
  <path class="i-line" d="M238 225 A92 92 0 0 1 199 278" marker-end="url(#alpt-arr-lp)"/>
  <path class="i-line" d="M101 278 A92 92 0 0 1 62 225" marker-end="url(#alpt-arr-lp)"/>
  <path class="i-line" d="M62 175 A92 92 0 0 1 101 122" marker-end="url(#alpt-arr-lp)"/>
  <rect class="i-paper" x="108" y="92" width="84" height="32" rx="16"/><rect class="i-line" x="108" y="92" width="84" height="32" rx="16"/>
  <text class="t-s" x="150" y="114" text-anchor="middle">Observe</text>
  <rect class="i-paper" x="200" y="184" width="84" height="32" rx="16"/><rect class="i-line" x="200" y="184" width="84" height="32" rx="16"/>
  <text class="t-s" x="242" y="206" text-anchor="middle">Think</text>
  <rect class="i-deep" x="108" y="276" width="84" height="32" rx="16"/>
  <text class="t-s t-w" x="150" y="298" text-anchor="middle">Act</text>
  <rect class="i-paper" x="16" y="184" width="84" height="32" rx="16"/><rect class="i-line" x="16" y="184" width="84" height="32" rx="16"/>
  <text class="t-s" x="58" y="206" text-anchor="middle">Check</text>
  <path class="i-deep" d="M128 180 H162 L174 192 V222 H128 Z"/>
  <rect class="i-paper" x="135" y="189" width="30" height="20" rx="4"/>
  <circle class="i-ink" cx="145" cy="199" r="3"/><circle class="i-ink" cx="155" cy="199" r="3"/>
  <path class="i-line" d="M30 218 V266" marker-end="url(#alpt-arr-lp)"/>
  <rect class="i-accent" x="12" y="272" width="80" height="32" rx="16"/>
  <text class="t-s" x="52" y="294" text-anchor="middle">Done ✓</text>
</svg>
