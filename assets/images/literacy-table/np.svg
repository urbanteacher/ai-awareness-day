<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Natural Language Processing: a spoken request is turned into a task the computer understands. Top-left stays clear for the symbol badge. -->
  <defs><marker id="alpt-arr-np" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="i-head" d="M1 1 9 5 1 9"/></marker><marker id="alpt-arr-np-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="i-head i-head--deep" d="M1 1 9 5 1 9"/></marker></defs>
  <rect class="i-bg" width="300" height="330"/>
  <rect class="i-paper" x="98" y="22" width="150" height="66" rx="14"/><rect class="i-line" x="98" y="22" width="150" height="66" rx="14"/>
  <path class="i-paper" d="M112 84 L84 112 L134 86 Z"/><path class="i-line" d="M112 88 L84 112 L132 88"/>
  <text class="t-s" x="173" y="49" text-anchor="middle">Set a timer for</text>
  <text class="t-s" x="173" y="72" text-anchor="middle">ten minutes</text>
  <rect class="i-accent" x="128" y="76" width="90" height="4" rx="2"/>
  <circle class="i-cream" cx="48" cy="132" r="15"/><circle class="i-line" cx="48" cy="132" r="15"/>
  <path class="i-line" d="M24 172 C24 152 72 152 72 172"/>
  <g class="alpt-arrows"><path class="i-line" d="M174 96 L174 122" marker-end="url(#alpt-arr-np)"/><path class="i-line i-main" d="M174 192 L174 218" marker-end="url(#alpt-arr-np-d)"/></g>
  <path class="i-deep" d="M140 130 H192 L208 146 V184 H140 Z"/>
  <text class="t-m t-w" x="174" y="165" text-anchor="middle">AI</text>
  <rect class="i-paper" x="20" y="226" width="264" height="90" rx="12"/><rect class="i-line" x="20" y="226" width="264" height="90" rx="12"/>
  <rect class="i-deep" x="34" y="242" width="86" height="24" rx="4"/>
  <text class="t-xs t-w" x="77" y="259" text-anchor="middle" letter-spacing="1">TASK</text>
  <text class="t-s" x="132" y="260">start a timer</text>
