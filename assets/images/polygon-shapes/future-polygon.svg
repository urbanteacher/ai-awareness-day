<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Subset of assets/fonts/aiad27, inlined by scripts/embed-brand-font.py
         so this file renders in the brand face on its own. Do not hand-edit:
         change the type above, then re-run the script. */
      @font-face { font-family: 'AIAD Sans'; font-style: normal;
        font-weight: 700 900;
        src: url(data:font/woff2;base64,) format('woff2'); }
    </style>
  </defs>
  <!-- Colour stops 1px inside the ink band rather than running under all of it:
       painted full-tile, it sat beneath the band's bottom-left diagonal and
       leaked through that edge's anti-aliasing as a hairline. -->
  <path d="M0,0 L120,0 L160,40 L160,97 L0,97 Z" fill="#FA83EB"/>
  <path d="M0,96 L160,96 L160,160 L40,160 L0,120 Z" fill="#231F20"/>
  <!-- The strand icon, from assets/brand/aiad27/icon-future.svg, running behind
       both halves of the tile. The colour field is only 96px tall, so an icon
       big enough to read as a background has to cross the band; it is drawn
       twice with one transform, clipped to each half: the strand's deep shade
       (the a27-deep token) over the colour, the strand colour over the ink. Sized to
       150px of its own ink and centred on (108, 84). -->
  <clipPath id="aiad-future-field"><path d="M0,0 L120,0 L160,40 L160,96 L0,96 Z"/></clipPath>
  <clipPath id="aiad-future-band"><path d="M0,96 L160,96 L160,160 L40,160 L0,120 Z"/></clipPath>
  <g clip-path="url(#aiad-future-field)">
    <path opacity="0.3" fill="#983488" transform="translate(6.75 1.50) scale(7.5000)"
          d="M3 21 C3 14 8 12 12 12 C16 12 18 10 18 6 h-3.4 L19.6 1 L24 6 h-3.4 c0 6-4 8-8.6 8 C8.4 14 5.6 15.6 5.4 21 Z"/>
  </g>
  <g clip-path="url(#aiad-future-band)">
    <path opacity="0.16" fill="#FA83EB" transform="translate(6.75 1.50) scale(7.5000)"
          d="M3 21 C3 14 8 12 12 12 C16 12 18 10 18 6 h-3.4 L19.6 1 L24 6 h-3.4 c0 6-4 8-8.6 8 C8.4 14 5.6 15.6 5.4 21 Z"/>
  </g>
  <text x="80" y="50" text-anchor="middle" fill="#231F20" font-family="'AIAD Sans', Arial, sans-serif" font-size="16" font-weight="700">FUTURE</text>
  <!-- The wordmark lockup, scaled into the band, never rebuilt. -->
  <g transform="translate(-24 116) scale(0.58)" fill="#F6F4ED">
    <text x="300" y="24" text-anchor="end" font-family="'AIAD Sans', Arial, Helvetica, sans-serif"
          font-size="20" font-weight="700" letter-spacing="-0.4">AI Awareness Day 2027</text>
    <rect x="260" y="30" width="40" height="2.5"/>
  </g>
</svg>
