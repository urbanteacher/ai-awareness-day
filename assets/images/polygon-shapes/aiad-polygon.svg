<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="AI Awareness Day 2027">
  <defs>
    <style>
      /* Subset of assets/fonts/aiad27, inlined by scripts/embed-brand-font.py
         so this file renders in the brand face on its own. Do not hand-edit:
         change the type above, then re-run the script. */
      @font-face { font-family: 'AIAD Sans'; font-style: normal;
        font-weight: 600;
        src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'AIAD Sans'; font-style: normal;
        font-weight: 700 900;
        src: url(data:font/woff2;base64,) format('woff2'); }
    </style>
  </defs>
  <path d="M0,0 L120,0 L160,40 L160,160 L40,160 L0,120 Z" fill="#231F20"/>
  <!-- The square mark (assets/brand/aiad27/aiad27-mark.svg) at polygon scale:
       160/512 = 0.3125. Its own 512-unit geometry goes in verbatim, so the
       stack stays identical to the favicon; only the tile under it differs,
       the polygon cutting a 40/160 corner where the mark cuts 112/512. -->
  <g transform="scale(0.3125)" fill="#F6F4ED" font-family="'AIAD Sans', Arial, Helvetica, sans-serif">
    <g font-size="70" font-weight="700" letter-spacing="-1.5">
      <text x="44" y="168">AI</text>
      <text x="44" y="242">AWARENESS</text>
      <text x="44" y="316">DAY</text>
    </g>
    <text x="468" y="452" text-anchor="end" font-size="52" font-weight="600" letter-spacing="0.5">2027</text>
  </g>
</svg>
