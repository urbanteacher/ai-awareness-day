<script>
const activities = [
['Ai','Spot the AI','Name three things you used this morning. Which might use AI, and how could you check?','Artificial Intelligence','Check what the tool does and what its maker says about how it works. Automation alone is not proof of AI.'],
['Ml','Teach a sorter','How could a computer learn to sort pictures of winter hats and gloves?','Machine Learning','Train it on labelled examples, then test it on pictures it has never seen.'],
['Tk','Break it into pieces','How many pieces might a language model need to read “snowflake”? Compare guesses.','Token','A tokenizer may treat a word as one piece or several. Different models can split the same word differently.'],
['Mm','Two ways in','Design a tool that needs both a photo and a spoken question. What does each input add?','Multimodal AI','A multimodal system can work across different kinds of input, such as sound and images.'],
['Bi','Who got left out?','A glove detector was trained only on adult-sized gloves. Who should test it next?','Bias','An unrepresentative training set can create systematic differences in how well a model works for different people.'],
['Pr','Ask it clearly','Rewrite “make something festive” so a classmate knows exactly what to create.','Prompt','A prompt can specify the task, audience and constraints. Compare two versions and see which gives clearer direction.'],
['Ha','The missing source','A chatbot recommends a book you can’t find. How would you check whether it exists?','Hallucination','Check a library catalogue or the publisher. A plausible title and author can still be invented.'],
['Cw','What slipped out?','Imagine being able to see only the last page of a long conversation. Which detail would you want repeated?','Context Window','A model can only consider a limited amount of information at once. Restating a key constraint can help.'],
['Sd','Invent a dataset','Invent five fictional bus journeys for testing a timetable app. What real information did you avoid collecting?','Synthetic Data','Artificial examples can support testing. Check that they cover realistic situations.'],
['Rc','Why this song?','Two friends open the same music app and see different winter playlists. Suggest two reasons.','Recommendation Engine','Listening history, skips or other preferences can influence what a system suggests.'],
['Cv','Look twice','A camera mistakes a white scarf for snow. What photos would make a better test?','Computer Vision','Try different lighting, backgrounds and materials to test what the system recognises in images.'],
['Rg','Bring the evidence','A school assistant answers a question about the last day of term. Which document should it consult?','Retrieval-Augmented Generation','Retrieving the current school calendar gives the model evidence to use. Check the answer against the document.'],
['Dk','Check the clip','A surprising video of a famous singer is being shared. What would you verify before passing it on?','Deepfake','Look for the original upload and independent confirmation. Realistic audio or video can be generated or altered.'],
['Ft','Train for one task','A general model needs to classify support tickets. What examples would you give it for further training?','Fine-Tuning','A smaller, task-specific training set can adapt a model to a particular job.'],
['Pl','Plan the class party','Split arranging a class party into three steps. Which step needs someone’s approval?','Planning','An AI system can break a goal into steps. People can set constraints and approve consequential actions.'],
['Gr','Draw the boundary','Design one rule for a classroom chatbot that protects pupils’ personal details. How would you test it?','Guardrails','Rules and checks can limit inputs or outputs. Test the rule using fictional examples.'],
['Cl','Pick a label','Sort six imaginary messages into “question”, “request” and “announcement”. Which one was tricky?','Classification','A classifier assigns items to categories. Some examples are ambiguous even for human reviewers.'],
['Sp','Find the care','Compare a thoughtful seasonal message with a pile of repetitive generated greetings. What makes one worth reading?','AI Slop','The term describes low-effort, mass-produced AI content. Look for relevance, accuracy and care.'],
['Ed','Work offline','Design a winter-walk gadget that recognises a sound without sending the recording anywhere.','Edge AI','Running a model on the device can reduce the need to send data to a remote server.'],
['Ag','Give it a goal','An assistant can organise a trip. What may it research, and when must it ask before acting?','AI Agent','An agent can take steps towards a goal. Give it clear limits, especially before bookings or payments.'],
['Ev','Build a fair test','Write three questions that would test a school chatbot before pupils use it. What counts as a pass?','Evals','Evaluations use tasks and criteria to measure performance. Include a case where the system should admit uncertainty.'],
['Vd','Find a similar idea','How might a search for “cosy winter stories” find a book that never uses those exact words?','Vector Database','It can retrieve similar representations of meaning, helping a system find related material.'],
['Fa','Same chance?','A selection tool makes fewer accurate decisions for one group. What should the school investigate?','Fairness','Compare outcomes and error rates across groups, then investigate the data and decision process.'],
['Hi','Keep a human involved','Choose one decision at school that a person should always review. Explain why.','Human in the Loop','Build in a point where someone can question, change or stop the system’s decision.'],
['★','Make your own element','Choose an AI idea you now understand. Give it a symbol, a plain-English definition and a question for the class.','Your Christmas element','Swap cards with a classmate. Can they explain your idea using a different example?']
];
// The first option is the answer. rotate the display order by door.
const checks = [
['Which is the strongest evidence that a gadget uses AI?','Its documentation describes a trained model','It has a touchscreen','It runs on batteries'],
['How should you test your hat sorter?','Use new photos it has never seen','Repeat the training photos','Count the labels you wrote'],
['Which can be a token?','Part of a word','Only a full sentence','Only a number'],
['Which task uses two types of input?','Answering a spoken question about a photo','Sorting typed names','Counting typed words'],
['What would best test the glove detector for bias?','Compare accuracy across glove sizes','Give it a festive name','Test only its best example'],
['Which prompt gives the clearest direction?','Write a four-line winter poem for seven-year-olds','Do something nice','Make it better'],
['What is the best first check for the book?','Search a library catalogue by title and author','Ask the same chatbot to promise it exists','Trust the detailed cover description'],
['Why might an early instruction disappear?','It fell outside the context window','The model dislikes repetition','Every chat has a five-message limit'],
['Which journey record is synthetic?','A fictional trip created by a simulator','A real ticket with the name removed','A timetable copied from a bus stop'],
['Why might two friends see different playlists?','Their listening histories differ','One phone has a bigger screen','Songs always appear alphabetically'],
['What would make the snow detector test stronger?','Include scarves and snow in varied lighting','Use one clear photo repeatedly','Only test outdoors at noon'],
['What should the assistant retrieve for a term-date question?','The current official school calendar','A timetable from ten years ago','A popular winter poem'],
['A surprising clip looks real. What should you do first?','Check the source and independent reports','Share it before it disappears','Treat a realistic voice as proof'],
['Which example is fine-tuning?','Training an existing model further on labelled tickets','Changing the colour of the app','Writing a single new prompt'],
['Which party-planning step most needs approval?','Spending the class budget','Listing possible themes','Counting days until term ends'],
['How could you safely test a privacy guardrail?','Use made-up pupil details','Upload the real class register','Skip testing if a rule exists'],
['What does a classifier output for a message?','A category such as “question”','A guarantee that it is true','The sender’s next message'],
['Which is the clearest sign of AI slop?','Large amounts of repetitive, low-effort generated content','Any spelling mistake','A message written on a phone'],
['Which example uses edge AI?','A device recognises sounds using its own model','A microphone uploads every sound for remote analysis','A website stores recordings'],
['When should a trip-planning agent pause?','Before paying for tickets','Before listing destinations','Before organising public timetables'],
['Which makes an evaluation more useful?','Define what a good answer looks like before testing','Only use questions the model already passed','Change the pass mark after every answer'],
['What helps a search find differently worded but related stories?','Comparing representations of meaning','Matching only exact titles','Sorting results by file size'],
['What should you compare when checking fairness?','Error rates across relevant groups','Only the overall number of decisions','Only the fastest decisions'],
['What makes human oversight meaningful?','A person can review and stop the decision','A person sees an unchangeable result','A person designed the logo'],

];
const $=id=>document.getElementById(id);
const storageKey='aiad-christmas-25-stars-v1';
let earned={};
try {
 const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
 for(const [id,date] of Object.entries(saved||{})){
  if(/^(?:[1-9]|1[0-9]|2[0-5])$/.test(id)&&typeof date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(date)) earned[id]=date;
 }
} catch {}
function dayKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function updateProgress(){
 const days=new Set(Object.values(earned)), cursor=new Date();let count=0;
 if(!days.has(dayKey(cursor)))cursor.setDate(cursor.getDate()-1);
 while(days.has(dayKey(cursor))){count++;cursor.setDate(cursor.getDate()-1)}
 $('stars').textContent='★ '+Object.keys(earned).length+' / 25 stars';
 $('streak').textContent=count+'-day streak';
 for(const [i,door] of Array.from($('doors').children).entries()){door.classList.toggle('earned',!!earned[i+1]);door.setAttribute('aria-label','Open day '+(i+1)+(earned[i+1]?', star earned':''))}
}
function renderCheck(index){
 const [question,...answers]=checks[index], id=index+1;
 $('check').classList.toggle('complete',!!earned[id]);
 $('reward').textContent=earned[id]?'★ Star collected':'★ Earn a star';
 $('question').textContent=question;$('choices').replaceChildren();
 $('feedback').textContent=earned[id]?'★ Star earned for this door.':'';
 for(let n=0;n<answers.length;n++){
  const option=(n+id)%answers.length, button=document.createElement('button');
  button.type='button';button.textContent=answers[option];button.disabled=!!earned[id];
  if(earned[id]&&option===0)button.className='right';
  button.onclick=()=>{
   if(earned[id])return;
   if(option!==0){$('feedback').textContent='Have another go. The activity above gives you a clue.';return}
   earned[id]=dayKey(new Date());let saved=true;
   try{localStorage.setItem(storageKey,JSON.stringify(earned))}catch{saved=false}
   for(const choice of $('choices').children)choice.disabled=true;
   button.className='right';$('check').classList.add('complete');$('reward').textContent='★ Star collected';updateProgress();
   $('feedback').textContent=saved?'★ Correct! Your star is saved on this device.':'★ Correct! Your star counts for this visit.';
  };
  $('choices').append(button);
 }
 updateProgress();
}
let selected=6;
function showDay(index,focus){
 selected=index;
 $('ornament').hidden=index!==24;$('shareStatus').textContent='';
 if(focus){const url=new URL(location.href);url.searchParams.set('day',index+1);history.replaceState(null,'',url)}
 const [symbol,title,prompt,term,explanation]=activities[index];
 $('quizDay').textContent='Day '+(index+1)+' of 25';
 $('symbol').textContent=symbol;$('day').textContent='Day '+(index+1);$('title').textContent=title;$('prompt').textContent=prompt;
 $('term').textContent=term;$('explanation').textContent=explanation;
 $('table').href='/ai-literacy-periodic-table/'+(index===24?'':'#element-'+symbol.toLowerCase());
 $('table').textContent=index===24?'Explore the periodic table →':'Explore this element in the periodic table →';
 Array.from($('doors').children).forEach((button,i)=>{button.setAttribute('aria-pressed',String(i===index));button.textContent=i+1});
 renderCheck(index);
 if(focus){$('question').focus({preventScroll:true});$('question').scrollIntoView({block:'nearest'})}
}
const sealDays={0:'safe',6:'smart',12:'creative',18:'responsible',24:'future'};
activities.forEach((_,i)=>{const button=document.createElement('button');button.className='door';button.style.setProperty('--piece-x',(i%5)*25+'%');button.style.setProperty('--piece-y',Math.floor(i/5)*25+'%');
 if(sealDays[i]){
  button.classList.add('theme-seal');
  button.style.setProperty('--mark','url("../../brand/aiad27/icon-'+sealDays[i]+'.svg")');
 }
 button.setAttribute('aria-label','Open day '+(i+1));button.onclick=()=>showDay(i,true);$('doors').append(button)});
$('shareDay').onclick=async()=>{
 const url=new URL(location.href);url.searchParams.set('day',selected+1);
 try{await navigator.clipboard.writeText(url.href);$('shareStatus').textContent='Day link copied.'}
 catch{window.prompt('Copy this day’s link:',url.href)}
};
$('ornamentForm').onsubmit=event=>{
 event.preventDefault();
 for(const key of ['Symbol','Term','Definition','Question'])$('paper'+key).textContent=$('card'+key).value;
 document.body.classList.add('print-ornament');window.print();
};
window.addEventListener('afterprint',()=>document.body.classList.remove('print-ornament'));
const linkedDay=Number(new URLSearchParams(location.search).get('day'));
showDay(Number.isInteger(linkedDay)&&linkedDay>=1&&linkedDay<=25?linkedDay-1:6,false);
</script></body></html>
