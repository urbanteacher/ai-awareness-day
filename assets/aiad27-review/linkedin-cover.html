<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .card {
    position: relative;
    width: 1298px;
    height: 732px;
    background: #F6F4ED;
    overflow: hidden;
  }
  /* The lockup is one asset — wordmark, rule and tagline are locked up together
     in aiad27-lockup.svg. Scale it; never rebuild it.

     Its type is right-anchored (text-anchor="end" at x=300), so the visible ink
     sits at x 76.9-300 of the 300x56 viewBox and the left quarter of the box is
     empty. Centring the box would therefore push the type right, so the box is
     oversized and offset instead, to centre the ink rather than its container.
     Offsets are derived from that measured extent: at 1180px of visible type
     the scale is 1180/223.08 = 5.290, giving a 1587px box whose left edge sits
     at 59 - 76.9x5.290 and whose vertical centre lands on y=30.5 of the box. */
  .card img {
    position: absolute;
    display: block;
    width: 1587px;
    height: auto;
    left: -348px;
    top: 205px;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="../brand/aiad27/aiad27-lockup.svg" alt="AI Awareness Day 2027 — Keep Humans in the Loop" />
  </div>
</body>
</html>
