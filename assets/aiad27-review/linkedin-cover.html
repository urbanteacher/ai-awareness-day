<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'AIAD Sans'; src:url('../fonts/aiad27/UncutSans-Regular.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'AIAD Sans'; src:url('../fonts/aiad27/UncutSans-Semibold.woff2') format('woff2'); font-weight:600; font-display:block; }
  @font-face { font-family:'AIAD Sans'; src:url('../fonts/aiad27/UncutSans-Bold.woff2') format('woff2'); font-weight:700 900; font-display:block; }
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1298px;
    height: 732px;
    background: #F6F4ED;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'AIAD Sans', Arial, sans-serif;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 64px;
  }
  .brand img {
    width: 340px;
    height: auto;
    display: block;
  }
  .brand .mark {
    width: 62px;
    height: 62px;
    flex: none;
    background: #231F20;
    -webkit-mask: url('../brand/aiad27/icon-safe.svg') center / contain no-repeat;
    mask: url('../brand/aiad27/icon-safe.svg') center / contain no-repeat;
  }
  .tagline {
    color: #231F20;
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 0.92;
    font-size: 104px;
    text-align: center;
    margin: 0;
  }
  .tagline span { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../brand/aiad27/aiad27-lockup-wordmark.svg" alt="AI Awareness Day 2027" />
      <div class="mark" aria-hidden="true"></div>
    </div>
    <h1 class="tagline">
      <span>Keep Humans in</span>
      <span>the Loop</span>
    </h1>
  </div>
</body>
</html>
