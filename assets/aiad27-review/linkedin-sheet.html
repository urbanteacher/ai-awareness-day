<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  /* LinkedIn's recommended square single-image post: 1200x1200. Six 16:9 cards
     in a 2x3 grid come out wider than tall, so the grid is centred and the
     leftover height reads as margin. Ink ground, not cream — the closing card
     is cream and would lose its edges against a cream sheet. */
  .sheet {
    width: 1200px;
    height: 1200px;
    background: #231F20;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 544x306 keeps both axes whole pixels at 16:9. */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 544px);
    gap: 24px;
  }
  .grid img {
    display: block;
    width: 544px;
    height: 306px;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="grid">
      <img src="linkedin/1-safe.png" alt="Safe — Would you tell an AI your secret?" />
      <img src="linkedin/2-smart.png" alt="Smart — What happens when AI acts for you?" />
      <img src="linkedin/3-creative.png" alt="Creative — Who really made it?" />
      <img src="linkedin/4-responsible.png" alt="Responsible — Should AI decide?" />
      <img src="linkedin/5-future.png" alt="Future — What skills must stay human?" />
      <img src="linkedin/6-lockup.png" alt="AI Awareness Day 2027 — Keep Humans in the Loop" />
    </div>
  </div>
</body>
</html>
