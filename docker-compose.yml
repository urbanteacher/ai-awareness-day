services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress_root
    volumes:
      - db_data:/var/lib/mysql

  # Catches every email the site sends locally. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
      - mailpit
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Debate Network plugin: send mail to Mailpit instead of the internet.
      AIADN_SMTP_HOST: mailpit
      AIADN_SMTP_PORT: "1025"
    volumes:
      # Persist uploads across container restarts
      - wp_uploads:/var/www/html/wp-content/uploads
      # Mount this theme into the container
      - ./:/var/www/html/wp-content/themes/ai-awareness-day
      # Mount bundled plugins
      - ./plugins/ai-risk-readiness-benchmark:/var/www/html/wp-content/plugins/ai-risk-readiness-benchmark
      - ./plugins/aiad-debate-network:/var/www/html/wp-content/plugins/aiad-debate-network
      - ./plugins/aiad-core:/var/www/html/wp-content/plugins/aiad-core

volumes:
  db_data:
  wp_uploads:
