    <title id="ill3HabT">Group-project habits are design patterns</title>
    <desc id="ill3HabD">Four habits from group projects match design patterns in this course: splitting the work up is workflows (Chapter 1) and teams (Chapter 3); checking it is reflection and the evaluator (Chapter 2); taking a vote is self-consistency (Chapter 2); asking whoever is in charge is human-in-the-loop (Chapter 4).</desc>

 x="250" y="186" width="170" height="30" fill="#ddf8e7" stroke="#231F20" stroke-width="1.5"/><text x="260" y="206.0" font-size="12">Human-in-the-loop (Ch. 4)</text><text x="20" y="242" font-size="13" font-weight="700" fill="#b8471a">One agent doing everything uses none of these.</text>

  <figcaption>Each chapter turns one of these habits into a pattern an engineer can build. One agent given the whole quiz night uses none of them.</figcaption>

<figure class="ill">
  <svg viewBox="0 0 440 392" role="img" aria-labelledby="ill3WfT ill3WfD">
    <title id="ill3WfT">Three workflow shapes</title>
    <desc id="ill3WfD">Prompt chaining: write questions, a gate checks them and stops the chain if they fail, then lay out answer sheets. Routing: a new message is sorted first, then a ticket question goes to a small model, a complaint to a bigger model and a refund to a person. Parallelisation: the quiz brief is split into eight rounds written at the same time, then merged into one quiz.</desc>

or="middle">round 2</text><path d="M242.0 318.0L273.7 331.5" stroke="#231F20" stroke-width="1.5"/><path d="M282.0 335.0L275.7 326.9L271.8 336.1z" fill="#231F20"/><path d="M112.0 335.0L141.2 341.9" stroke="#231F20" stroke-width="1.5"/><path d="M150.0 344.0L142.4 337.1L140.1 346.8z" fill="#231F20"/><rect x="152" y="334" width="90" height="20" fill="#ddf8e7" stroke="#231F20" stroke-width="1.5"/><text x="197" y="349" font-size="12" text-anchor="middle">…</text><path d="M242.0 344.0L273.2 337.0" stroke="#231F20" stroke-width="1.5"/><path d="M282.0 335.0L272.1 332.1L274.3 341.9z" fill="#231F20"/><path d="M112.0 335.0L143.4 363.9" stroke="#231F20" stroke-width="1.5"/><path d="M150.0 370.0L146.8 360.2L140.0 367.6z" fill="#231F20"/><rect x="152" y="360" width="90" height="20" fill="#ddf8e7" stroke="#231F20" stroke-width="1.5"/><text x="197" y="375" font-size="12" text-anchor="middle">round 8</text><path d="M242.0 370.0L275.2 340.9" stroke="#231F20" stroke-width="1.5"/><path d="M282.0 335.0L271.9 337.2L278.5 344.7z" fill="#231F20"/><rect x="284" y="318" width="136" height="34" fill="#d9f6fb" stroke="#231F20" stroke-width="1.5"/><text x="352.0" y="331.7" font-size="12" text-anchor="middle">merge into</text><text x="352.0" y="346.7" font-size="12" text-anchor="middle">one quiz</text>

  <figcaption>In all three, people chose the steps before anything ran. The model only does the work inside each box.</figcaption>

<figure class="ill">
  <svg viewBox="0 0 440 308" role="img" aria-labelledby="ill3ChkT ill3ChkD">
    <title id="ill3ChkT">What each check has to go on</title>
    <desc id="ill3ChkD">Reflection: the same model reads its draft and rewrites it, checking against nothing from outside, so it often misses its own errors. Evaluator-optimiser: a separate grader checks the draft against clear criteria, like a mark scheme, which works best when good can be tested. Self-consistency: five answers are counted and the most common kept, which only works if the answers vary.</desc>
    <g font-family="'AIAD Sans',Arial,sans-serif" fill="#231F20">
      <text x="20" y="22" font-size="13" font-weight="800" letter-spacing=".08em">WHAT DOES EACH CHECK HAVE TO GO ON?</text><text x="20" y="50" font-size="14" font-weight="800">Reflection</text><rect x="20" y="60" width="70" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="55.0" y="79" font-size="12" text-anchor="middle">draft</text><path d="M90.0 74.0L99.0 74.0" stroke="#231F20" stroke-width="1.5"/><path d="M108.0 74.0L99.0 69.0L99.0 79.0z" fill="#231F20"/><rect x="110" y="60" width="128" height="28" fill="#ece8de" stroke="#231F20" stroke-width="1.5"/><text x="174.0" y="79" font-size="12" text-anchor="middle">same model</text><path d="M238.0 74.0L247.0 74.0" stroke="#231F20" stroke-width="1.5"/><path d="M256.0 74.0L247.0 69.0L247.0 79.0z" fill="#231F20"/><rect x="258" y="60" width="90" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="303.0" y="79" font-size="12" text-anchor="middle">rewrite</text><text x="20" y="108" font-size="12" font-weight="700">Checks against: nothing from outside</text><text x="420" y="108" font-size="12" font-weight="700" text-anchor="end" fill="#b8471a">often misses its own errors</text><text x="20" y="142" font-size="14" font-weight="800">Evaluator-optimiser</text><rect x="20" y="152" width="70" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="55.0" y="171" font-size="12" text-anchor="middle">draft</text><path d="M90.0 166.0L99.0 166.0" stroke="#231F20" stroke-width="1.5"/><path d="M108.0 166.0L99.0 161.0L99.0 171.0z" fill="#231F20"/><rect x="110" y="152" width="128" height="28" fill="#ece4ff" stroke="#231F20" stroke-width="1.5"/><text x="174.0" y="171" font-size="12" text-anchor="middle">grader + criteria</text><path d="M238.0 166.0L247.0 166.0" stroke="#231F20" stroke-width="1.5"/><path d="M256.0 166.0L247.0 161.0L247.0 171.0z" fill="#231F20"/><rect x="258" y="152" width="90" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="303.0" y="171" font-size="12" text-anchor="middle">pass?</text><text x="20" y="200" font-size="12" font-weight="700">Checks against: a clear mark scheme</text><text x="420" y="200" font-size="12" font-weight="700" text-anchor="end" fill="#1d7a45">best when “good” can be tested</text><text x="20" y="234" font-size="14" font-weight="800">Self-consistency</text><rect x="20" y="244" width="70" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="55.0" y="263" font-size="12" text-anchor="middle">5 answers</text><path d="M90.0 258.0L99.0 258.0" stroke="#231F20" stroke-width="1.5"/><path d="M108.0 258.0L99.0 253.0L99.0 263.0z" fill="#231F20"/><rect x="110" y="244" width="128" height="28" fill="#ffe3d6" stroke="#231F20" stroke-width="1.5"/><text x="174.0" y="263" font-size="12" text-anchor="middle">count them</text><path d="M238.0 258.0L247.0 258.0" stroke="#231F20" stroke-width="1.5"/><path d="M256.0 258.0L247.0 253.0L247.0 263.0z" fill="#231F20"/><rect x="258" y="244" width="162" height="28" fill="#fff" stroke="#231F20" stroke-width="1.5"/><text x="339.0" y="263" font-size="12" text-anchor="middle">keep the most common</text><text x="20" y="292" font-size="12" font-weight="700">Checks against: the other answers</text><text x="420" y="292" font-size="12" font-weight="700" text-anchor="end" fill="#8a5a00">only works if they vary</text>
    </g>
  </svg>
  <figcaption>A check is only as good as what it can compare against. A mark scheme beats the model’s own opinion, and a vote needs answers that differ.</figcaption>
</figure>

weight="800" text-anchor="middle">lead agent</text><path d="M326.0 132.0L269.3 156.4" stroke="#231F20" stroke-width="1.5"/><path d="M261.0 160.0L271.2 161.0L267.3 151.8z" fill="#231F20"/><rect x="232" y="162" width="58" height="26" fill="#d9f6fb" stroke="#231F20" stroke-width="1.5"/><text x="261.0" y="179" font-size="11" text-anchor="middle">researcher</text><path d="M326.0 132.0L328.0 151.1" stroke="#231F20" stroke-width="1.5"/><path d="M329.0 160.0L333.0 150.5L323.1 151.6z" fill="#231F20"/><rect x="300" y="162" width="58" height="26" fill="#d9f6fb" stroke="#231F20" stroke-width="1.5"/><text x="329.0" y="179" font-size="11" text-anchor="middle">writer</text><path d="M326.0 132.0L382.7 156.4" stroke="#231F20" stroke-width="1.5"/><path d="M391.0 160.0L384.7 151.8L380.8 161.0z" fill="#231F20"/><rect x="362" y="162" width="58" height="26" fill="#d9f6fb" stroke="#231F20" stroke-width="1.5"/><text x="391.0" y="179" font-size="11" text-anchor="middle">designer</text><text x="326" y="210" font-size="12" font-weight="700" text-anchor="middle">new problem → new jobs</text><text x="326" y="238" font-size="12" text-anchor="middle" fill="#5f5a52">report back to the lead</text>
