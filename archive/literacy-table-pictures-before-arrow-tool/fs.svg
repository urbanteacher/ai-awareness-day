  <rect class="i-bg" width="300" height="330"/>
  <text class="t-s" x="104" y="60" letter-spacing="2">3 EXAMPLES</text>
  <path class="i-line" d="M104 72 H220" stroke-opacity=".45"/>
  <rect class="i-paper" x="30" y="100" width="100" height="34" rx="17"/><rect class="i-line" x="30" y="100" width="100" height="34" rx="17"/><text class="t-s" x="80" y="123" text-anchor="middle">dog</text>
<path class="i-line" d="M140 117 H168" marker-end="url(#alpt-arr-fs)"/>
<rect class="i-cream" x="180" y="100" width="100" height="34" rx="17"/><rect class="i-line" x="180" y="100" width="100" height="34" rx="17"/>
<text class="t-s" x="230" y="123" text-anchor="middle">woof</text>
  <rect class="i-paper" x="30" y="144" width="100" height="34" rx="17"/><rect class="i-line" x="30" y="144" width="100" height="34" rx="17"/><text class="t-s" x="80" y="167" text-anchor="middle">cow</text>
<path class="i-line" d="M140 161 H168" marker-end="url(#alpt-arr-fs)"/>
<rect class="i-cream" x="180" y="144" width="100" height="34" rx="17"/><rect class="i-line" x="180" y="144" width="100" height="34" rx="17"/>
<text class="t-s" x="230" y="167" text-anchor="middle">moo</text>
  <rect class="i-paper" x="30" y="188" width="100" height="34" rx="17"/><rect class="i-line" x="30" y="188" width="100" height="34" rx="17"/><text class="t-s" x="80" y="211" text-anchor="middle">sheep</text>
<path class="i-line" d="M140 205 H168" marker-end="url(#alpt-arr-fs)"/>
<rect class="i-cream" x="180" y="188" width="100" height="34" rx="17"/><rect class="i-line" x="180" y="188" width="100" height="34" rx="17"/>
<text class="t-s" x="230" y="211" text-anchor="middle">baa</text>
  <path class="i-line i-dash" d="M24 240 H280"/>
