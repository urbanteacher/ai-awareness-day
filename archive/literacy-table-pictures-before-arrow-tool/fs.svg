  <rect class="i-paper" x="30" y="270" width="100" height="34" rx="17"/><rect class="i-line" x="30" y="270" width="100" height="34" rx="17"/><text class="t-s" x="80" y="293" text-anchor="middle">duck</text>
<path class="i-line" d="M140 287 H168" marker-end="url(#alpt-arr-fs)"/>
<rect class="i-deep" x="180" y="270" width="100" height="34" rx="17"/>
<text class="t-s t-w" x="230" y="293" text-anchor="middle">quack</text>
  <rect class="i-accent" x="268" y="262" width="20" height="20" rx="10"/>
  <text class="t-xs" x="278" y="277" text-anchor="middle">✓</text>
