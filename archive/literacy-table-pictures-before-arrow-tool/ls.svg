  <rect class="i-bg" width="300" height="330"/>
  <rect class="i-paper" x="106" y="22" width="150" height="36" rx="18"/><rect class="i-line" x="106" y="22" width="150" height="36" rx="18"/>
  <text class="t-s" x="181" y="46" text-anchor="middle">Word in: whale</text>
  <rect class="i-paper" x="16" y="96" width="268" height="156" rx="12"/><rect class="i-line" x="16" y="96" width="268" height="156" rx="12"/>
  <g class="i-faint"><path class="i-line" d="M70 100 V248 M124 100 V248 M178 100 V248 M232 100 V248 M20 140 H280 M20 184 H280 M20 228 H280" style="stroke-width:1.5"/></g>
