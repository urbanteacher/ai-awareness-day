  <text class="t-s" x="60" y="198" text-anchor="middle">fish</text>
  <circle class="i-cream" cx="48" cy="218" r="8"/><circle class="i-line" cx="48" cy="218" r="8"/><circle class="i-cream" cx="76" cy="226" r="8"/><circle class="i-line" cx="76" cy="226" r="8"/><circle class="i-cream" cx="52" cy="240" r="8"/><circle class="i-line" cx="52" cy="240" r="8"/>
  <text class="t-s" x="232" y="134" text-anchor="middle">mammals</text>
  <circle class="i-deep" cx="214" cy="150" r="8"/><circle class="i-deep" cx="244" cy="158" r="8"/><circle class="i-deep" cx="226" cy="176" r="8"/>
  <path class="i-line" d="M150 62 C142 120 120 168 112 196" marker-end="url(#alpt-arr-ls)"/>
