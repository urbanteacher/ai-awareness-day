  <rect class="i-cream" x="122" y="178" width="56" height="34" rx="2"/><rect class="i-line" x="122" y="178" width="56" height="34" rx="2"/>
  <path class="i-line" d="M130 190 H168 M130 201 H158" stroke-width="2"/>
