<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Reverse Engineering: a finished robot toy taken apart into its parts to work out how it works. -->
  <defs><marker id="alpt-arr-rv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="i-bg" width="300" height="330"/>
  <path class="i-deep" d="M126 24 H176 L190 38 V84 H126 Z"/>
  <rect class="i-paper" x="138" y="40" width="40" height="24" rx="6"/>
  <circle class="i-ink" cx="150" cy="52" r="3.5"/><circle class="i-ink" cx="166" cy="52" r="3.5"/>
  <text class="t-s" x="200" y="60">Finished</text>
  <path class="i-line" d="M158 94 V122" marker-end="url(#alpt-arr-rv)"/>
  <text class="t-xs" x="170" y="114">Take apart</text>
  <path class="i-line i-dash" d="M16 132 H284 V236 H16 Z" stroke-dasharray="4 5"/>
  <circle class="i-line" cx="60" cy="172" r="24" stroke-width="7" stroke-dasharray="5 4" stroke-linecap="butt"/><circle class="i-paper" cx="60" cy="172" r="20"/><circle class="i-line" cx="60" cy="172" r="20"/><circle class="i-ink" cx="60" cy="172" r="4"/>
  <circle class="i-line" cx="96" cy="204" r="16" stroke-width="7" stroke-dasharray="5 4" stroke-linecap="butt"/><circle class="i-paper" cx="96" cy="204" r="12"/><circle class="i-line" cx="96" cy="204" r="12"/><circle class="i-ink" cx="96" cy="204" r="4"/>
  <text class="t-xs" x="58" y="226" text-anchor="middle">Gears</text>
  <rect class="i-deep" x="134" y="152" width="44" height="44" rx="4"/>
  <path class="i-line" d="M142 146 V152 M156 146 V152 M170 146 V152 M142 196 V202 M156 196 V202 M170 196 V202"/>
  <text class="t-xs" x="156" y="224" text-anchor="middle">Chip</text>
  <rect class="i-paper" x="208" y="156" width="56" height="34" rx="5"/><rect class="i-line" x="208" y="156" width="56" height="34" rx="5"/>
  <rect class="i-ink" x="264" y="166" width="6" height="14" rx="1"/>
  <rect class="i-accent" x="212" y="160" width="28" height="26" rx="3"/>
  <text class="t-xs" x="238" y="224" text-anchor="middle">Battery</text>
  <rect class="i-paper" x="16" y="250" width="268" height="62" rx="8"/><rect class="i-line" x="16" y="250" width="268" height="62" rx="8"/>
  <text class="t-xs" x="30" y="272">How it works:</text>
  <text class="t-s t-d" x="30" y="298">Battery → Chip → Gears</text>
</svg>
