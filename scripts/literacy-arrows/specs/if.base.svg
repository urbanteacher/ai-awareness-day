<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Inference: training (a lot of energy, once) is finished; now the model is used on a new photo and answers bird, 92 per cent sure but able to be wrong, using a little energy every time. Arrows: scripts/literacy-arrows/specs/if.json -->
  <rect class="i-bg" width="300" height="330"/>
  <g transform="translate(-10 0)"><rect class="i-paper" x="120" y="20" width="60" height="52" rx="4"/><rect class="i-line" x="120" y="20" width="60" height="52" rx="4"/>
  <ellipse class="i-deep" cx="146" cy="50" rx="16" ry="10"/><circle class="i-deep" cx="162" cy="38" r="7"/><path class="i-ink" d="M168 36 L176 39 L168 42 Z"/><path class="i-line" d="M140 60 V66 M150 60 V66" style="stroke-width:2"/></g>
  <text class="t-xs" x="178" y="50" text-anchor="start">New photo</text>
  <g transform="translate(111 104) scale(1)"><path class="i-deep" d="M0 0 H44 L58 14 V52 H0 Z"/><rect class="i-paper" x="12" y="16" width="32" height="22" rx="5"/><circle class="i-ink" cx="22" cy="27" r="3.5"/><circle class="i-ink" cx="34" cy="27" r="3.5"/></g>
  <rect class="i-paper" x="212" y="104" width="74" height="52" rx="12"/><rect class="i-line" x="212" y="104" width="74" height="52" rx="12"/><text class="t-s" x="249" y="127" text-anchor="middle">Bird</text><text class="t-xs t-d" x="249" y="146" text-anchor="middle">92% sure</text>
  <text class="t-xs" x="249" y="176" text-anchor="middle">can be wrong</text>
  <text class="t-xs" x="217" y="240" text-anchor="middle" letter-spacing="1">NOW</text><path class="i-ink" d="M210 246 H224 L217 254 Z"/>
  <g><path class="i-paper" d="M16 260 H136 L150 277 L136 294 H16 Z"/><path class="i-line" d="M16 260 H136 L150 277 L136 294 H16 Z"/><text class="t-s" x="78" y="283" text-anchor="middle">Training ✓</text></g>
  <path class="i-deep" d="M146 260 H284 V294 H146 L160 277 Z"/><text class="t-s t-w" x="220" y="283" text-anchor="middle">Inference</text>
  <text class="t-xs" x="83" y="314" text-anchor="middle">Learn from data</text>
  <text class="t-xs" x="215" y="314" text-anchor="middle">Use what was learnt</text>
</svg>
