<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- ReAct: the agent takes turns to think and to act with a tool, until the job is done. Top-left 80x80 stays clear for the symbol badge. Arrows: tools/literacy-arrows/specs/ra.json -->
  <rect class="i-bg" width="300" height="330"/>
  <text class="t-m" x="190" y="42" text-anchor="middle">Reason + Act</text>
  <circle class="i-paper" cx="84" cy="90" r="5"/><circle class="i-line" cx="84" cy="90" r="5"/>
  <rect class="i-paper" x="100" y="64" width="180" height="32" rx="16"/><rect class="i-line i-dash" x="100" y="64" width="180" height="32" rx="16"/>
  <text class="t-s" x="190" y="86" text-anchor="middle">Think: rain later?</text>
  <rect class="i-deep" x="20" y="138" width="180" height="32" rx="6"/>
  <text class="t-s t-w" x="110" y="160" text-anchor="middle">Act: check weather</text>
  <circle class="i-deepline" cx="240" cy="150" r="12"/><path class="i-deepline" d="M249 159 L258 168" stroke-width="6"/>
  <circle class="i-paper" cx="84" cy="238" r="5"/><circle class="i-line" cx="84" cy="238" r="5"/>
  <rect class="i-paper" x="100" y="212" width="180" height="32" rx="16"/><rect class="i-line i-dash" x="100" y="212" width="180" height="32" rx="16"/>
  <text class="t-s" x="190" y="234" text-anchor="middle">Think: rain at 3pm</text>
  <rect class="i-deep" x="20" y="286" width="180" height="32" rx="6"/>
  <text class="t-s t-w" x="110" y="308" text-anchor="middle">Act: move the match</text>
  <circle class="i-accent" cx="244" cy="302" r="16"/>
  <path class="i-line" d="M236 302 l6 6 l10 -12" stroke-width="3.5"/>
</svg>
