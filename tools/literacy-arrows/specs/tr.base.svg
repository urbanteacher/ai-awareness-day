<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" class="alpt-pic">
  <!-- Training: data goes in, the model guesses, the guess is checked, the settings are adjusted, and round by round the score goes up. Arrows: tools/literacy-arrows/specs/tr.json -->
